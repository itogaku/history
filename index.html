const BANK=[{"ev":["-8000:日本列島","-300:稲作","239:卑弥呼"],"k":"l","tk":"e01","ti":"狩りの生活からくにの成立へ","sum":"氷河時代が終わって日本列島ができ、人々は狩りや採集で暮らした。その後、大陸から稲作が伝わると、米をたくわえる富の差や土地・水をめぐる争いが生まれ、むらがまとまってくにができた。やがて邪馬台国の卑弥呼が30ほどのくにを従えた。","tip":"列島ができる→米づくりが始まる→争いの中からくにの王が出る、の順。","st":["日本列島ができたあと縄文時代の人々は狩りや採集で暮らし、その後に大陸から稲作が伝わって弥生時代が始まった。","稲作が広まると、たくわえた米や土地をめぐって争いが起こり、むらがまとまったくにの中から卑弥呼のような王が現れた。"]},{"ev":["-500:釈迦","30:イエス","610:ムハンマド"],"k":"g","tk":"f_w1","ti":"三大宗教のおこり","sum":"紀元前5世紀ごろ、インドで釈迦が仏教を開いた。1世紀の初めにはパレスチナでイエスが教えを説き、のちのキリスト教のもとになった。7世紀にはアラビア半島でムハンマドがイスラム教を開いた。","tip":"『仏教（紀元前）→キリスト教（紀元後すぐ）→イスラム教（7世紀）』。成立順に「ブ・キ・イ」。","st":["紀元前にインドで釈迦が仏教を開き、紀元後の1世紀初めにはパレスチナでイエスがキリスト教のもとになる教えを説いた。","イエスの教えをもとにキリスト教が広まったのち、7世紀にアラビア半島でムハンマドがイスラム教を開いた。"]},{"ev":["-500:釈迦","538:仏教","754:鑑真"],"k":"g","tk":"f_rel","ti":"仏教が日本に根づくまで","sum":"紀元前5世紀ごろインドで釈迦が仏教を開いた。仏教は中国や朝鮮半島に広まり、6世紀に百済から日本に仏教が正式に伝えられた。奈良時代には唐の高僧鑑真が何度も失敗しながら来日し、正式な仏教の教えを伝えた。","tip":"インドで開かれる→朝鮮（百済）から伝わる→唐の僧が来て教えを整える、の順。","st":["インドで釈迦が開いた仏教は、中国や朝鮮半島を通って広まり、6世紀に百済から日本へ仏教が正式に伝えられた。","仏教が伝わってから約200年後の奈良時代に、唐の鑑真が来日し、僧になるための正しいきまりなどを日本に伝えた。"]},{"ev":["-499:孔子","-221:始皇帝","-202:劉邦"],"k":"g","tk":"f_w1","ti":"古代中国の思想と統一","sum":"紀元前5世紀ごろ、国々が争っていた中国で孔子が儒教の教えを説いた。その後、紀元前221年に秦の始皇帝が中国を初めて統一した。しかし秦は短期間でほろび、劉邦が漢を建国した。漢では儒教が国の教えとして重んじられた。","tip":"国々が争う時代に孔子→秦の始皇帝が統一→秦がほろびて劉邦の漢、の順。漢は秦のあと。","st":["孔子は中国が多くの国に分かれて争っていた時代に儒教を説き、その後、秦の始皇帝が中国を初めて統一した。","始皇帝の秦はきびしい政治への反発から短期間でほろび、そのあと劉邦が漢を建国して中国を治めた。"]},{"ev":["-300:稲作","57:金印","239:卑弥呼"],"k":"l","tk":"e01","ti":"くにの成り立ち","sum":"大陸から稲作が伝わると、たくわえた米や土地・水をめぐって争いが起こり、むらがまとまって小さなくにができた。そのうちの奴国の王は漢に使いを送って金印を授けられた。やがてくにどうしの争いをへて、邪馬台国の卑弥呼が30ほどのくにを従え、魏に使いを送った。","tip":"『米づくり→小さなくに（奴国）→くにの連合（邪馬台国）』と、まとまりが大きくなる順に並べる。","st":null},{"ev":["-300:稲作","239:卑弥呼","250:前方後円墳"],"k":"g","tk":"e01","ti":"くにから大和政権へ","sum":"稲作が広まると土地や水をめぐる争いからくにができ、3世紀には邪馬台国の卑弥呼が30ほどのくにを従えた。3世紀後半になると近畿地方を中心に前方後円墳などの大きな古墳がつくられ始め、大和政権が生まれた。まとまりがしだいに大きくなっていった流れである。","tip":"『むら・くに（稲作）→くにの連合（卑弥呼）→大和政権（前方後円墳）』と、まとまりが大きくなる順。","st":["稲作が広まって米や土地・水をめぐる争いが起こり、くにができた。3世紀には卑弥呼が30ほどのくにを従えた。","卑弥呼が魏に使いを送ったあと、3世紀後半には近畿地方を中心に前方後円墳がつくられ始め、大和政権が生まれた。"]},{"ev":["-221:始皇帝","-202:劉邦","589:隋","618:唐"],"k":"g","tk":"f_w1","ti":"中国の王朝の移り変わり","sum":"秦の始皇帝が初めて中国を統一したが、秦はまもなくほろび、劉邦が漢を建てた。漢のあと中国は長く分裂したが、隋が再び統一した。隋はまもなくほろび、唐が中国を統一して律令による国づくりを進めた。","tip":"王朝は『秦→漢→（分裂）→隋→唐』。日本の遣隋使→遣唐使の順とも合わせて覚える。","st":["始皇帝が統一した秦は短い期間でほろび、劉邦が漢を建てて中国を統一した。","劉邦が建てた漢がほろんだあと中国は長く分裂したが、隋が再び中国を統一した。","中国を統一した隋は短い期間でほろび、唐が統一して律令などの制度を整えた。"]},{"ev":["30:イエス","610:ムハンマド","1096:十字軍"],"k":"l","tk":"f_w1","ti":"キリスト教とイスラム教","sum":"1世紀にパレスチナでイエスが説いた教えからキリスト教が生まれた。7世紀にはアラビア半島でムハンマドがイスラム教を開き、イスラム勢力は聖地エルサレムを含む地域に広がった。11世紀末、聖地を支配するイスラム勢力に対し、西ヨーロッパのキリスト教国はローマ教皇のよびかけで聖地の奪回をめざし、1096年に十字軍を送った。","tip":"キリスト教→イスラム教→両者が聖地をめぐって争う十字軍、の順。","st":["イエスの教えからキリスト教が生まれ、約600年後にアラビア半島でムハンマドがイスラム教を開いた。","ムハンマドが開いたイスラム教の勢力が聖地エルサレムを支配したため、キリスト教国は奪回をめざして十字軍を送った。"]},{"ev":["57:金印","239:卑弥呼","478:ワカタケル"],"k":"l","tk":"e01","ti":"中国の歴史書に見る倭","sum":"倭の奴国の王が漢（後漢）に使いを送り、金印を授けられた。3世紀には邪馬台国の女王卑弥呼が魏に使いを送り、「親魏倭王」の称号を得た。5世紀には大和政権の大王ワカタケル（倭王武）が中国の南朝に使いを送り、朝鮮半島での立場を認めさせようとした。","tip":"『漢（奴国・金印）→魏（卑弥呼）→宋（倭王武）』。中国の王朝名とセットで覚える。","st":["金印を授かった奴国の王のあと、3世紀には邪馬台国の女王卑弥呼が魏に使いを送り、30ほどのくにを従える王として認められた。","卑弥呼の時代のあと大和政権が力を広げ、5世紀には大王ワカタケル（倭王武）が中国の南朝に使いを送った。"]},{"ev":["239:卑弥呼","250:前方後円墳","478:ワカタケル"],"k":"l","tk":"e01","ti":"大和政権の成立と拡大","sum":"3世紀、邪馬台国の卑弥呼が魏に使いを送った。3世紀後半には近畿地方を中心に前方後円墳がつくられ始め、大和政権が生まれた。前方後円墳は各地に広がり、5世紀には大王ワカタケルが九州から関東までの豪族を従え、中国の南朝に使いを送った。","tip":"前方後円墳が広がった範囲＝大和政権の力が広がった範囲。古墳ができてから大王ワカタケルが出る。","st":["卑弥呼が魏に使いを送ったあと、3世紀後半には近畿地方を中心に前方後円墳がつくられ始め、大和政権が生まれた。","前方後円墳が各地に広がるとともに大和政権の力も広がり、5世紀には大王ワカタケルが九州から関東までの豪族を従えた。"]},{"ev":["250:前方後円墳","400:高句麗","478:ワカタケル"],"k":"l","tk":"e01","ti":"大和政権と朝鮮半島","sum":"3世紀後半、近畿地方を中心に前方後円墳がつくられ始め、大和政権が生まれた。力をつけた大和政権は4世紀末ごろ百済と結んで高句麗と戦った。5世紀には大王ワカタケル（倭王武）が中国の南朝に使いを送り、朝鮮半島の国々に対して有利な立場に立とうとした。","tip":"『国内でまとまる（古墳）→朝鮮半島で戦う（高句麗）→中国に認めてもらう（ワカタケル）』の順。","st":["前方後円墳がつくられ始めて大和政権が生まれ、力をつけると4世紀末ごろには百済と結んで高句麗と戦った。","高句麗などとの争いで有利な立場に立つため、5世紀には大王ワカタケルが中国の南朝に使いを送った。"]},{"ev":["400:高句麗","478:ワカタケル","538:仏教"],"k":"l","tk":"e01","ti":"朝鮮半島とのつながり","sum":"4世紀末ごろ、大和政権は百済と結んで高句麗と戦った。5世紀には大王ワカタケルが中国の南朝に使いを送り、朝鮮半島での立場を認めさせようとした。こうした朝鮮半島との深いつながりの中で渡来人が多くの技術を伝え、6世紀には百済から仏教が正式に伝えられた。","tip":"戦い（高句麗）→外交（ワカタケル）→文化（仏教）。仏教は6世紀に百済から伝わった。","st":["百済と結んで高句麗と戦った大和政権は、5世紀には大王ワカタケルが南朝に使いを送り、朝鮮半島での立場を認めさせようとした。","ワカタケルの時代のあとも百済との関係は続き、6世紀には百済から仏教が正式に伝えられた。"]},{"ev":["538:仏教","607:法隆寺","752:大仏"],"k":"g","tk":"f_rel","ti":"飛鳥・奈良の仏教文化","sum":"6世紀に百済から仏教が伝えられた。聖徳太子は仏教をあつく信じ、7世紀初めに法隆寺を建てて飛鳥文化が栄えた。奈良時代には聖武天皇が仏教の力で国を守ろうとし、東大寺の大仏が完成した。","tip":"仏教伝来→聖徳太子の寺（飛鳥）→聖武天皇の大仏（奈良）の順。","st":["百済から仏教が伝えられたあと、仏教を重んじた聖徳太子が7世紀の初めに斑鳩に法隆寺を建てた。","法隆寺は飛鳥時代の寺で、大仏はその後の奈良時代に聖武天皇が仏教の力で国を守ろうとしてつくらせたものである。"]},{"ev":["538:仏教","752:大仏","805:最澄"],"k":"l","tk":"f_rel","ti":"仏教の広まりと変化","sum":"百済から伝わった仏教は、奈良時代に国を守る力として重んじられ、聖武天皇は東大寺に大仏をつくらせた。しかし仏教が政治と深く結びつきすぎたことへの反省から、平安時代には唐で学んだ最澄が比叡山延暦寺で山での修行を重んじる天台宗を広めた。","tip":"『伝来→国家の仏教（大仏）→山の仏教（最澄）』。都の寺から山の寺へ移ったと覚える。","st":null},{"ev":["589:隋","607:小野妹子","618:唐"],"k":"g","tk":"f_asia","ti":"隋と遣隋使、そして唐へ","sum":"589年に隋が中国を統一し、強大な国となった。聖徳太子は隋の進んだ制度や文化を学ぶため、607年に小野妹子を遣隋使として送った。しかし隋は長く続かず、618年にほろびて唐が中国を統一した。","tip":"隋が統一したから遣隋使を送れた。唐はそのあとの王朝と覚える。","st":["隋が中国を統一して強い国になったので、聖徳太子はその制度や文化を学ぼうと小野妹子を遣隋使として送った。","小野妹子が派遣されたのは隋の時代で、その約10年後に隋がほろび、唐が中国を統一した。"]},{"ev":["593:聖徳太子","603:冠位十二階","604:十七条の憲法"],"k":"l","tk":"e02","ti":"聖徳太子の政治","sum":"593年、聖徳太子が推古天皇の摂政となり、蘇我馬子と協力して天皇中心の国づくりを始めた。まず603年に冠位十二階を定めて、家柄にとらわれず有能な人を役人に取り立てた。続いて604年に十七条の憲法で、役人としての心構えを示した。","tip":"『摂政になる→人を選ぶ（冠位）→心構えを教える（憲法）』の順。冠位が1年早い。","st":null},{"ev":["604:十七条の憲法","701:大宝律令","1232:御成敗式目"],"k":"g","tk":"f_law","ti":"法とルールの移り変わり","sum":"604年、聖徳太子は十七条の憲法で役人の心構えを示した。701年には唐にならった大宝律令が完成し、律令にもとづく政治のしくみが整った。鎌倉時代には、執権北条泰時が武士の裁判の基準として、武士独自の法である御成敗式目を定めた。","tip":"『心構え（憲法）→国の法律（律令）→武士の法（式目）』。十七条の憲法は今の憲法とは別物。","st":["十七条の憲法は役人の心構えを示したもので、その後、唐にならった大宝律令で刑罰や政治のしくみを定めた法が整った。","大宝律令は朝廷の法だったが、武士の政権である鎌倉幕府は、武士の慣習をもとに御成敗式目を定めて裁判の基準とした。"]},{"ev":["604:十七条の憲法","1889:大日本帝国憲法","1946:日本国憲法"],"k":"g","tk":"f_law","ti":"「憲法」の移り変わり","sum":"飛鳥時代、聖徳太子は役人の心構えを示す十七条の憲法を定めた。明治時代の1889年には、天皇が主権をもつ大日本帝国憲法が発布された。戦後の1946年には、国民主権などを原則とする日本国憲法が公布された。","tip":"役人の心得（飛鳥）→天皇主権（明治）→国民主権（戦後）の順で考える。","st":["十七条の憲法は役人の心構えを示したもので、国のしくみを定めた近代的な憲法は、1889年の大日本帝国憲法が初めてだった。","天皇が主権をもつ大日本帝国憲法にかわり、戦後の1946年には、国民主権を原則とする日本国憲法が公布された。"]},{"ev":["607:小野妹子","645:大化の改新","663:白村江の戦い","672:壬申の乱"],"k":"l","tk":"e02","ti":"7世紀の国づくりと東アジア","sum":"聖徳太子は小野妹子を遣隋使として送り、中国の制度や文化を学ばせた。その後、中大兄皇子らが大化の改新を始めた。百済を助けるために送った軍は白村江の戦いで唐・新羅に敗れた。天智天皇の死後、あとつぎをめぐる壬申の乱が起こり、勝った天武天皇が天皇中心の国づくりを進めた。","tip":"『遣隋使→大化の改新→白村江の敗戦→壬申の乱』。隋に学び、改革し、敗れて守りを固め、争いを経て天皇の力が強まる。","st":["遣隋使の小野妹子らが学んだ中国の制度をもとに、中大兄皇子らは蘇我氏を倒して大化の改新を始めた。","大化の改新で国づくりを進めた中大兄皇子は、百済を助けるため朝鮮半島に軍を送ったが、白村江の戦いで唐・新羅に敗れた。","白村江の敗戦後、中大兄皇子は天智天皇となって守りを固めたが、その死後にあとつぎをめぐる壬申の乱が起こった。"]},{"ev":["607:法隆寺","752:大仏","1053:平等院鳳凰堂","1203:金剛力士像"],"k":"g","tk":"f_cult","ti":"仏教文化財の移り変わり","sum":"飛鳥時代、聖徳太子が法隆寺を建てた（飛鳥文化）。奈良時代には聖武天皇の願いで東大寺の大仏がつくられた（天平文化）。平安時代には浄土信仰が広まり、藤原頼通が平等院鳳凰堂を建てた（国風文化）。鎌倉時代には運慶・快慶らが東大寺南大門の金剛力士像をつくった（鎌倉文化）。","tip":"『飛鳥（法隆寺）→天平（大仏）→国風（平等院）→鎌倉（金剛力士像）』。写真で出されることが多い。","st":["法隆寺に代表される飛鳥文化のあと、奈良時代には仏教で国を守ろうとした聖武天皇が東大寺の大仏をつくらせた（天平文化）。","国家の仏教の象徴である大仏のあと、平安時代には極楽浄土へのあこがれから藤原頼通が平等院鳳凰堂を建てた。","貴族の国風文化の平等院鳳凰堂のあと、鎌倉時代には武士の気風を反映した力強い金剛力士像がつくられた。"]},{"ev":["618:唐","645:大化の改新","701:大宝律令"],"k":"l","tk":"e02","ti":"唐にならった国づくり","sum":"618年に唐が中国を統一し、律令にもとづく強い国をつくった。これにならい、中大兄皇子と中臣鎌足は蘇我氏を倒して大化の改新を始め、天皇中心の国づくりをめざした。その目標は、701年に唐の律令にならった大宝律令が完成して形になった。","tip":"手本となる唐の成立→改革の開始→法律の完成、の順。唐ができる前に唐の律令をまねることはできない。","st":["唐が律令による強い国をつくったことが手本となり、日本でも大化の改新が始まって天皇中心の国づくりがめざされた。","大化の改新で始まった公地公民などの改革は、約50年後に唐にならった大宝律令が完成してしくみが整った。"]},{"ev":["618:唐","894:菅原道真","905:古今和歌集"],"k":"l","tk":"e03","ti":"遣唐使の停止と国風文化","sum":"618年に中国を統一した唐へ、日本は遣唐使を送って制度や文化を学んだ。しかし唐が衰え、航海の危険も大きかったため、894年に菅原道真の提案で遣唐使が停止された。その後、唐の影響がうすれて日本風の国風文化が栄え、かな文字を使った古今和歌集がつくられた。","tip":"『唐に学ぶ→遣唐使停止→日本風の文化』。停止のあとにかな文字の作品が来る。","st":null},{"ev":["630:遣唐使","754:鑑真","894:菅原道真"],"k":"g","tk":"f_asia","ti":"遣唐使の始まりから停止まで","sum":"630年に初めて遣唐使が送られ、日本は唐の制度や文化を学んだ。奈良時代には遣唐使船で唐の高僧鑑真が来日した。しかし唐がおとろえ、航海も危険だったため、894年に菅原道真の提案で遣唐使は停止された。","tip":"遣唐使が始まる→唐の僧が来日する→唐がおとろえて停止、の順。鑑真は奈良時代の人と覚える。","st":["遣唐使が送られるようになって唐との行き来がさかんになり、奈良時代には遣唐使船に乗って鑑真が来日した。","鑑真が来日したころ唐との交流はさかんだったが、その後唐がおとろえ、菅原道真の提案で遣唐使は停止された。"]},{"ev":["645:大化の改新","701:大宝律令","710:平城京"],"k":"l","tk":"e02","ti":"律令国家の完成","sum":"645年、中大兄皇子と中臣鎌足が蘇我氏を倒して大化の改新を始め、公地公民などの改革を進めた。この改革は701年の大宝律令の完成でしくみとして整い、律令国家となった。そして710年、律令にもとづく政治の中心として、唐の長安にならった平城京がつくられた。","tip":"『改革のスタート→法の完成→都の完成』。701と710は近いので『法が先、都が後』で区別。","st":null},{"ev":["645:大化の改新","701:大宝律令","710:平城京","794:平安京"],"k":"l","tk":"f_gov","ti":"古代国家と都の移り変わり","sum":"645年の大化の改新で始まった改革は、701年の大宝律令でしくみとして完成した。律令の政治の中心として710年に平城京がつくられた。しかし奈良では寺院が政治に口を出すようになったため、桓武天皇は政治を立て直そうと、長岡京をへて794年に平安京へ都を移した。","tip":"『改革→法→奈良の都→京都の都』。平城京（710）と平安京（794）は『奈良が先』。","st":null},{"ev":["645:大化の改新","701:大宝律令","743:墾田永年私財法"],"k":"l","tk":"f_land","ti":"公地公民から土地の私有へ","sum":"大化の改新で、豪族が支配していた土地と人民を国家のものとする公地公民の方針が示された。大宝律令で律令国家のしくみが整い、口分田を与える班田収授が行われた。しかし口分田が不足したため墾田永年私財法が出され、開墾した土地の永久私有が認められた。","tip":"『国のものにする（大化）→口分田を配る（大宝律令）→私有を認める（墾田永年私財法）』の順。","st":["大化の改新で示された公地公民の方針は、大宝律令で制度として整い、口分田を与える班田収授が行われた。","大宝律令のもとで人口が増えて口分田が不足したため、開墾した土地の永久私有を認める墾田永年私財法が出された。"]},{"ev":["663:白村江の戦い","672:壬申の乱","701:大宝律令"],"k":"l","tk":"e02","ti":"律令国家の完成まで","sum":"白村江の戦いで唐・新羅に敗れた倭は、唐などの攻撃に備えて守りを固め、国内の政治の仕組みを整えようとした。天智天皇の死後に起こった壬申の乱に勝った天武天皇は、天皇の力を強めて律令づくりを進めた。こうして大宝律令が完成した。","tip":"『敗戦（白村江）→争い（壬申の乱）→完成（大宝律令）』。670年代をはさんで700年ちょうどすぎに完成。","st":["白村江の戦いの敗戦後、中大兄皇子は天智天皇として国内を固めたが、その死後にあとつぎをめぐる壬申の乱が起こった。","壬申の乱に勝った天武天皇が天皇の力を強めて律令づくりを進め、大宝律令の完成につながった。"]},{"ev":["672:壬申の乱","1221:承久の乱","1467:応仁の乱"],"k":"g","tk":"f_war","ti":"あとつぎ・権力をめぐる乱","sum":"飛鳥時代、天智天皇のあとつぎをめぐって壬申の乱が起こった。鎌倉時代には後鳥羽上皇が幕府を倒そうとして承久の乱を起こしたが、幕府軍に敗れた。室町時代には将軍のあとつぎ問題などから応仁の乱が起こり、11年にわたって京都が戦場となった。","tip":"『天皇のあとつぎ（飛鳥）→上皇と幕府（鎌倉）→将軍のあとつぎ（室町）』の順。","st":["天皇のあとつぎをめぐる壬申の乱は飛鳥時代、上皇が幕府を倒そうとした承久の乱は鎌倉時代に起こった。","鎌倉時代の承久の乱では朝廷が幕府に敗れた。室町時代には将軍のあとつぎ問題などから応仁の乱が起こった。"]},{"ev":["701:大宝律令","743:墾田永年私財法","1185:地頭"],"k":"g","tk":"f_land","ti":"公地公民から荘園・地頭へ","sum":"701年の大宝律令で、土地と人民は国のものとする公地公民のしくみが整った。しかし口分田が不足したため、743年に墾田永年私財法で開墾地の永久私有が認められ、荘園が広がった。1185年には源頼朝が荘園や公領ごとに地頭を置いた。","tip":"国の土地（律令）→開墾地の私有を認める→荘園に武士の地頭、と土地が国の手から離れていく順。","st":["大宝律令で公地公民のしくみが整ったが、人口が増えて口分田が足りなくなり、墾田永年私財法で土地の私有が認められた。","墾田永年私財法をきっかけに貴族や寺社の荘園が広がり、1185年には源頼朝が荘園や公領ごとに地頭を置いた。"]},{"ev":["701:大宝律令","743:墾田永年私財法","1582:太閤検地"],"k":"g","tk":"f_land","ti":"荘園の始まりと終わり","sum":"大宝律令で、国が人々に口分田を与える班田収授のしくみが整った。墾田永年私財法で開墾した土地の私有が認められると、貴族や寺社が私有地を広げ、のちの荘園のもとになった。戦国時代のあと、豊臣秀吉が太閤検地を行ったことで荘園のしくみはなくなった。","tip":"『口分田（国の土地）→私有地・荘園の始まり→検地で荘園がなくなる』の順。","st":["大宝律令で班田収授のしくみが整ったが、口分田が不足し、墾田永年私財法で開墾した土地の私有が認められた。","墾田永年私財法をきっかけに広がった荘園は、豊臣秀吉の太閤検地で荘園領主の権利が否定され、なくなった。"]},{"ev":["708:和同開珎","1404:勘合貿易","1636:寛永通宝","1871:円"],"k":"g","tk":"f_money","ti":"日本で使われた貨幣の移り変わり","sum":"奈良時代に唐にならった和同開珎がつくられた。平安時代の半ばには国内で銭がつくられなくなり、宋銭などの輸入銭が使われ、室町時代には勘合貿易で輸入した明銭が広く使われた。江戸幕府は全国共通の寛永通宝をつくり、明治になると新貨条例で円・銭・厘の単位に統一された。","tip":"『国産（和同開珎）→輸入銭（明銭）→幕府の銭（寛永通宝）→近代の通貨（円）』の順。","st":["和同開珎のあと、平安時代の半ばには国内で銭がつくられなくなり、宋銭などの輸入銭が使われ、室町時代には勘合貿易で輸入した明銭が広く使われた。","勘合貿易などで輸入した中国の銭にかわり、江戸幕府は全国共通の銅銭として寛永通宝をつくった。","寛永通宝など江戸時代の金・銀・銭にかわり、明治政府は新貨条例で通貨の単位を円・銭・厘に統一した。"]},{"ev":["710:平城京","752:大仏","794:平安京"],"k":"l","tk":"e02","ti":"奈良の都と仏教、そして平安京へ","sum":"710年に奈良に平城京がつくられた。聖武天皇は仏教の力で国を守ろうとし、752年に東大寺の大仏が完成した。こうして寺院の力が強くなり政治に口を出すようになったため、桓武天皇は政治を立て直そうと794年に都を平安京へ移した。","tip":"奈良の都→仏教が栄えて寺の力が強まる→寺から離れて京都へ移る、の順。大仏は奈良時代のもの。","st":["平城京を都とした奈良時代に、聖武天皇は仏教の力で国を守ろうとして東大寺の大仏をつくらせた。","大仏づくりなどで仏教が保護されて寺院の力が強まりすぎたため、桓武天皇は奈良を離れて平安京に都を移した。"]},{"ev":["712:古事記","720:日本書紀","759:万葉集"],"k":"g","tk":"f_cult","ti":"奈良時代の書物","sum":"国のしくみが整った奈良時代には、国のなりたちを示す歴史書がつくられた。712年に古事記、720年に日本書紀がまとめられた。その後、天皇から防人・農民までの歌を集めた万葉集がまとめられた。","tip":"歴史書は古事記（712年）が先で日本書紀（720年）があと。歌集の万葉集は奈良時代の後半で最後。","st":["神話や天皇家の歴史を記した古事記がまとめられた8年後に、より詳しい歴史書として日本書紀が完成した。","日本書紀などの歴史書がつくられたあと、奈良時代の後半に約4500首の歌を集めた万葉集がまとめられた。"]},{"ev":["743:墾田永年私財法","1185:地頭","1582:太閤検地","1873:地租改正"],"k":"l","tk":"f_land","ti":"土地と税のしくみの変化","sum":"墾田永年私財法をきっかけに荘園が広がり、源頼朝は荘園や公領ごとに地頭を置いた。太閤検地で荘園のしくみはなくなり、百姓が石高に応じて米で年貢を納める形になった。明治時代の1873年、地租改正で地価の3％を現金で納めるしくみに変わった。","tip":"税の納め方は『米（年貢）→現金（地租）』。地租改正は明治政府の財政を安定させるためと覚える。","st":null},{"ev":["743:墾田永年私財法","1582:太閤検地","1873:地租改正"],"k":"g","tk":"f_land","ti":"土地制度の三大転換","sum":"奈良時代の743年、墾田永年私財法で開墾地の私有が認められ、荘園が広がった。安土桃山時代の太閤検地で荘園のしくみはなくなり、石高に応じて米で年貢を納めるようになった。明治時代の1873年の地租改正では、地価の3％を現金で納めるしくみに変わった。","tip":"『奈良（私有を認める）→安土桃山（検地）→明治（現金で納税）』と時代名とセットで覚える。","st":["墾田永年私財法で開墾地の私有が認められて荘園が広がったが、太閤検地で田畑ごとに耕作者を決めて検地帳に記し、荘園のしくみはなくなった。","太閤検地以来、百姓は石高に応じて米で年貢を納めたが、地租改正で地価の3％を土地の所有者が現金で納めるしくみに変わった。"]},{"ev":["759:万葉集","905:古今和歌集","1000:清少納言"],"k":"g","tk":"f_cult","ti":"かな文字と日本の文学","sum":"奈良時代の万葉集は、漢字の音を借りて日本語を書く万葉がなで記された。平安時代にはかな文字が生まれ、905年に紀貫之らが古今和歌集を編集した。かな文字は宮廷の女性にも広まり、清少納言が随筆「枕草子」を書いた。","tip":"漢字の万葉がな（奈良）→かなの和歌集→女性のかな文学、の順。かな文字は平安時代に生まれた。","st":["万葉集は漢字を使う万葉がなで書かれたが、平安時代にはかな文字が生まれ、天皇の命令で古今和歌集が編集された。","古今和歌集のころに広まったかな文字は宮廷の女性たちにも使われ、清少納言はかな文字で「枕草子」を書いた。"]},{"ev":["759:万葉集","1008:紫式部","1330:徒然草"],"k":"g","tk":"f_cult","ti":"古典文学の移り変わり","sum":"奈良時代、天皇から防人・農民までの歌を集めた万葉集がまとめられた。平安時代にはかな文字が広まり、紫式部が「源氏物語」を書いた。鎌倉時代の終わりごろには吉田兼好が随筆「徒然草」を書いた。","tip":"『万葉集（奈良・漢字の万葉がな）→源氏物語（平安・かな文字）→徒然草（鎌倉）』。","st":["万葉がなで書かれた万葉集のあと、平安時代にはかな文字が広まり、紫式部が「源氏物語」を書いた。","紫式部が「源氏物語」を書いた平安時代のあと、鎌倉時代の終わりごろに吉田兼好が随筆「徒然草」を書いた。"]},{"ev":["794:平安京","1016:藤原道長","1086:白河天皇"],"k":"g","tk":"f_gov","ti":"平安時代の政治の中心の移り変わり","sum":"794年に桓武天皇が平安京に都を移し、天皇みずから政治を立て直した。やがて藤原氏が娘を天皇のきさきにして力をのばし、1016年に藤原道長が摂政となって摂関政治が全盛期をむかえた。1086年には白河天皇が上皇となって院政を始めた。","tip":"天皇みずからの政治→藤原氏の摂関政治→上皇の院政、と政治の中心が移っていく順に並べる。","st":["桓武天皇が平安京で天皇中心の政治を立て直したあと、藤原氏が力をのばし、藤原道長のとき摂関政治が全盛となった。","藤原道長・頼通のあと藤原氏の力がおとろえ、白河天皇が位をゆずって上皇となり、院政を始めた。"]},{"ev":["805:最澄","1053:平等院鳳凰堂","1175:法然"],"k":"g","tk":"f_rel","ti":"平安仏教から浄土宗へ","sum":"805年ごろ最澄が比叡山延暦寺で天台宗を広めた。平安時代の中ごろには念仏で極楽浄土に生まれ変わることを願う浄土信仰が広まり、藤原頼通が平等院鳳凰堂を建てた。延暦寺で学んだ法然は、念仏をとなえれば救われると説いて浄土宗を開いた。","tip":"天台宗の開始（平安初め）→貴族の浄土信仰（平安中ごろ）→誰でも救われる浄土宗（平安末）の順。","st":["最澄が天台宗を広めたあと、平安時代の中ごろには浄土信仰が広まり、藤原頼通は極楽浄土をまねた平等院鳳凰堂を建てた。","平等院鳳凰堂のような浄土信仰を受けつぎ、平安時代の終わりに法然が念仏をとなえれば救われると説いて浄土宗を開いた。"]},{"ev":["894:菅原道真","1008:紫式部","1016:藤原道長"],"k":"l","tk":"e03","ti":"国風文化と摂関政治","sum":"894年に菅原道真の提案で遣唐使が停止され、日本の風土に合った国風文化が栄えた。その中で紫式部がかな文字で「源氏物語」を書いた。紫式部が仕えたのは藤原道長の娘で、道長は娘を天皇のきさきにして1016年に摂政となり、摂関政治の全盛期を築いた。","tip":"遣唐使停止（894）が国風文化の出発点。紫式部と道長は同じ時代で、道長の摂政就任が後。","st":null},{"ev":["935:平将門","1156:保元の乱","1159:平治の乱","1167:平清盛"],"k":"l","tk":"f_war","ti":"武士の成長と平氏の政権","sum":"10世紀、関東で平将門が反乱を起こし、地方で武士が力をつけていることが示された。12世紀には天皇と上皇の対立から保元の乱が起こり、武士の力で決着がついた。続く平治の乱で平清盛が源義朝を破り、清盛は武士として初めて太政大臣となった。","tip":"『地方の反乱（将門）→都の争いに武士（保元・平治）→武士が政治の頂点へ（清盛）』。","st":["平将門の反乱など地方で武士が力をのばし、12世紀には都の天皇と上皇の争いである保元の乱も武士の力で決着がついた。","保元の乱で力を示した武士どうしの争いが続き、平治の乱で平清盛が源義朝を破った。","平治の乱に勝った平清盛が勢力をのばし、武士として初めて太政大臣になった。"]},{"ev":["935:平将門","1156:保元の乱","1185:地頭"],"k":"l","tk":"f_war","ti":"武士の成長と武家政権","sum":"10世紀、関東で平将門が反乱を起こしたが、武士の力でしずめられ、武士の力が認められるようになった。12世紀には保元の乱が武士の力で決着し、武士が中央の政治に進出した。やがて源平の争乱で平氏が滅び、源頼朝が守護・地頭を置いて武士の政権を固めた。","tip":"『地方の反乱（平安中期）→都の争い（平安末）→守護・地頭（鎌倉）』と、武士の力が強まる順。","st":["平将門の乱などをしずめて力を認められた武士は、保元の乱では天皇と上皇の争いに決着をつけ、中央の政治に進出した。","保元の乱・平治の乱で力をのばした平氏はやがて滅び、源頼朝が国ごとに守護、荘園や公領ごとに地頭を置いた。"]},{"ev":["1016:藤原道長","1053:平等院鳳凰堂","1124:中尊寺金色堂"],"k":"g","tk":"f_cult","ti":"浄土信仰の広がり","sum":"1016年に藤原道長が摂政となり、藤原氏が栄えた。極楽浄土へのあこがれが貴族の間に広まり、道長の子の頼通は1053年に平等院鳳凰堂を建てた。浄土信仰はやがて地方にも広まり、奥州藤原氏が平泉に中尊寺金色堂を建てた。","tip":"道長→その子頼通の鳳凰堂（京都）→地方の金色堂（平泉）の順。","st":["藤原道長のもとで藤原氏は全盛となり、その子頼通は極楽浄土へのあこがれから宇治に平等院鳳凰堂を建てた。","平等院鳳凰堂のように都で広まった浄土信仰は地方へも伝わり、東北の奥州藤原氏が平泉に中尊寺金色堂を建てた。"]},{"ev":["1016:藤原道長","1086:白河天皇","1156:保元の乱"],"k":"l","tk":"f_gov","ti":"院政と保元の乱","sum":"藤原道長のとき全盛だった摂関政治は、藤原氏と血縁の薄い天皇の即位でおとろえ、1086年に白河天皇が上皇となって院政を始めた。院政のもとで天皇と上皇が対立し、それぞれが武士を味方につけて1156年に保元の乱が起こった。","tip":"『藤原氏→上皇→武士』の順。保元の乱は院政のもとでの天皇と上皇の対立が原因。","st":null},{"ev":["1016:藤原道長","1086:白河天皇","1156:保元の乱","1159:平治の乱"],"k":"l","tk":"f_gov","ti":"武士が政治に進出するまで","sum":"藤原道長の摂関政治がおとろえると、白河天皇が上皇となって院政を始めた。院政のもとで天皇と上皇が対立し、1156年に保元の乱が起こって武士の力で決着がついた。この乱で活躍した平清盛と源義朝が今度は対立し、1159年の平治の乱で清盛が勝った。","tip":"保元の乱（1156）→平治の乱（1159）。どちらも院政のもとでの争いで、平治の乱で平氏が勝つ。","st":null},{"ev":["1016:藤原道長","1086:白河天皇","1167:平清盛","1192:征夷大将軍"],"k":"g","tk":"f_gov","ti":"貴族の政治から武家政権へ","sum":"藤原道長の摂関政治がおとろえると、白河天皇が上皇となって院政を始めた。院政のもとで武士が力をのばし、平清盛が太政大臣となって平氏政権を築いた。平氏が壇ノ浦でほろぶと、源頼朝が1192年に征夷大将軍となり、鎌倉幕府の体制が整った。","tip":"『摂関政治→院政→平氏政権→鎌倉幕府』。武士は平氏→源氏の順で政権をにぎった。","st":["藤原道長・頼通のあと、藤原氏と強い血縁関係のない天皇が即位して摂関政治がおとろえ、白河天皇は上皇となって院政を始めた。","白河天皇（上皇）が始めた院政のもとで武士が朝廷の争いに使われて力をのばし、保元・平治の乱に勝った平清盛が太政大臣となった。","平清盛の一族が朝廷の高い位をひとりじめして反感を買い、平氏をほろぼした源頼朝が征夷大将軍となって鎌倉幕府の体制を整えた。"]},{"ev":["1086:白河天皇","1156:保元の乱","1167:平清盛"],"k":"l","tk":"e03","ti":"院政から武士の政権へ","sum":"1086年に白河天皇が上皇となって院政を始めた。やがて天皇と上皇の対立などから1156年に保元の乱が起こり、武士の力で決着がついた。続く争いにも勝った平清盛は、1167年に武士として初めて太政大臣となった。","tip":"院政→天皇と上皇の争いを武士が決着→武士が政治の頂点へ、の順。","st":["白河天皇が上皇となって院政を始めたあと、天皇と上皇の対立などが深まり、保元の乱が起こった。","保元の乱が武士の力で決着したことで武士の地位が高まり、その後の争いにも勝った平清盛が太政大臣となった。"]},{"ev":["1096:十字軍","1492:コロンブス","1517:ルター"],"k":"l","tk":"f_w1","ti":"中世から近世のヨーロッパ","sum":"聖地エルサレムの奪回をめざして十字軍が派遣され、イスラム世界やアジアとの交流が深まった。その後、アジアの香辛料などを求めて新航路の開拓が進み、コロンブスが西インド諸島に到達した。さらにルターが教会を批判して宗教改革を始めた。","tip":"『十字軍（11世紀末）→大航海（15世紀末）→宗教改革（16世紀前半）』。","st":["十字軍などでアジアへの関心が高まり、香辛料などを求めて新しい航路の開拓が進む中、コロンブスが大西洋を横断して西インド諸島に到達した。","大航海時代が始まったころ、ドイツではルターが免罪符を売る教会を批判し、宗教改革を始めた。"]},{"ev":["1159:平治の乱","1167:平清盛","1185:地頭"],"k":"l","tk":"e04","ti":"平氏の繁栄と滅亡","sum":"1159年の平治の乱で平清盛が源義朝を破り、平氏の力が強まった。1167年に清盛は武士として初めて太政大臣となり、平氏一族が高い位を独占した。しかし平氏への不満が高まり、1185年に壇ノ浦の戦いで平氏が滅び、源頼朝が守護と地頭を置いた。","tip":"平氏が源氏に勝つ→平氏の全盛→平氏が滅んで源氏の地頭、の順。","st":["平治の乱で源義朝を破った平清盛は朝廷で力をのばし、武士として初めて太政大臣となった。","平清盛のもとで平氏が高い位を独占したため不満が高まり、壇ノ浦で平氏が滅んだあと源頼朝が地頭を置いた。"]},{"ev":["1167:平清盛","1185:地頭","1192:征夷大将軍"],"k":"l","tk":"e04","ti":"武家政権の始まり","sum":"平清盛が武士として初めて太政大臣となり平氏が高い地位を独占したが、反発した源氏が兵をあげ、1185年に壇ノ浦で平氏を滅ぼした源頼朝が守護・地頭を置いた。さらに1192年、頼朝は征夷大将軍に任命され、鎌倉幕府のしくみが整った。","tip":"守護・地頭（1185年）が先で、征夷大将軍（1192年）があと。順番の逆転に注意。","st":null},{"ev":["1167:平清盛","1404:勘合貿易","1601:朱印船貿易"],"k":"g","tk":"f_trade","ti":"中国・東南アジアとの貿易","sum":"平安時代末、平清盛は兵庫の港（大輪田泊）を整え、宋との貿易に力を入れた。室町時代には足利義満が、倭寇と区別するために勘合を用いる勘合貿易を明と始めた。江戸時代の初めには徳川家康が海外に渡る船に朱印状を与え、東南アジアとの朱印船貿易がさかんになった。","tip":"『日宋貿易（平氏）→日明貿易（足利義満）→朱印船貿易（徳川家康）』。相手は宋→明→東南アジア。","st":["平清盛は宋との貿易を進めた。室町時代には足利義満が明と勘合貿易を始め、正式な貿易船に勘合を持たせた。","勘合貿易は室町時代の明との貿易。江戸時代初めには徳川家康が朱印状を与え、東南アジアとの朱印船貿易が行われた。"]},{"ev":["1167:平清盛","1404:勘合貿易","1636:寛永通宝"],"k":"g","tk":"f_money","ti":"輸入した銭から国産の銭へ","sum":"平安時代末、平清盛は日宋貿易に力を入れ、輸入された宋銭が日本で使われるようになった。室町時代には足利義満が勘合貿易を始め、輸入された明銭が広く流通した。江戸時代になると幕府が全国共通の銅銭として寛永通宝をつくり、全国に広まった。","tip":"『宋銭（平氏）→明銭（足利義満）→寛永通宝（江戸幕府）』。中国の王朝は宋→元→明の順。","st":["平清盛が進めた日宋貿易で宋銭が輸入された。室町時代には勘合貿易が始まり、明銭が大量に輸入された。","勘合貿易などで輸入された明銭が使われていたが、江戸時代に幕府が寛永通宝をつくり、全国に広まった。"]},{"ev":["1175:法然","1195:栄西","1227:道元"],"k":"g","tk":"f_rel","ti":"鎌倉仏教（念仏と禅宗）","sum":"鎌倉時代には新しい仏教が生まれた。まず法然が念仏をとなえれば救われると説いて浄土宗を開いた。続いて宋で学んだ栄西が臨済宗を広め、さらに同じく宋から帰った道元が座禅によって悟りをめざす曹洞宗を広めた。","tip":"平安末の法然が最初。禅宗は臨済宗の栄西が先で、曹洞宗の道元があと。","st":["法然が念仏による浄土宗を開いたあと、宋で学んだ栄西が座禅を重んじる禅宗（臨済宗）を伝えた。","栄西が臨済宗を広めたあと、のちに宋から帰国した道元が、ひたすら座禅を行う曹洞宗を広めた。"]},{"ev":["1175:法然","1224:親鸞","1274:一遍"],"k":"g","tk":"f_rel","ti":"念仏の教えの広がり","sum":"法然が念仏をとなえれば救われると説いて浄土宗を開いた。その弟子の親鸞は、阿弥陀仏の救いを信じることを重んじる浄土真宗を開いた。さらにのちには一遍が踊念仏で各地をまわり、時宗を広めて念仏の教えを民衆に広げた。","tip":"師の法然→弟子の親鸞→元寇のころの一遍と、念仏の教えが受けつがれた順。","st":["法然が念仏で救われると説いて浄土宗を開き、その弟子の親鸞が教えを深めて浄土真宗を開いた。","親鸞が浄土真宗を開いたあと、鎌倉時代の後半には一遍が踊念仏で時宗を広め、念仏を民衆に広めた。"]},{"ev":["1175:法然","1224:親鸞","1488:加賀の一向一揆"],"k":"l","tk":"f_rel","ti":"浄土の教えの広がり","sum":"法然が念仏をとなえれば救われると説いて浄土宗を開き、その弟子の親鸞が阿弥陀仏を信じる心を重んじる浄土真宗（一向宗）を開いた。浄土真宗は室町時代に農民などの間に広まり、信者たちが団結して守護大名を倒す加賀の一向一揆を起こした。","tip":"『師（法然）→弟子（親鸞）→信者の一揆』の順。一向宗＝浄土真宗と結びつける。","st":null},{"ev":["1185:地頭","1192:征夷大将軍","1221:承久の乱","1232:御成敗式目"],"k":"l","tk":"e04","ti":"鎌倉幕府の成立と発展","sum":"源頼朝が守護・地頭を置き、征夷大将軍に任命されて鎌倉幕府が成立した。源氏の将軍が絶えると後鳥羽上皇が承久の乱を起こしたが敗れ、幕府の力は西日本にも広がった。土地をめぐる争いが増えたため、執権北条泰時が裁判の基準として御成敗式目を定めた。","tip":"承久の乱（1221年）の11年後に御成敗式目（1232年）。乱のあとの争いを裁くための法と考える。","st":null},{"ev":["1192:征夷大将軍","1221:承久の乱","1232:御成敗式目"],"k":"l","tk":"e04","ti":"承久の乱と執権政治","sum":"源頼朝が征夷大将軍となって鎌倉幕府を開いたが、源氏の将軍は3代で絶えた。これを機に後鳥羽上皇が承久の乱を起こしたが、幕府軍に敗れた。乱のあと幕府の支配は西日本にも広がり、執権北条泰時が武士の裁判の基準として御成敗式目を定めた。","tip":"『幕府の成立→朝廷の反撃と失敗→北条氏の法づくり』の順。御成敗式目は執権の時代。","st":null},{"ev":["1192:征夷大将軍","1221:北条政子","1232:御成敗式目"],"k":"l","tk":"e04","ti":"御恩と奉公から執権政治へ","sum":"源頼朝は征夷大将軍となり、御家人に御恩を与えて奉公させる関係で幕府を支えた。頼朝の死後、承久の乱が起こると北条政子が頼朝の御恩を説いて御家人を結束させ、幕府が勝利した。その後、執権北条泰時が御成敗式目を定めた。","tip":"頼朝が将軍→頼朝の死後に妻の政子が演説→北条氏の執権が法を定める順。","st":["源頼朝が征夷大将軍となって築いた御恩と奉公の関係を、承久の乱のとき北条政子が御家人に説き、結束させた。","北条政子の訴えで幕府が承久の乱に勝ち、北条氏の力が強まると、執権北条泰時が御成敗式目を定めた。"]},{"ev":["1206:チンギス・ハン","1271:フビライ","1274:文永の役","1281:弘安の役"],"k":"l","tk":"f_w1","ti":"モンゴル帝国と元寇","sum":"1206年にチンギス・ハンがモンゴルの諸部族を統一してモンゴル帝国を築いた。孫のフビライは1271年に国号を元と定め、日本にも服属を求めた。鎌倉幕府がこれを拒んだため、元は1274年の文永の役、1281年の弘安の役と2度九州北部に攻めてきた。","tip":"チンギスが祖父、フビライが孫。元ができてから日本へ2度襲来。","st":["チンギス・ハンがモンゴル帝国を築いたあと、孫のフビライが中国北部を支配して国号を元と定めた。","フビライは日本に服属を求めたが、鎌倉幕府の北条時宗が拒んだため、元軍が九州北部を攻める文永の役が起きた。","文永の役で元軍は引きあげたが、フビライは再び大軍を送り、7年後に弘安の役が起こった。"]},{"ev":["1274:文永の役","1281:弘安の役","1297:徳政令"],"k":"l","tk":"f_war","ti":"元寇と御家人の苦しみ","sum":"元の大軍が九州北部に襲来した（文永の役）。幕府は博多湾に石塁を築いて備え、元の再度の襲来（弘安の役）も退けた。しかし防衛戦だったため御家人は十分な恩賞を得られず、生活に苦しんだ。幕府は御家人を救うため徳政令を出した。","tip":"『文永（1274）→弘安（1281）→徳政令（1297）』。「文」が先、「弘」があと。","st":["文永の役のあと幕府は博多湾に石塁を築いて備え、再び襲来した元軍を弘安の役で退けた。","弘安の役まで続いた防衛戦では新しい領地が得られず、恩賞の少ない御家人が苦しんだため、幕府は徳政令を出した。"]},{"ev":["1274:文永の役","1297:徳政令","1333:後醍醐天皇"],"k":"l","tk":"e04","ti":"元寇から鎌倉幕府の滅亡へ","sum":"元が文永の役で襲来し、御家人は戦ったが新しい領地を得られず、生活が苦しくなった。幕府は徳政令を出して御家人を救おうとしたが、かえって混乱が広がり、幕府への不満が高まった。この中で後醍醐天皇が足利尊氏らの協力を得て幕府を滅ぼした。","tip":"元寇→ほうびが少なく困った御家人を救う徳政令→幕府の滅亡、と原因から結果の順。","st":["文永の役などの元寇で御家人は恩賞を十分にもらえず生活が苦しくなり、幕府は徳政令を出して救おうとした。","徳政令の効果は少なく御家人の不満が高まり、後醍醐天皇が足利尊氏らの協力で鎌倉幕府を滅ぼした。"]},{"ev":["1281:弘安の役","1297:徳政令","1333:後醍醐天皇"],"k":"l","tk":"e04","ti":"元寇と鎌倉幕府の滅亡","sum":"弘安の役など2度の元寇で御家人は重い負担をしたが、新しい土地を得られず恩賞は不十分だった。生活に苦しむ御家人を救うため幕府は徳政令を出したが、かえって混乱し、幕府への不満が高まった。その中で後醍醐天皇が足利尊氏らの協力を得て鎌倉幕府を滅ぼした。","tip":"『元寇→恩賞不足→徳政令→幕府滅亡』の因果で覚える。永仁の徳政令は、御家人が手放した土地をただで取り戻させる命令。","st":null},{"ev":["1333:後醍醐天皇","1334:建武の新政","1338:足利尊氏"],"k":"l","tk":"e05","ti":"鎌倉幕府滅亡から室町幕府へ","sum":"後醍醐天皇は足利尊氏らの協力を得て鎌倉幕府を滅ぼし、天皇中心の建武の新政を始めた。しかし公家を重んじる政治に武士の不満が高まり、足利尊氏が兵をあげて新政は約2年でくずれた。尊氏は征夷大将軍となり、京都に幕府を開いた。","tip":"幕府を倒す→天皇の政治を始める→武士の不満から尊氏が幕府を開く順。","st":["後醍醐天皇が足利尊氏らの協力で鎌倉幕府を滅ぼし、翌年から天皇中心の建武の新政を始めた。","建武の新政が武士の不満を招くと足利尊氏が兵をあげ、征夷大将軍となって京都に幕府を開いた。"]},{"ev":["1334:建武の新政","1338:足利尊氏","1392:南北朝"],"k":"l","tk":"e05","ti":"建武の新政から南北朝統一","sum":"後醍醐天皇が建武の新政を始めたが、公家を重んじたため武士の不満を招き、足利尊氏が兵をあげて1338年に京都に幕府を開いた。尊氏が立てた北朝と、吉野に移った後醍醐天皇の南朝が約60年対立したが、1392年に3代将軍足利義満が南北朝を統一した。","tip":"『新政の失敗→尊氏の幕府→南北朝の統一（義満）』。尊氏が始め、義満がまとめた。","st":null},{"ev":["1334:建武の新政","1338:足利尊氏","1392:南北朝","1404:勘合貿易"],"k":"l","tk":"e05","ti":"室町幕府の成立と発展","sum":"後醍醐天皇の建武の新政が武士の不満を招き、足利尊氏が京都に幕府を開いた。北朝と南朝の対立は約60年続いたが、3代将軍足利義満が南北朝を統一した。力を強めた義満は明と国交を開き、倭寇と区別するため勘合を用いた勘合貿易を始めた。","tip":"南北朝の統一（1392年）も勘合貿易（1404年）も義満。統一が先、貿易があと。","st":null},{"ev":["1338:足利尊氏","1467:応仁の乱","1573:室町幕府"],"k":"l","tk":"e05","ti":"室町幕府の始まりから滅亡まで","sum":"足利尊氏が征夷大将軍となって京都に室町幕府を開いた。のちに将軍のあとつぎ問題などから応仁の乱が起こり、幕府の力は弱まって戦国時代となった。最後には織田信長が将軍足利義昭を京都から追放し、室町幕府は滅んだ。","tip":"尊氏が開く→応仁の乱で弱まる→信長が滅ぼす、と幕府の一生の順で考える。","st":["足利尊氏が京都に開いた幕府は、のちに将軍のあとつぎ問題などから起こった応仁の乱で力が弱まった。","応仁の乱のあと下剋上の戦国時代となり、織田信長が足利義昭を追放して室町幕府を滅ぼした。"]},{"ev":["1392:南北朝","1397:金閣","1404:勘合貿易"],"k":"g","tk":"e05","ti":"足利義満の時代","sum":"3代将軍足利義満は、およそ60年続いた南北朝の対立を終わらせて統一し、幕府の力を高めた。その後、京都の北山に金閣を建て、さらに明との間で勘合という合い札を用いた勘合貿易を始めて、大きな利益を得た。","tip":"義満はまず南北朝の統一、次に金閣、最後に明との勘合貿易の順。","st":["足利義満が南北朝を統一して幕府の権力を強めたあと、義満は京都の北山にはなやかな金閣を建てた。","金閣を建てた足利義満は、その後明との間で勘合を用いた勘合貿易を始め、幕府に利益をもたらした。"]},{"ev":["1392:南北朝","1404:勘合貿易","1467:応仁の乱"],"k":"l","tk":"e05","ti":"室町幕府の全盛と衰え","sum":"3代将軍足利義満は南北朝を統一し、室町幕府は全盛期をむかえた。義満は明との間で勘合貿易を始め、大きな利益を得た。しかし8代将軍足利義政のころ、将軍のあとつぎ問題などから応仁の乱が起こり、幕府の力は衰えて戦国時代へと向かった。","tip":"『統一（南北朝）→貿易（勘合）は義満、乱（応仁）は義政』。将軍の代で区別する。","st":["南北朝を統一して幕府の全盛期を築いた足利義満は、明との間で勘合貿易を始めた。","義満の勘合貿易で栄えた室町幕府も、のちに将軍のあとつぎ問題などから応仁の乱が起こって力を失った。"]},{"ev":["1397:金閣","1489:銀閣","1576:安土城"],"k":"g","tk":"f_cult","ti":"室町から桃山の建築","sum":"足利義満は京都の北山に、はなやかな金閣を建てた（北山文化）。のちに足利義政は東山に、書院造を取り入れた落ち着いた銀閣を建てた（東山文化）。さらに安土桃山時代には、織田信長が天守をもつ壮大な安土城を築き始めた。","tip":"3代義満の金閣→8代義政の銀閣→戦国を終わらせる信長の安土城の順。","st":["足利義満が北山に金閣を建てたあと、8代将軍足利義政が東山に書院造を取り入れた銀閣を建てた。","東山文化の銀閣のあと、安土桃山時代に織田信長が天守をもつ壮大な安土城を築き、桃山文化が開かれた。"]},{"ev":["1397:金閣","1489:銀閣","1587:千利休"],"k":"g","tk":"f_cult","ti":"室町から桃山の文化","sum":"室町時代、3代将軍足利義満が北山に金閣を建て、北山文化が栄えた。8代将軍足利義政は東山に銀閣を建て、書院造などの東山文化が生まれ、茶の湯も広まった。安土桃山時代には豊臣秀吉に仕えた千利休が、わび茶を大成した。","tip":"北山（金閣）→東山（銀閣）→桃山（千利休）。『北→東→桃』と文化の名前で並べる。","st":["足利義満が建てた金閣は北山文化を代表し、のちに足利義政が銀閣を建てて、簡素で落ち着いた東山文化が生まれた。","足利義政が銀閣を建てた東山文化のころ茶の湯が広まり、安土桃山時代に千利休がわび茶として大成した。"]},{"ev":["1400:世阿弥","1587:千利休","1603:出雲の阿国"],"k":"g","tk":"f_cult","ti":"能・茶の湯・歌舞伎","sum":"室町時代、足利義満の保護を受けた観阿弥の子世阿弥が能を大成した。安土桃山時代には千利休が茶の湯をわび茶として完成させ、豊臣秀吉の茶会を取りしきった。江戸時代の初めには出雲の阿国がかぶき踊りを始め、歌舞伎のもとになった。","tip":"室町の能（世阿弥）→桃山の茶の湯（利休）→江戸初めの歌舞伎（阿国）の順。","st":["室町時代に世阿弥が能を大成したあと、安土桃山時代には千利休がわび茶の作法を完成させた。","豊臣秀吉に仕えた千利休が茶の湯を大成したあと、江戸時代の初めに出雲の阿国がかぶき踊りを始めて歌舞伎のもとになった。"]},{"ev":["1404:勘合貿易","1577:楽市・楽座","1636:寛永通宝"],"k":"g","tk":"f_money","ti":"商業の発達と貨幣","sum":"室町時代、勘合貿易で明銭が大量に輸入され、定期市などでの売り買いに使われて商業が発達した。戦国時代、織田信長は安土城下で楽市・楽座を行い、市の税を免除したり座の特権をなくしたりして商工業を活発にした。江戸時代には幕府が全国共通の銅銭として寛永通宝をつくった。","tip":"『明銭が広まる（室町）→自由な商売（信長）→全国共通の銭（江戸）』の順。","st":["勘合貿易で輸入された明銭が商業の発達を支え、戦国時代には織田信長が楽市・楽座で城下の商工業を活発にしようとした。","楽市・楽座などで商業がさかんになったあと、江戸時代には幕府が寛永通宝をつくり、全国で同じ銭が使われるようになった。"]},{"ev":["1428:正長の土一揆","1467:応仁の乱","1485:山城国一揆"],"k":"g","tk":"f_people","ti":"室町時代の民衆の動き","sum":"近江の馬借を中心に、借金の帳消しを求める正長の土一揆が起こった。その後、応仁の乱で守護大名どうしが争い、京都が焼け野原になった。乱の影響で争いが続く中、山城国一揆で武士と農民が守護大名の軍を追い出し、自治を行った。","tip":"借金帳消しの土一揆が先。応仁の乱のあと、守護大名を追い出す山城国一揆。","st":["正長の土一揆のように民衆が団結して借金の帳消しを求める動きが広がる一方、幕府では将軍のあとつぎ問題などから守護大名どうしの対立が深まり、応仁の乱が起こった。","応仁の乱のあとも守護大名の争いが続いたため、山城国一揆で武士と農民が守護大名を追い出した。"]},{"ev":["1428:正長の土一揆","1485:山城国一揆","1488:加賀の一向一揆"],"k":"l","tk":"f_people","ti":"室町時代の一揆","sum":"近江の馬借を中心に、借金の帳消しを求める正長の土一揆が起こった。応仁の乱のあと、山城国一揆では武士と農民が守護大名を追い出して8年間自治を行った。加賀の一向一揆では浄土真宗の信者たちが守護大名を倒し、約100年間自治を行った。","tip":"『土一揆（借金帳消し）→国一揆（山城・8年の自治）→一向一揆（加賀・約100年の自治）』。","st":null},{"ev":["1429:琉球王国","1609:琉球","1879:沖縄県","1972:沖縄"],"k":"l","tk":"f_ns","ti":"琉球・沖縄の歴史","sum":"尚氏が沖縄島を統一して琉球王国を建て、中継貿易で栄えた。江戸時代の初めに薩摩藩が琉球を攻めて支配下に置いたが、王国は中国との関係も続けた。明治政府は琉球藩を廃止して沖縄県を置いた（琉球処分）。戦後はアメリカの統治下に置かれ、1972年に沖縄が日本に返還された。","tip":"『王国の成立→薩摩の支配→沖縄県（琉球処分）→アメリカから返還』。","st":["中継貿易で栄えた琉球王国は、江戸時代の初めに薩摩藩に攻められ、その支配を受けるようになった。","薩摩藩の支配を受けながら中国とも関係を続けていた琉球を、明治政府は琉球処分で沖縄県とし、日本の領土に組み入れた。","沖縄県は太平洋戦争で地上戦の場となり、戦後はアメリカの統治下に置かれたが、復帰運動の結果1972年に日本に返還された。"]},{"ev":["1457:コシャマイン","1669:シャクシャイン","1869:北海道"],"k":"l","tk":"f_ns","ti":"アイヌの人々と蝦夷地","sum":"室町時代、蝦夷地に進出した和人に対して、アイヌの人々はコシャマインを中心に戦った。江戸時代には松前藩との不利な取り引きに反発し、シャクシャインを指導者として戦ったが敗れた。明治政府は蝦夷地を北海道と改め、開拓使を置いて開拓を進めた。","tip":"『コシャマイン（室町）→シャクシャイン（江戸）→北海道（明治）』。「コ」→「シ」と五十音順にならぶと覚えるとよい。","st":null},{"ev":["1467:応仁の乱","1485:山城国一揆","1488:加賀の一向一揆"],"k":"l","tk":"e05","ti":"応仁の乱と下剋上","sum":"将軍のあとつぎ問題などから応仁の乱が起こり、京都は焼け野原になった。乱のあとも争いを続ける守護大名の軍を、山城国一揆で武士と農民が追い出して自治を行った。さらに一向宗の信者が守護大名を倒す加賀の一向一揆が起こり、下剋上の風潮が広がった。","tip":"応仁の乱が下剋上のスタート。山城（1485年）と加賀（1488年）は3年差で山城が先。","st":null},{"ev":["1489:銀閣","1587:千利休","1688:井原西鶴"],"k":"g","tk":"f_cult","ti":"東山・桃山・元禄の文化","sum":"室町時代に足利義政が銀閣を建てて東山文化が生まれた。安土桃山時代には豪華な桃山文化が栄え、千利休が茶の湯を大成した。江戸時代になると町人が力をつけ、上方を中心とした元禄文化の中で井原西鶴が浮世草子で町人の生活をえがいた。","tip":"文化は『東山（室町）→桃山（安土桃山）→元禄（江戸前半）』の順。担い手が武士から町人へ移る。","st":["銀閣に代表される室町時代の東山文化のあと、安土桃山時代には千利休が茶の湯を大成するなど豪華な桃山文化が栄えた。","千利休の桃山文化は大名や大商人が担ったが、江戸時代の元禄文化では井原西鶴のように町人の生活をえがく作家が活躍した。"]},{"ev":["1492:コロンブス","1498:バスコ・ダ・ガマ","1519:マゼラン"],"k":"g","tk":"f_w2","ti":"大航海時代","sum":"アジアの香辛料などを求めて、ヨーロッパの国々は新しい航路を開こうとした。コロンブスが大西洋を横断して西インド諸島に到達し、バスコ・ダ・ガマがアフリカ南端を回ってインドに着いた。さらにマゼランの船隊が世界一周に出発し、のちに達成した。","tip":"『コロンブス（アメリカ大陸方面）→バスコ・ダ・ガマ（インド）→マゼラン（世界一周）』。","st":["コロンブスが大西洋を西へ進んで西インド諸島に到達したのに続き、バスコ・ダ・ガマはアフリカ南端を回ってインドへの航路を開いた。","バスコ・ダ・ガマがインド航路を開いたあと、マゼランの船隊が世界一周に出発し、1522年に達成して地球が丸いことが確かめられた。"]},{"ev":["1498:バスコ・ダ・ガマ","1543:鉄砲","1549:フランシスコ・ザビエル"],"k":"l","tk":"f_west","ti":"ポルトガル人のアジア進出と日本","sum":"バスコ・ダ・ガマがアフリカ南端を回ってインドに到達する航路を開き、ポルトガルはアジアへ進出した。やがてポルトガル人を乗せた中国船が種子島に流れ着いて鉄砲が伝わり、続いてイエズス会のフランシスコ・ザビエルが鹿児島に来てキリスト教を伝えた。","tip":"インド航路が開ける→ポルトガル人が日本に来て鉄砲→宣教師がキリスト教の順。","st":["バスコ・ダ・ガマがインド航路を開いてポルトガルがアジアに進出し、その人々が種子島に来て鉄砲を伝えた。","鉄砲の伝来でポルトガル人との交流が始まり、その後イエズス会のフランシスコ・ザビエルが鹿児島に来た。"]},{"ev":["1517:ルター","1534:イエズス会","1549:フランシスコ・ザビエル"],"k":"l","tk":"f_west","ti":"宗教改革とキリスト教の伝来","sum":"ドイツでルターが教会の免罪符販売を批判して宗教改革を始め、プロテスタントが生まれた。これに対抗してカトリック側ではロヨラやザビエルらがイエズス会をつくり、海外布教に力を入れた。イエズス会のフランシスコ・ザビエルが鹿児島に来て、日本にキリスト教を伝えた。","tip":"『宗教改革（ルター）→対抗してイエズス会→ザビエル来日』。原因と結果でつながる。","st":["ルターの宗教改革でプロテスタントが広がると、カトリック側はこれに対抗してイエズス会をつくり、海外への布教を進めた。","海外布教を進めたイエズス会の宣教師フランシスコ・ザビエルが鹿児島に来て、日本にキリスト教を伝えた。"]},{"ev":["1517:ルター","1534:イエズス会","1582:天正遣欧使節"],"k":"l","tk":"f_rel","ti":"宗教改革とカトリックの海外布教","sum":"ルターが免罪符の販売を批判して宗教改革を始めた。これに対しカトリック側ではイエズス会がつくられ、アジアなど海外での布教に力を入れた。その結果、日本でもキリシタン大名が生まれ、4人の少年がローマ教皇のもとへ天正遣欧使節として送られた。","tip":"宗教改革→カトリックの立て直し（イエズス会）→布教の成果で日本からローマへ使節。","st":["ルターの宗教改革でプロテスタントが広まると、カトリック側は勢力を立て直すためにイエズス会をつくった。","イエズス会が日本で布教してキリシタン大名が生まれ、その大名たちが少年を天正遣欧使節としてローマへ送った。"]},{"ev":["1543:鉄砲","1575:長篠の戦い","1590:全国統一"],"k":"l","tk":"f_tech","ti":"鉄砲の伝来と天下統一","sum":"種子島に流れ着いたポルトガル人によって鉄砲が伝わり、堺などで大量につくられるようになった。織田信長は長篠の戦いで鉄砲を有効に使い、武田氏の騎馬隊を破った。鉄砲による戦い方の変化が統一を早め、豊臣秀吉が全国統一を成しとげた。","tip":"『伝来（種子島）→活用（長篠）→統一（秀吉）』。鉄砲が戦い方を変えた流れ。","st":["種子島に伝わった鉄砲は国内で大量につくられるようになり、織田信長は長篠の戦いで鉄砲を有効に使って武田勝頼を破った。","長篠の戦いのように鉄砲で戦い方が変わる中、信長のあとをついだ豊臣秀吉が全国統一を成しとげた。"]},{"ev":["1543:鉄砲","1601:朱印船貿易","1641:出島"],"k":"g","tk":"f_trade","ti":"南蛮貿易から鎖国へ","sum":"1543年、ポルトガル人を乗せた船が種子島に流れ着いて鉄砲が伝わり、やがてポルトガルやスペインとの南蛮貿易が始まった。江戸時代の初めには朱印船貿易がさかんになり、東南アジアに日本町ができた。しかしキリスト教の禁止が強まり、1641年にオランダ商館が出島に移されて鎖国の体制が固まった。","tip":"『ヨーロッパ人の来航（鉄砲）→日本人が海外へ（朱印船）→出島に限る（鎖国）』の順。","st":["鉄砲伝来のあとポルトガルなどとの南蛮貿易が始まり、江戸時代の初めには朱印船貿易で日本人が東南アジアへ出かけた。","朱印船貿易はさかんだったが、幕府は日本人の海外渡航を禁止し、1641年にはオランダ商館を出島に移した。"]},{"ev":["1549:フランシスコ・ザビエル","1582:天正遣欧使節","1587:バテレン追放令"],"k":"l","tk":"f_west","ti":"キリスト教の広まりと禁止","sum":"イエズス会のフランシスコ・ザビエルが鹿児島に来てキリスト教を伝え、西日本を中心に信者が増えた。九州のキリシタン大名は4人の少年をローマ教皇のもとに送った（天正遣欧使節）。しかし豊臣秀吉はキリスト教の広まりを警戒し、バテレン追放令を出して宣教師を国外に追放しようとした。","tip":"『伝来（ザビエル）→広まり（使節）→禁止へ（秀吉の追放令）』。","st":["ザビエルが伝えたキリスト教は九州などで広まり、キリシタン大名が少年たちをローマに送る天正遣欧使節も行われた。","天正遣欧使節を送るほどキリシタン大名が増え、長崎が教会に寄進されたことなどを警戒した秀吉は、バテレン追放令を出した。"]},{"ev":["1549:フランシスコ・ザビエル","1587:バテレン追放令","1613:禁教令"],"k":"g","tk":"f_west","ti":"キリスト教の伝来と禁止","sum":"1549年、ザビエルが鹿児島に来てキリスト教を伝え、信者が増えた。キリシタン大名も現れたが、豊臣秀吉は1587年にバテレン追放令を出して宣教師を追放しようとした。江戸幕府はさらに1613年に禁教令を全国に広げ、キリスト教を全面的に禁止した。","tip":"『伝来（ザビエル）→秀吉が宣教師を追放→幕府が全面禁止』と、取りしまりがだんだん強まる順。","st":["フランシスコ・ザビエルが伝えたキリスト教は広まったが、長崎が教会に寄進されたことなどを知った秀吉がバテレン追放令を出した。","バテレン追放令は貿易を続けたため取りしまりが不十分だったが、江戸幕府は禁教令でキリスト教そのものを禁止した。"]},{"ev":["1560:桶狭間の戦い","1573:室町幕府","1575:長篠の戦い"],"k":"l","tk":"e06","ti":"織田信長の天下統一事業","sum":"織田信長は桶狭間の戦いで今川義元を破って有力な大名となった。京都に上って足利義昭を将軍に立てたが、対立して追放し室町幕府を滅ぼした。その後、長篠の戦いで鉄砲を有効に使って武田勝頼を破り、統一を進めた。","tip":"幕府滅亡（1573）と長篠（1575）は2年差で間違えやすい。『幕府を倒してから武田を倒す』と覚える。","st":null},{"ev":["1560:桶狭間の戦い","1573:室町幕府","1582:本能寺の変"],"k":"g","tk":"e06","ti":"織田信長の天下統一事業","sum":"織田信長は桶狭間の戦いで今川義元を破って力をのばした。その後、京都に上って足利義昭を将軍にしたが、やがて対立して義昭を追放し、室町幕府を滅ぼした。しかし天下統一を目前にして、本能寺の変で家臣の明智光秀におそわれ自害した。","tip":"信長の出世（桶狭間）→幕府を滅ぼす→最期（本能寺の変）の順。","st":["桶狭間の戦いで今川義元を破って勢力を広げた織田信長は、のちに足利義昭を追放して室町幕府を滅ぼした。","室町幕府を滅ぼして統一を進めた織田信長だったが、本能寺の変で明智光秀におそわれ自害した。"]},{"ev":["1560:桶狭間の戦い","1575:長篠の戦い","1600:関ヶ原の戦い"],"k":"g","tk":"f_war","ti":"天下統一への合戦","sum":"1560年、織田信長が桶狭間の戦いで今川義元を破り、勢力を広げた。1575年には織田・徳川の連合軍が鉄砲を有効に使った長篠の戦いで武田勝頼を破った。豊臣秀吉の死後、1600年に徳川家康が関ヶ原の戦いで石田三成らを破り、全国支配の実権をにぎった。","tip":"信長の戦い2つ（桶狭間→長篠）が先、家康の関ヶ原が最後。信長→秀吉→家康の順。","st":["桶狭間の戦いで今川義元を破って勢力を広げた織田信長は、長篠の戦いで徳川家康と組み、鉄砲を使って武田勝頼を破った。","長篠の戦いのあと信長は本能寺の変でたおれ、秀吉の死後、徳川家康が関ヶ原の戦いで石田三成らを破った。"]},{"ev":["1576:安土城","1577:楽市・楽座","1582:本能寺の変"],"k":"l","tk":"e06","ti":"安土を拠点とした信長の政治","sum":"織田信長は琵琶湖のほとりに安土城を築き始め、天下統一の拠点とした。そして安土城下で楽市・楽座を行い、市の税や座の特権をなくして商工業を活発にしようとした。しかし統一を目前にして、本能寺の変で家臣の明智光秀におそわれ自害した。","tip":"城を築く→その城下で楽市・楽座→信長の最期の本能寺の変の順。","st":["織田信長は安土城を築いて拠点とし、その城下町で楽市・楽座を行って商工業をさかんにしようとした。","楽市・楽座などの政策で統一を進めた織田信長だったが、本能寺の変で家臣の明智光秀におそわれた。"]},{"ev":["1576:安土城","1582:本能寺の変","1583:大阪城"],"k":"l","tk":"e06","ti":"信長から秀吉へ","sum":"織田信長は琵琶湖のほとりに安土城を築き、天下統一の拠点とした。しかし本能寺の変で家臣の明智光秀におそわれて自害した。光秀を倒して後継者となった豊臣秀吉は、大阪城を築いて天下統一を進めた。","tip":"『信長の城（安土城）→本能寺の変→秀吉の城（大阪城）』。城の主が入れかわる。","st":["安土城を拠点に天下統一を進めていた信長は、本能寺の変で明智光秀におそわれて自害した。","本能寺の変のあと光秀を倒した秀吉が後継者の地位を固め、天下統一の拠点として大阪城を築き始めた。"]},{"ev":["1577:楽市・楽座","1772:田沼意次","1841:水野忠邦"],"k":"l","tk":"f_money","ti":"商業政策と座・株仲間","sum":"織田信長は楽市・楽座で座の特権をなくし、だれでも自由に商売できるようにした。江戸時代、老中田沼意次は逆に商人の同業組合である株仲間をすすめて税を取ろうとした。天保の改革を行った水野忠邦は、物価を下げるため株仲間を解散させた。","tip":"『座をなくす（信長）→株仲間をすすめる（田沼）→株仲間を解散（水野）』。認める・認めないが入れかわる。","st":["楽市・楽座で座の特権をなくした信長とは逆に、江戸時代の田沼意次は株仲間をすすめ、営業を認めるかわりに税を納めさせた。","田沼意次がすすめた株仲間が物価を上げていると考えた水野忠邦は、天保の改革で株仲間を解散させた。"]},{"ev":["1582:本能寺の変","1583:大阪城","1590:全国統一"],"k":"l","tk":"e06","ti":"豊臣秀吉の全国統一","sum":"本能寺の変で織田信長が倒れると、豊臣秀吉は明智光秀を討って信長の後継者の地位を固めた。翌年から統一の拠点として大阪城を築き始め、各地の大名を従えた。そして小田原の北条氏を滅ぼして全国統一を成しとげた。","tip":"信長が倒れる→秀吉が大阪城を拠点にする→北条氏を倒して全国統一の順。","st":["本能寺の変のあと、明智光秀を討って信長の後継者となった豊臣秀吉は、拠点として大阪城を築き始めた。","大阪城を拠点に各地の大名を従えた豊臣秀吉は、小田原の北条氏を滅ぼして全国統一を成しとげた。"]},{"ev":["1582:太閤検地","1588:刀狩令","1590:全国統一"],"k":"g","tk":"e06","ti":"秀吉の政策と兵農分離","sum":"豊臣秀吉は太閤検地で田畑の面積や収穫量を調べ、耕作する百姓に年貢を納めさせた。さらに刀狩令で百姓から武器を取り上げ、一揆を防いだ。こうして武士と百姓の身分を分ける兵農分離を進めながら、秀吉は全国統一を成しとげた。","tip":"土地を調べる検地が先、武器を取り上げる刀狩があと。統一の完成が最後。","st":["豊臣秀吉は太閤検地で百姓を土地に結びつけ、続いて刀狩令で百姓から武器を取り上げて兵農分離を進めた。","太閤検地や刀狩令で支配の基礎を固めた豊臣秀吉は、小田原の北条氏を滅ぼして全国統一を成しとげた。"]},{"ev":["1582:本能寺の変","1590:全国統一","1592:文禄の役"],"k":"l","tk":"e06","ti":"本能寺の変と秀吉の統一","sum":"1582年、織田信長は本能寺の変で明智光秀におそわれて自害した。光秀を倒した豊臣秀吉が後継者となり、1590年に全国統一を成しとげた。さらに秀吉は明の征服をめざして朝鮮に大軍を送り、文禄の役が起こった。","tip":"『信長の死（本能寺）→秀吉の統一→秀吉の朝鮮出兵』。本能寺の変が信長から秀吉への切りかわり。","st":null},{"ev":["1582:太閤検地","1873:地租改正","1946:農地改革"],"k":"l","tk":"f_land","ti":"土地と税のしくみの変化","sum":"豊臣秀吉の太閤検地で田畑の収穫量が石高で表され、耕作者が年貢を米で納めるしくみが続いた。明治政府は1873年の地租改正で地価の3％を現金で納めさせ、税収を安定させた。しかし地主と小作人の差が広がり、戦後の農地改革で多くの小作人が自作農になった。","tip":"『検地＝米で納める』『地租改正＝現金で納める』『農地改革＝小作人が土地を持つ』と中身で区別する。","st":null},{"ev":["1587:バテレン追放令","1601:朱印船貿易","1613:禁教令"],"k":"g","tk":"f_west","ti":"キリスト教の禁止と貿易","sum":"豊臣秀吉はバテレン追放令で宣教師を国外に追放したが、貿易は認めたため禁教は不十分だった。徳川家康も朱印船貿易で海外との貿易を進めた。しかしキリスト教の広まりをおそれた幕府は、禁教令を出してキリスト教を全国で禁止した。","tip":"秀吉の宣教師追放→家康の朱印船での貿易奨励→江戸幕府による全国での禁教の順。","st":["バテレン追放令を出した豊臣秀吉も貿易は続け、その後徳川家康も朱印状を与えて朱印船貿易を進めた。","朱印船貿易などで海外との交流が続く中、キリスト教の広まりをおそれた幕府は禁教令を全国に出した。"]},{"ev":["1587:バテレン追放令","1613:禁教令","1640:宗門改"],"k":"g","tk":"f_rel","ti":"キリスト教禁止の強化","sum":"豊臣秀吉はバテレン追放令で宣教師を国外に追放したが、貿易は続けたため取りしまりは不十分だった。江戸幕府は禁教令でキリスト教を全国で禁止し、さらに宗門改を行って、人々が仏教徒であることを寺に証明させ、信者を見つけ出した。","tip":"秀吉（宣教師追放）→幕府（全国で禁止）→宗門改（一人一人を調べる）と厳しくなる順。","st":["秀吉のバテレン追放令は宣教師を追い出すものだったが、江戸幕府は禁教令でキリスト教そのものを全国で禁止した。","禁教令の後も信者が残ったため、幕府は宗門改を行い、仏教徒であることを寺に証明させた。"]},{"ev":["1590:全国統一","1592:文禄の役","1600:関ヶ原の戦い"],"k":"l","tk":"e06","ti":"秀吉の統一から関ヶ原へ","sum":"豊臣秀吉は全国統一を成しとげると、明の征服をめざして朝鮮に大軍を送った（文禄の役）。朝鮮出兵は失敗し、多くの負担で大名は苦しみ、豊臣家の家臣の対立も深まった。秀吉の死後、徳川家康が関ヶ原の戦いで石田三成らを破った。","tip":"国内を統一してから朝鮮へ出兵。出兵で豊臣方が弱まり、関ヶ原の戦いで家康が勝つ。","st":["全国統一を成しとげた豊臣秀吉は、さらに明の征服をめざし、文禄の役で朝鮮に大軍を送った。","文禄の役などの朝鮮出兵で豊臣方の力が弱まり、秀吉の死後に関ヶ原の戦いで徳川家康が勝利した。"]},{"ev":["1592:文禄の役","1600:関ヶ原の戦い","1607:朝鮮"],"k":"l","tk":"f_asia","ti":"朝鮮出兵と国交回復","sum":"豊臣秀吉は文禄の役で朝鮮に大軍を送り、朝鮮との国交はとだえた。秀吉の死後、徳川家康が関ヶ原の戦いで勝って実権をにぎった。家康は朝鮮との関係を改善しようとし、対馬藩の宗氏の仲立ちで朝鮮との国交が回復して使節が来日した。","tip":"秀吉の出兵で国交がとだえる→家康が実権をにぎる→家康の時代に国交回復の順。","st":["文禄の役で朝鮮との国交がとだえたが、秀吉の死後、関ヶ原の戦いで徳川家康が勝って実権をにぎった。","関ヶ原の戦いで勝った徳川家康は朝鮮との関係改善を進め、対馬藩の仲立ちで朝鮮との国交が回復した。"]},{"ev":["1600:関ヶ原の戦い","1603:徳川家康","1615:武家諸法度"],"k":"l","tk":"e07","ti":"江戸幕府の成立","sum":"徳川家康は関ヶ原の戦いで石田三成らを破り、全国の大名を従える実権をにぎった。1603年に征夷大将軍となって江戸に幕府を開いた。さらに大名が守るべききまりとして武家諸法度を定め、大名を統制した。","tip":"『勝つ（関ヶ原1600）→開く（幕府1603）→しばる（武家諸法度1615）』。","st":null},{"ev":["1601:朱印船貿易","1609:オランダ","1641:出島"],"k":"g","tk":"e07","ti":"江戸初期の貿易から鎖国へ","sum":"徳川家康は朱印状を与えて朱印船貿易を進め、ヨーロッパの国にも貿易を認めてオランダには平戸での貿易を許可した。しかしキリスト教の取りしまりを強める中で貿易は制限され、1641年にオランダ商館が長崎の出島に移されて鎖国の体制が固まった。","tip":"はじめは家康が貿易をすすめ（朱印船・オランダ）、のちに出島に閉じこめて制限した流れ。","st":["家康は朱印船貿易で海外との貿易をすすめ、ヨーロッパではオランダにも平戸での貿易を許可した。","平戸で貿易をしていたオランダの商館は、のちに長崎の出島に移され、鎖国の体制が固まった。"]},{"ev":["1601:五街道","1635:参勤交代","1672:西廻り航路"],"k":"g","tk":"f_trade","ti":"江戸時代の交通の発達","sum":"徳川家康は東海道などに宿場を置き、五街道の整備を始めた。参勤交代が制度化されると、大名行列が街道を行き来し、交通がさらに発達した。その後、河村瑞賢が日本海側の米を大阪へ運ぶ西廻り航路を開き、海上交通も整った。","tip":"陸の道（五街道）が先に整い、参勤交代で使われ、のちに海の道（西廻り航路）が開かれた。","st":["家康が整備を始めた五街道を、参勤交代の制度化によって大名行列が行き来するようになった。","参勤交代などで陸上交通が発達したのに続き、西廻り航路が開かれて海上交通も整備された。"]},{"ev":["1601:五街道","1872:鉄道","1964:東海道新幹線"],"k":"g","tk":"f_trade","ti":"陸上交通の発達","sum":"江戸時代のはじめ、徳川家康が東海道などの五街道の整備を始め、人々は徒歩で旅をした。明治時代の1872年には新橋・横浜間に鉄道が開通した。高度経済成長期の1964年には、東京と大阪を結ぶ東海道新幹線が開通した。","tip":"歩く街道（江戸）→汽車の鉄道（明治）→新幹線（昭和）。速くなる順に並べる。","st":["江戸時代に整備された五街道は徒歩での移動が中心だったが、明治時代の1872年に新橋・横浜間で初めて鉄道が開通した。","明治時代に始まった鉄道は全国に広がり、東京オリンピックの年の1964年には、東海道新幹線が開通した。"]},{"ev":["1603:徳川家康","1615:武家諸法度","1635:参勤交代"],"k":"l","tk":"e07","ti":"江戸幕府の大名統制","sum":"1603年に徳川家康が江戸幕府を開いた。大阪の陣で豊臣氏を滅ぼしたあと、1615年に大名が守るべききまりとして武家諸法度を定めた。のちに3代将軍徳川家光が武家諸法度に参勤交代を加え、大名に江戸と領地を行き来させて統制を強めた。","tip":"参勤交代は3代家光のとき。『幕府を開く→きまりを作る→きまりに参勤交代を追加』の順。","st":null},{"ev":["1609:オランダ","1639:ポルトガル","1641:出島"],"k":"l","tk":"e07","ti":"鎖国の完成","sum":"幕府はオランダに平戸での貿易を許可した。キリスト教を広めるおそれがあるポルトガルについては、島原・天草一揆の後に船の来航を禁止した。その後、平戸のオランダ商館を長崎の出島に移し、鎖国の体制が固まった。","tip":"布教しないオランダは残し、ポルトガルは追放。最後にオランダを出島に移して完成。","st":["オランダは平戸で貿易を許されたが、キリスト教を広めるおそれのあるポルトガルは、船の来航を禁止された。","ポルトガル船の来航を禁止した後、幕府は平戸のオランダ商館を長崎の出島に移し、鎖国の体制が固まった。"]},{"ev":["1613:禁教令","1637:島原・天草一揆","1639:ポルトガル"],"k":"l","tk":"e07","ti":"キリスト教禁止の強化","sum":"1613年、幕府は禁教令を全国に広げてキリスト教を禁止した。キリスト教徒への弾圧と重い年貢に苦しんだ人々は、1637年に島原・天草一揆を起こした。一揆に衝撃を受けた幕府は取りしまりを強め、1639年にポルトガル船の来航を禁止した。","tip":"『禁止→反発の一揆→さらに厳しく（ポルトガル船禁止）』。一揆が鎖国を進めるきっかけになった。","st":null},{"ev":["1613:禁教令","1637:島原・天草一揆","1639:ポルトガル","1641:出島"],"k":"l","tk":"e07","ti":"鎖国体制の完成","sum":"幕府は禁教令でキリスト教を禁止し、弾圧と重い年貢に苦しむ人々は島原・天草一揆を起こした。一揆のあと幕府は取りしまりを強め、1639年に布教を行うポルトガル船の来航を禁止した。1641年には平戸のオランダ商館を長崎の出島に移し、鎖国の体制が固まった。","tip":"『禁教→一揆→ポルトガル船禁止→出島』。ポルトガル（1639）と出島（1641）の順に注意。","st":null},{"ev":["1613:禁教令","1637:島原・天草一揆","1640:宗門改"],"k":"l","tk":"e07","ti":"島原・天草一揆と禁教","sum":"幕府は禁教令を出してキリスト教を全国で禁止した。キリスト教徒への弾圧と重い年貢に苦しむ人々は島原・天草一揆を起こした。一揆をおさえた幕府はキリスト教をいっそう警戒し、宗門改を行って信者を見つけ出そうとした。","tip":"一揆の後、幕府はさらに取りしまりを強めた。宗門改は一揆の後と覚える。","st":["禁教令でキリスト教が禁止され、信者への弾圧と重い年貢に苦しんだ人々が島原・天草一揆を起こした。","島原・天草一揆の後、幕府はキリスト教をいっそう警戒し、宗門改で人々の宗教を調べた。"]},{"ev":["1636:寛永通宝","1871:円","1882:日本銀行"],"k":"g","tk":"f_money","ti":"全国共通の通貨の移り変わり","sum":"江戸時代の1636年、幕府は全国共通の銅銭として寛永通宝をつくった。明治時代になると1871年の新貨条例で通貨の単位が円・銭・厘に統一された。さらに1882年には通貨を発行する中央銀行として日本銀行が設立された。","tip":"江戸幕府の銅銭→明治の円→その円を発行する中央銀行、の順に並べる。","st":["江戸幕府が全国共通の銅銭として寛永通宝をつくり、明治政府は新貨条例で通貨の単位を円に統一した。","新貨条例で通貨の単位を円に統一した政府は、その通貨を発行する中央銀行として日本銀行を設立した。"]},{"ev":["1642:ピューリタン革命","1688:名誉革命","1776:独立宣言","1789:人権宣言"],"k":"l","tk":"f_w2","ti":"欧米の市民革命","sum":"イギリスでは国王と議会が対立してピューリタン革命が起こり、のちに名誉革命で議会を重んじる立憲君主制が確立した。18世紀後半にはアメリカの13植民地が独立宣言を発表した。さらにフランス革命が起こり、自由・平等をうたう人権宣言が発表された。","tip":"『イギリス（ピューリタン→名誉）→アメリカ（独立宣言）→フランス（人権宣言）』と国の順で覚える。","st":["ピューリタン革命のあとも国王と議会の対立は続いたが、名誉革命で議会を重んじる政治が確立し、権利章典が定められた。","イギリスで名誉革命が起こったあと、その植民地だったアメリカの13州が本国に反発し、独立宣言を発表した。","アメリカの独立宣言の影響も受けてフランス革命が起こり、自由・平等をうたう人権宣言が発表された。"]},{"ev":["1669:シャクシャイン","1869:北海道","1899:北海道旧土人保護法"],"k":"l","tk":"f_ns","ti":"アイヌの人々と北海道開拓","sum":"江戸時代、松前藩との不利な取り引きに反発したアイヌの人々は、シャクシャインを指導者として戦ったが敗れた。明治政府は蝦夷地を北海道と改めて開拓を進め、アイヌの人々の土地や生活が奪われた。北海道旧土人保護法は保護をうたいながら、日本人への同化を進めるものだった。","tip":"『松前藩との戦い（江戸）→開拓（明治初め）→保護法による同化政策（明治後半）』。","st":null},{"ev":["1689:松尾芭蕉","1802:東海道中膝栗毛","1833:歌川広重"],"k":"g","tk":"f_cult","ti":"旅を描いた江戸の文化","sum":"元禄文化のころ、松尾芭蕉は「奥の細道」の旅に出て俳諧を詠んだ。化政文化のころには、十返舎一九が旅のこっけいな話である東海道中膝栗毛を書き、続いて歌川広重が浮世絵「東海道五十三次」で街道の風景を描いた。","tip":"芭蕉は元禄文化（前半）、膝栗毛と広重は化政文化（後半）。文学が先で浮世絵が後。","st":["元禄文化の松尾芭蕉の後、化政文化のころに十返舎一九が東海道中膝栗毛で旅のこっけいな話を書いた。","東海道中膝栗毛で東海道の旅が人気となったのち、歌川広重が浮世絵「東海道五十三次」を発表した。"]},{"ev":["1716:徳川吉宗","1742:公事方御定書","1772:田沼意次"],"k":"g","tk":"e08","ti":"享保の改革から田沼の政治へ","sum":"8代将軍徳川吉宗は享保の改革を始め、その中で裁判や刑罰の基準となる公事方御定書を定めた。吉宗の後、老中となった田沼意次は、株仲間の結成をすすめるなど商業の力を利用して幕府の財政を立て直そうとした。","tip":"公事方御定書は吉宗の改革の中の政策。田沼意次は吉宗より後の人物。","st":["徳川吉宗は享保の改革の中で、裁判や刑罰を公正にするため、その基準となる公事方御定書を定めた。","公事方御定書を定めた吉宗の享保の改革の後、老中となった田沼意次が商業を重視した政治を行った。"]},{"ev":["1716:徳川吉宗","1772:田沼意次","1787:松平定信"],"k":"l","tk":"e08","ti":"享保の改革から寛政の改革へ","sum":"8代将軍徳川吉宗は享保の改革で幕府の財政を立て直そうとした。その後、老中田沼意次は株仲間をすすめるなど商業を重んじる政治を行ったが、わいろの横行などで批判され失脚した。代わって老中松平定信が寛政の改革を始め、吉宗の政治を手本に倹約などを進めた。","tip":"『改革→田沼の政治→改革』と、田沼が2つの改革にはさまれる。定信は吉宗の孫。","st":null},{"ev":["1716:徳川吉宗","1772:田沼意次","1787:松平定信","1841:水野忠邦"],"k":"l","tk":"e08","ti":"江戸の三大改革","sum":"8代将軍徳川吉宗が享保の改革を行った。その後、老中田沼意次が商業を重んじる政治を行ったが、わいろの横行などで失脚した。代わって松平定信が寛政の改革を始めた。さらに19世紀には老中水野忠邦が天保の改革を行い、株仲間の解散などを命じたが、反発を受けて失敗した。","tip":"三大改革は『享保・寛政・天保』の順（吉宗・定信・忠邦）。田沼は享保と寛政の間。","st":null},{"ev":["1716:徳川吉宗","1774:解体新書","1821:伊能忠敬"],"k":"l","tk":"e08","ti":"享保の改革と蘭学の発展","sum":"8代将軍徳川吉宗は享保の改革の中で、キリスト教に関係のない洋書の輸入を認めた。これにより蘭学がさかんになり、1774年に杉田玄白らがオランダ語の解剖書を翻訳した解体新書を出版した。蘭学が広まる中で、伊能忠敬が西洋の測量術をいかして正確な日本地図をつくった。","tip":"吉宗の洋書輸入のゆるめ→蘭学→地図。吉宗が蘭学のきっかけを作ったことが入試のポイント。","st":null},{"ev":["1716:徳川吉宗","1774:解体新書","1824:シーボルト"],"k":"g","tk":"f_west","ti":"蘭学の発展","sum":"徳川吉宗はキリスト教に関係のない洋書の輸入をゆるめ、蘭学が発展するきっかけをつくった。杉田玄白らはオランダ語の解剖書を翻訳した解体新書を出版した。のちにオランダ商館の医師シーボルトが長崎に鳴滝塾を開き、多くの蘭学者を育てた。","tip":"吉宗がきっかけ→解体新書で本格化→シーボルトが塾で人を育てる、の順。","st":["徳川吉宗が洋書の輸入をゆるめたことで蘭学が広まり、杉田玄白らが解体新書を出版した。","解体新書の出版で蘭学がさかんになり、のちにシーボルトが長崎に鳴滝塾を開いて医学などを教えた。"]},{"ev":["1769:蒸気機関","1840:アヘン戦争","1857:インド大反乱"],"k":"l","tk":"f_w3","ti":"産業革命とアジア進出","sum":"イギリスではワットが改良した蒸気機関が工場で使われ、産業革命が進んだ。大量に生産した綿製品を売る市場や原料を求めてイギリスはアジアに進出し、清とアヘン戦争を起こした。さらにインドでは、イギリスの支配に反発してインド大反乱が起こった。","tip":"まず産業革命（蒸気機関）で力をつけたイギリスが清とアヘン戦争を起こし、その後、すでに支配していたインドで大反乱が起こった順。","st":["蒸気機関による産業革命で工業が発展したイギリスは、製品を売る市場を求めてアジアに進出し、アヘン戦争を起こした。","アヘン戦争で清を破ったイギリスはアジアでの支配を強め、支配を受けていたインドではインド大反乱が起こった。"]},{"ev":["1769:蒸気機関","1872:鉄道","1964:東海道新幹線"],"k":"g","tk":"f_tech","ti":"鉄道の発達","sum":"イギリスでワットが蒸気機関を改良し、産業革命の中で蒸気機関車が走る鉄道が生まれた。日本でも明治時代に新橋・横浜間に初めての鉄道が開通した。戦後の高度経済成長期には、東京オリンピックの開会に合わせて東京と大阪を結ぶ東海道新幹線が開通した。","tip":"『動力の改良（イギリス）→日本初の鉄道（明治）→新幹線（高度経済成長期）』の順。","st":["ワットが改良した蒸気機関は蒸気機関車にも使われ、日本でも明治時代に新橋・横浜間に鉄道が開通した。","明治時代に新橋・横浜間で始まった鉄道は全国に広がり、1964年には東京と大阪を結ぶ東海道新幹線が開通した。"]},{"ev":["1772:田沼意次","1782:天明のききん","1787:松平定信"],"k":"l","tk":"e08","ti":"田沼の政治から寛政の改革","sum":"老中田沼意次は株仲間をすすめて商業を活発にしたが、わいろが横行した。そこへ天明のききんが起こり、百姓一揆や打ちこわしが急増して田沼は失脚した。その後、老中松平定信が寛政の改革を始め、政治を立て直そうとした。","tip":"ききんで世の中が混乱→田沼が退く→松平定信が立て直す、の順。","st":["田沼意次の政治のもとで、天明のききんが起こり、一揆や打ちこわしが急増して田沼は失脚した。","天明のききんで荒れた農村や社会を立て直すため、田沼の後に老中となった松平定信が寛政の改革を始めた。"]},{"ev":["1774:解体新書","1824:シーボルト","1838:緒方洪庵"],"k":"l","tk":"f_tech","ti":"蘭学の広がり","sum":"杉田玄白・前野良沢らがオランダ語の解剖書を翻訳した解体新書を出版し、蘭学が盛んになった。オランダ商館の医師シーボルトは長崎に鳴滝塾を開いて医学などを教えた。さらに緒方洪庵が大阪に適塾を開き、多くの人材を育てた。","tip":"『翻訳（解体新書）→長崎の塾（シーボルト）→大阪の塾（適塾）』と学びの場が広がる。","st":null},{"ev":["1774:解体新書","1838:緒方洪庵","1890:北里柴三郎"],"k":"g","tk":"f_tech","ti":"西洋医学の広がり","sum":"杉田玄白らがオランダ語の解剖書を翻訳した解体新書を出版し、蘭学がさかんになった。のちに緒方洪庵が大阪に適塾を開き、医学などの蘭学を広めた。明治時代になると西洋医学の研究が進み、北里柴三郎が破傷風の血清療法を発見して世界に認められた。","tip":"『翻訳する（江戸中期）→塾で広める（江戸後期）→世界的な発見（明治）』の順。","st":["解体新書の出版で蘭学がさかんになり、江戸時代後期には緒方洪庵が大阪に適塾を開いて蘭学を教えた。","緒方洪庵らが広めた西洋の学問は明治時代にさらに発展し、北里柴三郎が破傷風の血清療法を発見した。"]},{"ev":["1776:独立宣言","1789:人権宣言","1804:ナポレオン"],"k":"l","tk":"f_w2","ti":"アメリカ独立からフランス革命","sum":"イギリスの植民地だったアメリカ13州が独立宣言を発表した。その影響や財政難などからフランスでも革命が起こり、自由・平等をうたう人権宣言が出された。革命後の混乱の中で力をのばした軍人ナポレオンが、やがて皇帝となった。","tip":"アメリカの独立宣言がフランス革命の手本になった。ナポレオンは革命の後に登場する。","st":["アメリカの独立宣言の影響を受け、フランスでも革命が起こって自由・平等をうたう人権宣言が発表された。","人権宣言が出されたフランス革命の後、混乱をおさめて力をつけたナポレオンが皇帝となった。"]},{"ev":["1776:独立宣言","1861:南北戦争","1863:リンカン"],"k":"g","tk":"f_w3","ti":"アメリカ合衆国の歩み","sum":"1776年にアメリカ13州が独立宣言を発表して合衆国が生まれた。その後、国土を広げる中で奴隷制などをめぐり北部と南部が対立し、1861年に南北戦争が始まった。戦争中の1863年、北部のリンカン大統領が奴隷解放宣言を出した。","tip":"建国（独立宣言）→国内の分裂（南北戦争）→戦争中の奴隷解放宣言（リンカン）の順。","st":["独立宣言で生まれたアメリカでは、その後、奴隷制などをめぐって北部と南部が対立し、南北戦争が起こった。","南北戦争の最中に、北部のリンカン大統領が奴隷解放宣言を出し、戦争の目的を示した。"]},{"ev":["1782:天明のききん","1833:天保のききん","1837:大塩平八郎"],"k":"g","tk":"f_people","ti":"ききんと民衆の抵抗","sum":"18世紀後半、天明のききんが起こり、百姓一揆や打ちこわしが急増した。19世紀には天保のききんが起こり、各地で一揆や打ちこわしが続いた。このとき大阪では、元役人の大塩平八郎が、ききんに苦しむ人々を救おうとして乱を起こした。","tip":"『天明（田沼意次のころ）→天保（水野忠邦の改革の前）』。大塩の乱は天保のききんのときに起こった。","st":["天明のききんで一揆や打ちこわしが急増したが、その後も苦しい生活は続き、19世紀には天保のききんが起こった。","天保のききんで人々が苦しむのに幕府の対策が不十分だったため、大阪で大塩平八郎が乱を起こした。"]},{"ev":["1787:松平定信","1792:ラクスマン","1825:異国船打払令"],"k":"l","tk":"e08","ti":"外国船の接近と打払令","sum":"老中松平定信が寛政の改革を進めていたころ、ロシアの使節ラクスマンが根室に来航し、通商を求めた。幕府は北方の守りを強めたが、その後もイギリスやアメリカの船が日本に近づいた。そこで幕府は1825年に異国船打払令を出し、外国船の撃退を命じた。","tip":"『ロシア船が来る→ほかの国の船も来る→追い払え（打払令）』と、外国船が増えてから命令が出た順。","st":null},{"ev":["1792:ラクスマン","1825:異国船打払令","1853:ペリー"],"k":"l","tk":"f_west","ti":"外国船の接近と幕府の対応","sum":"18世紀の終わり、ロシアの使節ラクスマンが根室に来航して通商を求めた。その後も外国船の接近が続いたため、幕府は異国船打払令を出して外国船の撃退を命じた。しかしアメリカの使節ペリーが軍艦を率いて浦賀に来航し、幕府は開国をせまられた。","tip":"『ロシア（ラクスマン）→打ち払い（1825）→アメリカ（ペリー）』。","st":["ラクスマンの来航のあともイギリスやロシアなどの外国船が日本に近づいたため、幕府は異国船打払令を出した。","異国船打払令で外国船を追い払ってきた幕府も、軍艦を率いて浦賀に来たペリーに開国をせまられた。"]},{"ev":["1825:異国船打払令","1840:アヘン戦争","1842:薪水給与令"],"k":"l","tk":"e08","ti":"外国船への対応の変化","sum":"幕府は1825年に異国船打払令を出し、近づく外国船を追い払うよう命じた。しかしアヘン戦争で清がイギリスに敗れたことを知ると、外国と争うのは危ないと考え、打払いをやめて外国船に燃料や水を与える薪水給与令を出した。","tip":"アヘン戦争で清が負けたのを見て、幕府は「打ち払い」から「水と燃料を与える」に方針を弱めた。","st":["異国船打払令で外国船を追い払うよう命じていたが、その後、清とイギリスの間でアヘン戦争が起こった。","アヘン戦争で大国の清が敗れたことを知った幕府は、打払いは危険と考え、方針を改めて薪水給与令を出した。"]},{"ev":["1833:天保のききん","1837:大塩平八郎","1841:水野忠邦"],"k":"l","tk":"e08","ti":"天保のききんと天保の改革","sum":"1833年ごろから天保のききんが起こり、各地で百姓一揆や打ちこわしが続いた。大阪町奉行所の元役人大塩平八郎は、苦しむ人々を救おうと1837年に乱を起こした。元役人の反乱は幕府に衝撃を与え、老中水野忠邦が1841年から天保の改革を行った。","tip":"『ききん→大塩の乱→天保の改革』。名前の同じ『天保』のききんが改革より先。","st":null},{"ev":["1840:アヘン戦争","1851:太平天国の乱","1911:辛亥革命"],"k":"l","tk":"f_w3","ti":"清の動揺から滅亡へ","sum":"アヘン戦争に敗れた清は、賠償金の支払いなどで国内の負担が重くなり、民衆の不満から太平天国の乱が起こった。その後も清は欧米や日本に圧迫されて力が弱まり、1911年には孫文らの辛亥革命によって清の支配がくずれた。","tip":"敗戦（アヘン戦争）→国内の反乱（太平天国）→清がたおれる革命（辛亥革命）の順。","st":["アヘン戦争に敗れた清では、賠償金のための重い税などで民衆の不満が高まり、太平天国の乱が起こった。","太平天国の乱などで清の力は弱まり、やがて1911年に孫文らが辛亥革命を起こして清の支配がくずれた。"]},{"ev":["1840:アヘン戦争","1853:ペリー","1854:日米和親条約"],"k":"l","tk":"f_w3","ti":"アジアへの欧米の進出と開国","sum":"清がイギリスとのアヘン戦争に敗れたことは幕府に大きな衝撃を与えた。その後、アメリカの使節ペリーが浦賀に来航して開国を求めた。翌年、幕府は日米和親条約を結び、下田と函館を開いて開国した。","tip":"『清の敗北（アヘン戦争）→ペリー来航→翌年に和親条約』。","st":["アヘン戦争で清がイギリスに敗れ、欧米がアジアに進出する中、アメリカの使節ペリーが浦賀に来て開国を求めた。","ペリーは翌年再び来航し、幕府は日米和親条約を結んで下田と函館の2港を開いた。"]},{"ev":["1842:薪水給与令","1853:ペリー","1854:日米和親条約"],"k":"l","tk":"e09","ti":"薪水給与令から開国へ","sum":"アヘン戦争後、幕府は薪水給与令を出して外国船に燃料や水を与えることにした。その後、アメリカの使節ペリーが浦賀に来航し、開国を求めた。翌年、幕府は日米和親条約を結んで下田と函館を開き、鎖国の体制が終わった。","tip":"燃料や水を与える（薪水給与令）→ペリー来航→翌年に開国（和親条約）の順。","st":["薪水給与令で外国船に燃料や水を与えるようになった後、アメリカのペリーが浦賀に来航して開国を求めた。","ペリーは翌年にも来航し、幕府はついに日米和親条約を結んで、下田と函館の2港を開いた。"]},{"ev":["1853:ペリー","1854:日米和親条約","1858:日米修好通商条約"],"k":"l","tk":"e09","ti":"ペリー来航と開国","sum":"1853年、アメリカのペリーが浦賀に来航して開国を求めた。翌年再び来航したペリーと幕府は日米和親条約を結び、下田と函館を開いた。その後、下田に来た総領事ハリスが通商を強く求め、1858年に日米修好通商条約が結ばれて5港が開かれ、貿易が始まった。","tip":"『来航→和親（2港、開国）→修好通商（5港、貿易）』。和親が先で、通商は4年後。","st":null},{"ev":["1853:ペリー","1858:日米修好通商条約","1860:桜田門外の変"],"k":"l","tk":"e09","ti":"開国と井伊直弼","sum":"ペリーの来航をきっかけに日本は開国し、1858年には大老井伊直弼が朝廷の許可を得ないまま日米修好通商条約を結んだ。これに反対する人々を井伊は厳しく処罰したため反発が強まり、井伊は桜田門外の変で暗殺された。","tip":"ペリー来航→井伊直弼が通商条約を結ぶ→反発で井伊が暗殺、の順。","st":["ペリーの来航をきっかけに開国した日本は、その後アメリカと日米修好通商条約を結び、貿易を始めることになった。","井伊直弼が朝廷の許可なく日米修好通商条約を結んだことへの反発から、桜田門外の変が起こった。"]},{"ev":["1854:日米和親条約","1858:日米修好通商条約","1894:領事裁判権","1911:関税自主権"],"k":"l","tk":"f_trade","ti":"条約改正の歩み","sum":"日米和親条約で開国した日本は、1858年に日米修好通商条約を結んだが、領事裁判権を認め関税自主権がない不平等な条約だった。明治政府は改正に努め、1894年に陸奥宗光が領事裁判権を撤廃し、1911年に小村寿太郎が関税自主権の完全な回復に成功した。","tip":"改正は『領事裁判権（陸奥・1894）→関税自主権（小村・1911）』。陸奥→小村の順。","st":null},{"ev":["1857:吉田松陰","1858:安政の大獄","1860:桜田門外の変"],"k":"l","tk":"e09","ti":"安政の大獄とその反発","sum":"長州藩の萩で吉田松陰が松下村塾を受けつぎ、多くの人材を育てた。大老井伊直弼は幕府の政策に反対する人々を安政の大獄で処罰し、吉田松陰も処刑された。この厳しい弾圧への反発から、井伊は桜田門外の変で暗殺された。","tip":"吉田松陰は安政の大獄で処刑された人物。大獄への反発で桜田門外の変が起こる。","st":["松下村塾で教えていた吉田松陰は、幕府の政策に反対したとして安政の大獄で処罰され、処刑された。","安政の大獄で反対派を厳しく処罰した井伊直弼は、反発した浪士らによって桜田門外の変で暗殺された。"]},{"ev":["1858:安政の大獄","1860:桜田門外の変","1866:薩長同盟","1867:大政奉還"],"k":"l","tk":"e09","ti":"幕府の衰えと倒幕","sum":"大老井伊直弼は、通商条約に反対する人々を安政の大獄で処罰したが、桜田門外の変で暗殺され、幕府の権威は大きく下がった。その後、薩摩藩と長州藩が坂本龍馬らの仲立ちで薩長同盟を結んで倒幕をめざし、15代将軍徳川慶喜は大政奉還で政権を朝廷に返した。","tip":"『処罰（大獄）→暗殺（桜田門外）→同盟（薩長）→返上（大政奉還）』。","st":["井伊直弼は安政の大獄で反対派を厳しく処罰したが、これに反発した元水戸藩士らに桜田門外の変で暗殺された。","桜田門外の変で幕府の権威が下がり、攘夷の失敗も経て、薩摩藩と長州藩は薩長同盟を結んで倒幕をめざした。","薩長同盟で倒幕の動きが強まる中、徳川慶喜は大政奉還で政権を朝廷に返した。"]},{"ev":["1858:日米修好通商条約","1894:領事裁判権","1911:関税自主権"],"k":"l","tk":"e12","ti":"条約改正への道のり","sum":"1858年の日米修好通商条約などで、日本は欧米に領事裁判権を認め、関税自主権をもたない不平等条約を結んだ。明治政府は改正交渉を続け、1894年に陸奥宗光が領事裁判権の撤廃に成功し、1911年に小村寿太郎が関税自主権を完全に回復した。","tip":"「結ぶ（江戸）→裁判権（陸奥）→関税（小村）」の順。日清戦争直前が陸奥、日露戦争後が小村と結びつける。","st":null},{"ev":["1863:薩英戦争","1866:薩長同盟","1867:大政奉還"],"k":"l","tk":"e09","ti":"攘夷から倒幕へ","sum":"生麦事件の報復としてイギリス艦隊が鹿児島を砲撃した薩英戦争で、薩摩藩は外国の力を知り、攘夷が不可能であるとさとった。薩摩藩は長州藩と薩長同盟を結び、倒幕へと方針を変えた。倒幕の動きが強まる中、徳川慶喜は大政奉還を行った。","tip":"『攘夷の失敗（薩英戦争）→倒幕の同盟（薩長同盟）→政権返上（大政奉還）』。","st":null},{"ev":["1866:薩長同盟","1867:大政奉還","1868:戊辰戦争"],"k":"l","tk":"e09","ti":"倒幕から戊辰戦争へ","sum":"薩長同盟を結んだ薩摩藩・長州藩が倒幕の動きを強めると、徳川慶喜は大政奉還で政権を朝廷に返した。しかし新政府が旧幕府勢力を政治から外そうとしたため、1868年に旧幕府軍と新政府軍の間で戊辰戦争が始まった。","tip":"「手を組む（同盟）→政権を返す（奉還）→戦う（戊辰）」の順。返したあとに戦争が起こった点に注意。","st":null},{"ev":["1867:大政奉還","1868:五箇条の御誓文","1869:版籍奉還"],"k":"g","tk":"e10","ti":"幕府の終わりと新政府の改革","sum":"15代将軍徳川慶喜は大政奉還を行い、政権を朝廷に返した。新政府は五箇条の御誓文を出して新しい政治の方針を示した。さらに中央集権を進めるため、版籍奉還で藩主に土地と人民を天皇に返させた。","tip":"政権を返す（大政奉還）→方針を示す（御誓文）→土地と人民を返す（版籍奉還）の順。","st":["大政奉還で政権が朝廷に返されると、新政府は五箇条の御誓文で新しい政治の方針を示した。","五箇条の御誓文で方針を示した新政府は、版籍奉還を行って藩主から土地と人民を天皇に返させた。"]},{"ev":["1867:大政奉還","1869:版籍奉還","1871:廃藩置県"],"k":"l","tk":"f_gov","ti":"大政奉還から廃藩置県へ","sum":"大政奉還で江戸幕府が政権を朝廷に返し、新政府が成立した。新政府は1869年に版籍奉還で藩主に土地と人民を天皇へ返させたが、旧藩主がそのまま藩を治めていたため不十分だった。そこで1871年に廃藩置県で藩を廃止して府県を置き、中央集権を完成させた。","tip":"「政権を返す→土地と人民を返す→藩を廃止」の順。版籍奉還が不十分だったので廃藩置県で仕上げた。","st":null},{"ev":["1868:五箇条の御誓文","1869:版籍奉還","1871:廃藩置県"],"k":"g","tk":"e10","ti":"新政府の中央集権化","sum":"1868年に新政府は五箇条の御誓文で政治の方針を示した。次に1869年の版籍奉還で藩主に土地と人民を天皇へ返させたが、藩主はそのまま知藩事として残った。そこで1871年の廃藩置県で藩を廃止し、府知事・県令を政府から派遣して中央集権を完成させた。","tip":"方針を示す→土地と人民を返させる→藩そのものをなくす、と段階的に強まると覚える。","st":["五箇条の御誓文で新しい政治の方針を示した新政府は、次に版籍奉還で藩主から土地と人民を天皇に返させた。","版籍奉還の後も旧藩主が知藩事として藩を治めたため、政府は廃藩置県で藩を廃止し、府県に役人を派遣した。"]},{"ev":["1868:戊辰戦争","1873:徴兵令","1877:西南戦争"],"k":"l","tk":"f_war","ti":"新政府の軍隊と士族の反乱","sum":"1868年に戊辰戦争が始まり、新政府軍が旧幕府軍を破った。1873年には徴兵令が出され、満20歳の男子に兵役が課されて近代的な軍隊がつくられた。特権を失った士族の不満は高まり、1877年に西郷隆盛を中心に西南戦争が起こったが、政府軍にしずめられた。","tip":"『旧幕府との戦い→徴兵で軍隊づくり→士族の最後の反乱』の順。","st":["戊辰戦争で旧幕府軍を破った新政府は、全国の統一を進め、1873年に徴兵令を出して近代的な軍隊をつくった。","徴兵令などで特権を失った士族の不満が高まり、西南戦争が起こったが、徴兵でつくられた政府軍にしずめられた。"]},{"ev":["1869:北海道","1875:樺太・千島交換条約","1879:沖縄県"],"k":"g","tk":"f_ns","ti":"近代日本の領土の確定","sum":"明治政府は国の範囲を定めていった。1869年に蝦夷地を北海道と改めて開拓使を置いた。1875年にはロシアと樺太・千島交換条約を結び、北の国境を定めた。1879年には琉球藩を廃止して沖縄県を置き（琉球処分）、南の範囲も確定させた。","tip":"北海道の開拓→ロシアとの国境の条約→琉球処分、と北から南へと覚える。","st":["蝦夷地を北海道と改めて開拓を進めた政府は、その北側のロシアとの国境を樺太・千島交換条約で定めた。","樺太・千島交換条約で北の国境を定めた後、政府は琉球藩を廃止して沖縄県を置き、南の領土も確定させた。"]},{"ev":["1869:北海道","1899:北海道旧土人保護法","1997:アイヌ文化振興法"],"k":"g","tk":"f_ns","ti":"アイヌの人々と政策","sum":"1869年、明治政府は蝦夷地を北海道と改めて開拓を進め、アイヌの人々の土地や生活が奪われた。1899年には北海道旧土人保護法が制定されたが、同化政策が進められた。1997年にこの法律にかわってアイヌ文化振興法が制定された。","tip":"北海道と改称（明治）→保護法の名の同化政策→文化を尊重する法律（平成）、の順。","st":["蝦夷地が北海道と改められて開拓が進むと、アイヌの人々の生活がおびやかされ、1899年には北海道旧土人保護法がつくられた。","同化政策を進めた北海道旧土人保護法は1997年に廃止され、アイヌ文化を尊重するアイヌ文化振興法が制定された。"]},{"ev":["1871:津田梅子","1872:学制","1947:教育基本法"],"k":"g","tk":"f_women","ti":"女子教育の広がり","sum":"岩倉使節団とともに津田梅子ら女子留学生がアメリカに渡り、女子教育の先がけとなった。翌年には学制が公布され、男女とも6歳以上の子どもに教育を受けさせることになった。戦後には教育基本法が制定され、教育の機会均等や男女共学が定められた。","tip":"留学生（1871年）→学制（1872年）→戦後の教育基本法。明治の2つは1年ちがいに注意。","st":["1871年に津田梅子らがアメリカに留学し、翌1872年には男女とも教育を受けさせる学制が公布された。","学制で始まった近代の学校教育は、戦後に教育基本法によって改められ、男女共学などが定められた。"]},{"ev":["1871:廃藩置県","1873:徴兵令","1877:西南戦争"],"k":"l","tk":"e10","ti":"新政府の改革と士族の反乱","sum":"廃藩置県で中央集権のしくみを整えた政府は、国の軍隊をつくるため満20歳以上の男子に兵役を義務づける徴兵令を出した。武士の特権を失った士族の不満が高まり、西郷隆盛を中心に西南戦争が起こったが、徴兵された政府軍に鎮圧された。","tip":"『中央集権（廃藩置県）→国民の軍隊（徴兵令）→士族の最後の反乱（西南戦争）』。","st":null},{"ev":["1871:岩倉具視","1874:民撰議院設立の建白書","1877:西南戦争"],"k":"l","tk":"e10","ti":"征韓論と政府を去った人々","sum":"1871年に岩倉具視らの使節団が欧米へ出発した。帰国後、国内の整備を優先する岩倉らと征韓論を主張する西郷隆盛・板垣退助らが対立し、西郷・板垣は政府を去った。板垣は1874年に民撰議院設立の建白書を出し、西郷は1877年に西南戦争を起こした。","tip":"使節団の帰国後に政府が分裂し、板垣は言論で、西郷は武力で政府に対抗したと覚える。","st":["岩倉具視らの使節団が帰国して征韓論に反対したため、西郷隆盛・板垣退助らは政府を去り、1874年に板垣らが民撰議院設立の建白書を出した。","民撰議院設立の建白書で板垣が言論による運動を始めた後、同じく政府を去った西郷隆盛が西南戦争を起こした。"]},{"ev":["1871:岩倉具視","1886:領事裁判権","1894:領事裁判権","1911:関税自主権"],"k":"l","tk":"e12","ti":"条約改正の歩み","sum":"岩倉具視を全権大使とする使節団が欧米に派遣されたが、条約改正の交渉は失敗した。ノルマントン号事件で領事裁判権の撤廃を求める声が高まり、1894年に陸奥宗光が領事裁判権の撤廃に成功した。1911年には小村寿太郎が関税自主権の回復を実現した。","tip":"『失敗（岩倉）→世論（ノルマントン号）→領事裁判権の撤廃（陸奥）→関税自主権の回復（小村）』。","st":null},{"ev":["1871:津田梅子","1911:平塚らいてう","1945:女性参政権"],"k":"l","tk":"f_women","ti":"女性の地位向上への歩み","sum":"岩倉使節団とともに留学した津田梅子は、帰国後に女子教育に力をつくした。大正時代の前、平塚らいてうは青鞜社を結成して女性の解放を訴え、のちに女性参政権を求める運動を進めた。戦後、選挙法が改正されて女性参政権が実現した。","tip":"『教育（津田梅子・明治）→運動（平塚らいてう・大正前後）→実現（女性参政権・戦後）』。","st":null},{"ev":["1871:郵便","1925:ラジオ","1953:テレビ"],"k":"g","tk":"f_tech","ti":"情報を伝える手段の発達","sum":"明治時代の初め、前島密の提案で郵便の制度が始まり、手紙が全国に届くようになった。大正時代末にはラジオ放送が始まり、ニュースなどが音声で全国に伝わるようになった。戦後の1953年にはテレビ放送が始まり、映像で情報が伝わるようになった。","tip":"『手紙（郵便）→音声（ラジオ）→映像（テレビ）』と、伝え方が進んだ順に並べる。","st":["明治時代に郵便の制度が始まって手紙で情報が届くようになり、大正時代末にはラジオ放送で音声が全国に届くようになった。","大正時代末に始まったラジオ放送に続き、戦後の1953年にはテレビ放送が始まり、映像が家庭に届くようになった。"]},{"ev":["1872:学制","1890:教育勅語","1947:教育基本法"],"k":"g","tk":"f_law","ti":"教育制度の移り変わり","sum":"1872年、明治政府は6歳以上のすべての男女に教育を受けさせる学制を公布した。1890年には忠君愛国の道徳を示す教育勅語が出され、教育の柱とされた。戦後の1947年には、民主主義の教育の基本を示す教育基本法が制定された。","tip":"学校制度の始まり→天皇中心の道徳（勅語）→戦後の民主的な教育、の順。","st":["1872年の学制で全国に小学校がつくられた。その後、憲法制定の翌年の1890年に教育勅語が出され、教育の基本とされた。","戦前の教育の柱だった教育勅語にかわり、戦後の1947年には民主主義の教育の基本を示す教育基本法が制定された。"]},{"ev":["1872:富岡製糸場","1895:下関条約","1901:八幡製鉄所"],"k":"l","tk":"f_econ","ti":"日本の産業革命","sum":"明治政府は殖産興業を進め、フランスの技術を取り入れた官営の富岡製糸場をつくった。こうして生糸などの軽工業が発達した。日清戦争の講和条約である下関条約で多額の賠償金を得ると、その一部を使って官営の八幡製鉄所が建設され、重工業が発達し始めた。","tip":"『軽工業（富岡・製糸）→賠償金（下関条約）→重工業（八幡・製鉄）』。","st":["富岡製糸場など殖産興業で軽工業が発達した日本は、日清戦争に勝ち、下関条約で多額の賠償金を得た。","下関条約で得た賠償金の一部を使って官営の八幡製鉄所が建設され、重工業が発達し始めた。"]},{"ev":["1872:富岡製糸場","1901:八幡製鉄所","1911:工場法"],"k":"g","tk":"f_econ","ti":"産業の発展と労働問題","sum":"1872年に官営の富岡製糸場が操業し、殖産興業が進んで製糸業などの軽工業が発展した。1901年には官営の八幡製鉄所が操業を始め、重工業も発展した。工業の発展とともに長時間労働などの労働問題が深刻になり、1911年に労働者を保護する工場法が制定された。","tip":"軽工業（製糸）→重工業（製鉄）→労働者を守る法律、の順に並べる。","st":["富岡製糸場などの殖産興業で軽工業が発展し、日清戦争の後には八幡製鉄所が操業して重工業が発展した。","八幡製鉄所の操業などで工業が発展する一方、労働者の長時間労働が問題となり、工場法が制定された。"]},{"ev":["1874:民撰議院設立の建白書","1877:西南戦争","1881:国会開設の勅諭"],"k":"l","tk":"e11","ti":"武力から言論へ","sum":"1874年の民撰議院設立の建白書で自由民権運動が始まった。1877年の西南戦争が政府軍に鎮圧されると、武力で政府に対抗することは難しくなり、言論による自由民権運動が中心となって全国に広がった。これに押された政府は1881年に国会開設の勅諭を出した。","tip":"西南戦争が最後の士族の反乱で、そのあと民権運動が高まり国会開設が約束されたと覚える。","st":["民撰議院設立の建白書で自由民権運動が始まった後、不満をもつ士族が西郷隆盛を中心に西南戦争を起こした。","西南戦争が鎮圧されて武力での抵抗は終わり、言論による運動が高まった結果、政府は国会開設の勅諭を出した。"]},{"ev":["1874:民撰議院設立の建白書","1880:国会期成同盟","1881:国会開設の勅諭"],"k":"l","tk":"e11","ti":"国会開設を求める運動","sum":"1874年、板垣退助らが民撰議院設立の建白書を政府に提出し、自由民権運動が始まった。運動は全国に広がり、1880年には各地の代表が大阪に集まって国会期成同盟を結成した。運動の高まりを受けて、政府は1881年に国会開設の勅諭を出し、10年後に国会を開くことを約束した。","tip":"『建白書で運動が始まる→全国の団体が結集→政府が国会開設を約束』の順。","st":["民撰議院設立の建白書から始まった自由民権運動は全国に広がり、1880年には大阪で国会期成同盟が結成された。","国会期成同盟を中心に国会開設を求める運動が高まり、政府は1881年に国会開設の勅諭を出した。"]},{"ev":["1874:民撰議院設立の建白書","1881:国会開設の勅諭","1885:内閣制度","1889:大日本帝国憲法"],"k":"l","tk":"e11","ti":"自由民権運動と憲法の制定","sum":"1874年の民撰議院設立の建白書から自由民権運動が始まり、全国に広がった。政府は1881年に国会開設の勅諭で国会開設を約束し、1885年に内閣制度をつくって伊藤博文が初代首相となった。そして1889年、伊藤らが中心となってつくった大日本帝国憲法が発布された。","tip":"「要求→約束→準備→完成」の順。建白書（1874）・勅諭（1881）・内閣（1885）・憲法（1889）。","st":null},{"ev":["1875:樺太・千島交換条約","1904:日露戦争","1905:ポーツマス条約"],"k":"l","tk":"e12","ti":"樺太をめぐる日本とロシア","sum":"1875年の樺太・千島交換条約で、樺太はロシア領、千島列島は日本領となった。その後、満州・朝鮮をめぐる対立から1904年に日露戦争が起こった。1905年のポーツマス条約で、日本は樺太の南半分（北緯50度以南）をロシアからゆずり受けた。","tip":"樺太がロシア領になる→日露戦争→南樺太が日本領になる、の順。","st":["樺太・千島交換条約で樺太はロシア領となったが、のちに満州・朝鮮をめぐる対立から日露戦争が起こった。","日露戦争の講和条約であるポーツマス条約で、日本は樺太の南半分をロシアからゆずり受けた。"]},{"ev":["1875:樺太・千島交換条約","1905:ポーツマス条約","1956:日ソ共同宣言"],"k":"g","tk":"f_ns","ti":"日本とロシア（ソ連）の国境","sum":"1875年の樺太・千島交換条約で、樺太はロシア領、千島列島は日本領と決められた。日露戦争後の1905年のポーツマス条約で、日本は樺太の南半分を得た。戦後はソ連との国交がとだえていたが、1956年の日ソ共同宣言で国交を回復した。","tip":"樺太と千島の交換→日露戦争で南樺太を得る→戦後に日ソの国交回復、の順。","st":["樺太・千島交換条約で樺太はロシア領となったが、日露戦争後のポーツマス条約で、日本は樺太の南半分を手に入れた。","第二次世界大戦の後、日本とソ連の国交はとだえていたが、ポーツマス条約から約50年後の日ソ共同宣言で国交が回復した。"]},{"ev":["1876:日朝修好条規","1894:日清戦争","1910:韓国併合"],"k":"l","tk":"f_asia","ti":"朝鮮への進出","sum":"1876年に日本は朝鮮に不平等な日朝修好条規を結ばせ、朝鮮への進出を始めた。朝鮮への影響力をめぐって清と対立し、1894年に甲午農民戦争をきっかけに日清戦争が起こった。その後、日露戦争にも勝った日本は、1910年に韓国併合を行った。","tip":"朝鮮を開国させる→朝鮮をめぐり清と戦う→朝鮮を植民地にする、と覚える。","st":["日朝修好条規で朝鮮を開国させた日本は、朝鮮への影響力をめぐって清と対立し、日清戦争を起こした。","日清戦争で清の影響を朝鮮から排除した日本は、日露戦争にも勝ったのち、韓国併合で朝鮮を植民地とした。"]},{"ev":["1876:日朝修好条規","1910:韓国併合","1919:三・一独立運動"],"k":"l","tk":"f_asia","ti":"朝鮮の植民地化と独立運動","sum":"1876年の日朝修好条規で朝鮮に進出した日本は、日清・日露戦争をへて1910年に韓国併合を行い、朝鮮を植民地とした。日本の植民地支配に対して、1919年に朝鮮の人々が独立を求めて三・一独立運動を起こした。","tip":"「進出→併合→抵抗」。三・一独立運動は第一次世界大戦後（1919年）で、中国の五・四運動と同じ年。","st":null},{"ev":["1879:沖縄県","1951:サンフランシスコ平和条約","1972:沖縄"],"k":"l","tk":"f_ns","ti":"沖縄の近代と戦後","sum":"明治政府は琉球藩を廃止して1879年に沖縄県を置いた。太平洋戦争で地上戦の場となった沖縄は、1951年のサンフランシスコ平和条約で日本が独立を回復した後も、アメリカの統治下に置かれた。そして1972年に日本に返還された。","tip":"沖縄県の設置（明治）→平和条約でアメリカ統治が続く→返還（1972年）、の順。","st":["1879年に沖縄県が置かれた沖縄は、戦後アメリカに占領され、サンフランシスコ平和条約の後も引き続きアメリカの統治下に置かれた。","サンフランシスコ平和条約で日本は独立したが沖縄はアメリカの統治下に残り、復帰運動などをへて1972年に返還された。"]},{"ev":["1881:国会開設の勅諭","1882:立憲改進党","1890:帝国議会"],"k":"l","tk":"e11","ti":"政党の結成と議会の開設","sum":"1881年、政府は国会開設の勅諭を出し、10年後に国会を開くことを約束した。国会開設に備えて政党がつくられ、板垣退助が自由党を、翌1882年には大隈重信が立憲改進党を結成した。1890年に第1回衆議院議員選挙が行われて帝国議会が開かれ、民権派の政党が多くの議席を得た。","tip":"『国会を開く約束→政党づくり→帝国議会の開会』。約束から約10年で議会が開かれた。","st":["国会開設の勅諭が出されると国会に備えて政党がつくられ、1882年には大隈重信が立憲改進党を結成した。","立憲改進党や自由党など民権派の政党は、1890年に帝国議会が開かれると、衆議院で多くの議席を得た。"]},{"ev":["1881:国会開設の勅諭","1885:内閣制度","1889:大日本帝国憲法"],"k":"l","tk":"e11","ti":"立憲政治への歩み","sum":"自由民権運動の高まりを受けて、政府は1881年に国会開設の勅諭を出し、10年後に国会を開くことを約束した。その準備として1885年に内閣制度をつくり、伊藤博文が初代総理大臣になった。伊藤らは憲法づくりを進め、1889年に大日本帝国憲法が発布された。","tip":"『約束（勅諭）→準備（内閣）→完成（憲法）』の順。内閣が憲法より先にできている点に注意。","st":null},{"ev":["1881:国会開設の勅諭","1889:大日本帝国憲法","1890:帝国議会"],"k":"l","tk":"e11","ti":"国会開設の約束が実現","sum":"1881年の国会開設の勅諭で、政府は10年後に国会を開くことを約束した。その準備として伊藤博文らが憲法づくりを進め、1889年に大日本帝国憲法が発布された。翌1890年には第1回衆議院議員選挙が行われ、約束どおり帝国議会が開かれた。","tip":"国会を開く約束→国会のルールとなる憲法→実際に国会が開かれる、の順。","st":["国会開設の勅諭で10年後の国会開設を約束した政府は、その準備として大日本帝国憲法をつくって発布した。","大日本帝国憲法の発布の翌年に第1回衆議院議員選挙が行われ、勅諭の約束どおり帝国議会が開かれた。"]},{"ev":["1885:内閣制度","1889:大日本帝国憲法","1890:帝国議会"],"k":"l","tk":"e11","ti":"立憲政治のしくみが整う","sum":"1885年に内閣制度がつくられ、伊藤博文が初代の内閣総理大臣となった。伊藤博文らはドイツ（プロイセン）の憲法を参考に草案をつくり、1889年に大日本帝国憲法が発布された。翌1890年には帝国議会が開かれ、日本はアジアで初めての近代的な立憲制国家となった。","tip":"『内閣（政府）→憲法（国のきまり）→議会（国民の代表）』。憲法発布の翌年に議会が開かれた。","st":["内閣制度がつくられて伊藤博文が初代総理大臣となり、その伊藤らが中心となって大日本帝国憲法の草案をつくった。","大日本帝国憲法が発布された翌年の1890年、第1回衆議院議員選挙が行われ、帝国議会が開かれた。"]},{"ev":["1885:内閣制度","1912:第一次護憲運動","1918:原敬"],"k":"g","tk":"e13","ti":"藩閥政治から政党政治へ","sum":"1885年に内閣制度がつくられ、長州藩出身の伊藤博文が初代内閣総理大臣となるなど、薩摩・長州出身者による藩閥政治が続いた。1912年には藩閥の桂太郎内閣に反対する第一次護憲運動が起こった。1918年に原敬が初めての本格的な政党内閣を組織した。","tip":"藩閥の内閣が続く→それに反対する運動→政党内閣の誕生、と覚える。","st":["内閣制度ができた後も薩摩・長州出身者が内閣を動かしたため、藩閥の桂太郎内閣に反対して第一次護憲運動が起こった。","第一次護憲運動で憲法に基づく政治を求める声が高まり、のちに原敬が初めての本格的な政党内閣をつくった。"]},{"ev":["1890:北里柴三郎","1897:志賀潔","1949:湯川秀樹"],"k":"g","tk":"f_tech","ti":"日本の科学者の活躍","sum":"明治時代、北里柴三郎が破傷風の血清療法を発見した。北里の伝染病研究所で学んだ志賀潔は赤痢菌を発見した。こうした自然科学の研究の積み重ねのうえに、戦後には湯川秀樹が日本人で初めてノーベル賞（物理学賞）を受賞した。","tip":"北里（明治・師）→志賀（明治・北里のもとで研究）→湯川（戦後・日本人初のノーベル賞）の順。","st":["破傷風の血清療法を発見した北里柴三郎の研究所で学んだ志賀潔が、1897年に赤痢菌を発見した。","北里柴三郎や志賀潔ら明治の医学者のあとも研究が進み、1949年に湯川秀樹が日本人初のノーベル賞を受賞した。"]},{"ev":["1890:帝国議会","1925:普通選挙法","1945:女性参政権"],"k":"g","tk":"f_law","ti":"選挙権の拡大","sum":"1890年に帝国議会が開かれたとき、衆議院議員の選挙権は直接国税15円以上を納める満25歳以上の男子だけだった。1925年の普通選挙法で納税額の制限がなくなり、満25歳以上のすべての男子が選挙権をもった。1945年には女性参政権が実現した。","tip":"一部の男子だけ→すべての男子→男女ともに、と選挙権が広がる順に並べる。","st":["帝国議会の開設時は一部の裕福な男子しか選挙権をもたなかったが、普通選挙法で納税額による制限がなくなった。","普通選挙法では選挙権は満25歳以上の男子だけだったが、戦後の改正で女性参政権が認められ男女の選挙権が実現した。"]},{"ev":["1891:田中正造","1967:公害対策基本法","1997:京都議定書"],"k":"g","tk":"f_econ","ti":"公害・環境問題への取り組み","sum":"明治時代、足尾銅山の鉱毒事件で田中正造が被害を訴えた。高度経済成長期には四大公害病などが深刻になり、1967年に公害対策基本法が制定された。さらに1997年には、地球温暖化を防ぐため京都議定書が採択された。","tip":"足尾の鉱毒（明治）→公害対策の法律（高度成長期）→地球温暖化対策（平成）、の順。","st":["明治時代の足尾銅山鉱毒事件で田中正造が被害を訴えた。高度経済成長期にも公害が深刻になり、公害対策基本法が制定された。","国内の公害対策として公害対策基本法がつくられた後、地球規模の環境問題として温暖化が注目され、京都議定書が採択された。"]},{"ev":["1894:日清戦争","1895:下関条約","1902:日英同盟","1904:日露戦争"],"k":"l","tk":"e12","ti":"日清戦争から日露戦争へ","sum":"日清戦争に勝った日本は下関条約で遼東半島などを得たが、ロシアなどの三国干渉で遼東半島を返した。その後もロシアが満州・朝鮮へ進出したため、同じくロシアを警戒するイギリスと1902年に日英同盟を結んだ。イギリスを味方につけた日本は、1904年にロシアとの日露戦争に踏み切った。","tip":"日英同盟は日露戦争の「準備」。同盟が先、戦争があとと覚える。","st":null},{"ev":["1894:日清戦争","1904:日露戦争","1905:ポーツマス条約"],"k":"l","tk":"e12","ti":"日清戦争から日露戦争の講和へ","sum":"1894年、朝鮮をめぐる清との対立から日清戦争が起こり、日本が勝利した。その後、三国干渉を受け、満州・朝鮮をめぐってロシアとの対立が深まり、1904年に日露戦争が始まった。戦争を続ける力がつきかけた両国は、1905年にアメリカの仲介でポーツマス条約を結んだ。","tip":"日清（1894）→日露（1904）→ポーツマス（1905）。講和条約は「下関＝日清」「ポーツマス＝日露」。","st":null},{"ev":["1902:日英同盟","1914:第一次世界大戦","1915:二十一か条の要求"],"k":"l","tk":"e13","ti":"日英同盟と大戦への参戦","sum":"1902年、ロシアの南下に対抗するため日本は日英同盟を結んだ。1914年に第一次世界大戦が始まると、日本は日英同盟を理由に連合国側で参戦し、中国にあるドイツの拠点を攻撃した。そして1915年、中国に二十一か条の要求を示し、その大部分を認めさせた。","tip":"イギリスと同盟を結ぶ→同盟を理由に大戦に参戦→中国に要求、と覚える。","st":["ロシアに対抗するために結んだ日英同盟を理由に、日本は第一次世界大戦に連合国側として参戦した。","第一次世界大戦でヨーロッパ諸国がアジアに目を向けられない間に、日本は中国に二十一か条の要求を示した。"]},{"ev":["1904:日露戦争","1905:ポーツマス条約","1910:韓国併合"],"k":"l","tk":"e12","ti":"日露戦争と韓国併合","sum":"1904年に始まった日露戦争は、1905年にアメリカの仲介でポーツマス条約を結んで終わった。この条約で韓国での優越権を認められた日本は、韓国を保護国として支配を強め、1910年に韓国併合を行って植民地とした。","tip":"ポーツマス条約で「韓国での優越権」→韓国併合。権利を得てから併合する順。","st":null},{"ev":["1904:与謝野晶子","1911:平塚らいてう","1920:新婦人協会"],"k":"g","tk":"f_women","ti":"女性の声の高まり","sum":"日露戦争のとき、与謝野晶子は戦場の弟を思って「君死にたまふことなかれ」という詩を発表した。1911年には平塚らいてうらが青鞜社を結成し、女性の解放を訴えた。さらに1920年、平塚らいてうや市川房枝らは新婦人協会を設立し、女性の政治参加などを求めた。","tip":"『詩で思いを表す（日露戦争）→雑誌で解放を訴える（青鞜社）→団体で政治参加を求める』の順。","st":["日露戦争中に与謝野晶子が戦場の弟を思う詩を発表し、のちに平塚らいてうらが青鞜社を結成して女性の解放を訴えた。","青鞜社で女性の解放を訴えた平塚らいてうは、1920年に市川房枝らと新婦人協会を設立し、女性の政治参加を求めた。"]},{"ev":["1910:韓国併合","1914:第一次世界大戦","1919:三・一独立運動"],"k":"l","tk":"f_asia","ti":"民族自決と朝鮮の独立運動","sum":"1910年の韓国併合で朝鮮は日本の植民地となった。1914年に始まった第一次世界大戦の講和会議では、民族自決の考えが唱えられた。この影響を受けて、1919年に朝鮮の人々は日本からの独立を求める三・一独立運動を起こした。","tip":"植民地になる→大戦後に民族自決が唱えられる→独立運動、と覚える。","st":["韓国併合で朝鮮が日本の植民地となった4年後、ヨーロッパで第一次世界大戦が始まった。","第一次世界大戦の講和会議で唱えられた民族自決の考えに影響され、朝鮮で三・一独立運動が起こった。"]},{"ev":["1910:韓国併合","1950:朝鮮戦争","1965:日韓基本条約"],"k":"g","tk":"f_asia","ti":"日本と朝鮮半島","sum":"1910年、日本は韓国併合を行い、朝鮮を植民地とした。日本の敗戦後、朝鮮半島は南北に分かれ、1950年に朝鮮戦争が起こった。その後、日本は1965年に韓国と日韓基本条約を結び、国交を正常化した。","tip":"植民地支配（韓国併合）→南北分断と朝鮮戦争→韓国との国交正常化、の順。","st":["韓国併合で日本の植民地となった朝鮮は、日本の敗戦で解放されたが南北に分かれ、1950年に朝鮮戦争が起こった。","朝鮮戦争は休戦となり、その後の1965年に、日本は韓国と日韓基本条約を結んで国交を正常化した。"]},{"ev":["1911:辛亥革命","1919:五・四運動","1949:中華人民共和国"],"k":"l","tk":"f_w3","ti":"近代中国の移り変わり","sum":"孫文らの指導で辛亥革命が起こり、清の支配がくずれて中華民国が成立した。第一次世界大戦後、日本の二十一か条の要求などに反発して五・四運動が起こった。日本の敗戦後、国民党との内戦に勝った共産党が中華人民共和国を成立させた。","tip":"『清がたおれる（辛亥革命）→反日運動（五・四運動）→共産党の国（中華人民共和国）』。","st":["辛亥革命で中華民国が成立したが、第一次世界大戦中の日本の二十一か条の要求などに反発し、1919年に五・四運動が起こった。","五・四運動のあとも中国では日本との戦争や国民党と共産党の内戦が続き、内戦に勝った共産党が中華人民共和国を成立させた。"]},{"ev":["1911:平塚らいてう","1925:普通選挙法","1945:女性参政権"],"k":"l","tk":"f_women","ti":"選挙権の拡大と女性","sum":"平塚らいてうは青鞜社を結成して女性の解放を訴え、のちに新婦人協会をつくって女性の政治参加を求めた。1925年の普通選挙法で満25歳以上の男子に選挙権が与えられたが、女性には認められなかった。女性参政権が実現したのは戦後の1945年である。","tip":"普通選挙法は「男子だけ」。女性の選挙権は戦後（1945年）と区別する。","st":["平塚らいてうらが女性の解放と政治参加を求めたが、1925年の普通選挙法で選挙権を得たのは満25歳以上の男子だけだった。","男子だけの普通選挙法のあと、戦後の民主化の中で選挙法が改正され、満20歳以上の男女に選挙権を与える女性参政権が実現した。"]},{"ev":["1912:第一次護憲運動","1918:原敬","1924:第二次護憲運動","1925:普通選挙法"],"k":"l","tk":"e13","ti":"大正デモクラシーの歩み","sum":"藩閥の桂太郎内閣に反対する第一次護憲運動が起こり、民衆の力で内閣が倒れた。米騒動のあと原敬が初めての本格的な政党内閣を組織した。第二次護憲運動で加藤高明の護憲三派内閣が成立し、1925年に普通選挙法が成立した。","tip":"『護憲運動①→政党内閣（原敬）→護憲運動②→普通選挙法』。①と②の間に原敬。","st":["第一次護憲運動で憲法にもとづく政治を求める声が高まり、米騒動のあと原敬が初めての本格的な政党内閣を組織した。","原敬の政党内閣のあとも政党を無視した内閣が生まれたため、第二次護憲運動が起こり、護憲三派内閣が成立した。","第二次護憲運動で成立した加藤高明内閣のもとで、満25歳以上のすべての男子に選挙権を与える普通選挙法が成立した。"]},{"ev":["1912:第一次護憲運動","1918:米騒動","1925:普通選挙法"],"k":"g","tk":"f_people","ti":"民衆の力と普通選挙","sum":"1912年、憲法に基づく政治を求める第一次護憲運動が起こり、民衆の力で桂太郎内閣が倒れた。1918年には米の値上がりから米騒動が全国に広がり、その後原敬の政党内閣ができた。民衆の政治参加を求める声が高まる中、1925年に普通選挙法が成立した。","tip":"大正デモクラシーの民衆運動。護憲運動（大正の初め）→米騒動（大戦の末）→普通選挙法の順。","st":["第一次護憲運動で民衆の力が内閣を倒し、のちの1918年には米の値上がりに怒った人々による米騒動が全国に広がった。","米騒動ののち原敬の政党内閣ができ、民衆の政治参加を求める運動が高まって1925年に普通選挙法が成立した。"]},{"ev":["1912:第一次護憲運動","1918:原敬","1932:五・一五事件"],"k":"l","tk":"f_gov","ti":"政党政治の始まりと終わり","sum":"1912年、藩閥の桂太郎内閣に反対する第一次護憲運動が起こり、民衆の力が政治を動かした。米騒動のあとの1918年には原敬が初めての本格的な政党内閣を組織した。こうして続いた政党内閣の時代は、1932年の五・一五事件で犬養毅首相が暗殺されて終わった。","tip":"『護憲運動で始まり→原敬で本格化→五・一五事件で終わる』と政党政治の一生で覚える。","st":null},{"ev":["1914:第一次世界大戦","1915:二十一か条の要求","1919:五・四運動"],"k":"l","tk":"e13","ti":"第一次大戦と中国の反発","sum":"1914年に第一次世界大戦が始まると、ヨーロッパ諸国はアジアに目を向ける余裕を失った。そのすきに日本は1915年、中国に二十一か条の要求を示し、山東省の権益などを認めさせた。1919年のパリ講和会議でこの権益が認められると、中国で反日・反帝国主義の五・四運動が起こった。","tip":"要求（1915年）→講和会議で認められる→反発（1919年の五・四運動）の順。","st":null},{"ev":["1914:第一次世界大戦","1917:ロシア革命","1918:シベリア出兵"],"k":"l","tk":"f_w3","ti":"第一次世界大戦とロシア革命","sum":"サラエボ事件をきっかけに第一次世界大戦が始まった。戦争中、ロシアではレーニンの指導でロシア革命が起こり、社会主義の政府ができた。革命の影響が広がるのをおそれた日本などはシベリア出兵を行った。","tip":"『大戦→大戦中に革命→革命への干渉（シベリア出兵）』。シベリア出兵は米騒動と同じ1918年。","st":null},{"ev":["1914:第一次世界大戦","1918:米騒動","1922:全国水平社"],"k":"l","tk":"e13","ti":"大戦景気と社会運動","sum":"1914年に始まった第一次世界大戦で日本は大戦景気となったが、物価も大きく上がった。シベリア出兵を見こした米の買い占めもあり、1918年に米騒動が全国に広がった。これをきっかけに社会運動が活発になり、1922年には部落差別からの解放をめざす全国水平社が結成された。","tip":"大戦景気で物価が上がる→米騒動→社会運動の高まり、の順に並べる。","st":["第一次世界大戦による大戦景気で物価が上がり、米の値段も急に上がったため、全国で米騒動が起こった。","米騒動をきっかけに民衆の運動が活発になり、部落差別からの解放をめざして全国水平社が結成された。"]},{"ev":["1914:第一次世界大戦","1919:ベルサイユ条約","1920:国際連盟"],"k":"l","tk":"e13","ti":"第一次大戦後の国際協調","sum":"1914年に始まった第一次世界大戦が終わると、1919年にパリ講和会議が開かれ、ベルサイユ条約が結ばれた。会議ではアメリカのウィルソン大統領の提案をもとに国際平和を守る機関をつくることが決まり、1920年に国際連盟が発足した。","tip":"戦争→講和条約→平和のしくみ（国際連盟）の順。ベルサイユ条約と連盟は1年違い。","st":null},{"ev":["1914:第一次世界大戦","1919:ベルサイユ条約","1920:国際連盟","1921:ワシントン会議"],"k":"l","tk":"e13","ti":"大戦後の国際協調の流れ","sum":"第一次世界大戦が終わると、1919年のパリ講和会議でベルサイユ条約が結ばれた。ウィルソン大統領の提案をもとに、1920年には国際連盟が発足した。こうした国際協調の動きの中で、1921年からワシントン会議が開かれ、海軍の軍備の制限などが話し合われた。","tip":"『大戦→ベルサイユ→連盟→ワシントン』。ヨーロッパの戦後処理のあとに軍縮の話し合い。","st":null},{"ev":["1914:第一次世界大戦","1923:関東大震災","1927:金融恐慌"],"k":"l","tk":"f_econ","ti":"大戦後の不景気","sum":"1914年に始まった第一次世界大戦で日本は好景気となったが、戦争が終わると輸出が減って不景気になった。1923年には関東大震災が起こり、経済はさらに打撃を受けた。不景気が続く中で銀行の経営が悪化し、1927年に金融恐慌が起こった。","tip":"大戦景気のあとの不景気→震災でさらに打撃→銀行の危機、の順。","st":["第一次世界大戦中は好景気だったが、戦後は不景気となり、さらに関東大震災で経済が大きな打撃を受けた。","関東大震災の後も不景気が続いて銀行の経営が悪化し、預金の引き出しが殺到して金融恐慌が起こった。"]},{"ev":["1915:二十一か条の要求","1919:ベルサイユ条約","1921:ワシントン会議"],"k":"l","tk":"e13","ti":"山東省の権益をめぐって","sum":"1915年、日本は二十一か条の要求で中国の山東省にあるドイツの権益を引きつぐことを認めさせた。1919年のベルサイユ条約でも日本はこの権益を認められた。しかし1921年からのワシントン会議で国際協調が進められ、日本は山東省の権益を中国に返した。","tip":"要求で権益を得る→講和条約で認められる→国際会議で返す、の順。","st":["二十一か条の要求で山東省のドイツ権益の引きつぎを求めた日本は、ベルサイユ条約でその権益を認められた。","ベルサイユ条約で日本が得た山東省の権益は、国際協調を進めたワシントン会議を受けて中国に返された。"]},{"ev":["1918:米騒動","1925:普通選挙法","1945:女性参政権"],"k":"l","tk":"f_people","ti":"選挙権の広がり","sum":"1918年の米騒動で民衆の力が示されると、普通選挙を求める運動が高まり、1925年に満25歳以上のすべての男子に選挙権を与える普通選挙法が成立した。しかし女性には選挙権がなく、戦後の1945年に女性参政権が実現して、満20歳以上の男女に選挙権が与えられた。","tip":"『男子だけ（1925年・25歳以上）→男女とも（1945年・20歳以上）』と条件の変化で覚える。","st":null},{"ev":["1919:ベルサイユ条約","1929:世界恐慌","1939:第二次世界大戦"],"k":"l","tk":"f_w3","ti":"二つの大戦の間","sum":"第一次世界大戦の講和条約としてベルサイユ条約が結ばれ、ドイツは多額の賠償金を課された。1929年に世界恐慌が起こると各国の経済が混乱し、ドイツではナチスが勢力をのばした。ドイツのポーランド侵攻により第二次世界大戦が始まった。","tip":"『講和（1919）→恐慌（1929）→大戦（1939）』と、ちょうど10年ごと。","st":["ベルサイユ条約で第一次世界大戦後の国際秩序がつくられたが、1929年に世界恐慌が起こり、各国の経済は大きく混乱した。","世界恐慌で生活が苦しくなったドイツではナチスが政権をにぎって侵略を進め、ポーランド侵攻から第二次世界大戦が始まった。"]},{"ev":["1920:新婦人協会","1925:普通選挙法","1945:女性参政権"],"k":"l","tk":"f_women","ti":"女性参政権の実現まで","sum":"1920年、平塚らいてうや市川房枝らが新婦人協会を設立し、女性の政治参加を求めた。しかし1925年の普通選挙法で選挙権を得たのは満25歳以上の男子だけだった。戦後の1945年に選挙法が改正され、ようやく女性参政権が実現した。","tip":"普通選挙法で選挙権を得たのは男子だけ。女性に選挙権が認められたのは戦後と覚える。","st":["新婦人協会が女性の政治参加を求めたが、1925年の普通選挙法で選挙権が与えられたのは満25歳以上の男子だけだった。","普通選挙法では女性に選挙権がなかったが、戦後の1945年に選挙法が改正され、女性参政権が実現した。"]},{"ev":["1923:関東大震災","1995:阪神・淡路大震災","2011:東日本大震災"],"k":"g","tk":"e17","ti":"近代日本の大きな震災","sum":"1923年の関東大震災では東京・横浜を中心に大きな被害が出た。1995年には阪神・淡路大震災が起こり、神戸市などで多くの建物が倒れた。2011年の東日本大震災では大津波や原子力発電所の事故が起こった。","tip":"大正の関東→平成はじめの阪神・淡路→平成後半の東日本、の順。","st":["大正時代の関東大震災から約70年後、1995年に阪神・淡路大震災が起こり、ボランティア活動が広がるきっかけとなった。","阪神・淡路大震災から16年後の2011年、東日本大震災が起こり、津波と福島の原子力発電所の事故で大きな被害が出た。"]},{"ev":["1927:金融恐慌","1929:世界恐慌","1930:昭和恐慌"],"k":"g","tk":"e14","ti":"昭和初期の不景気の連続","sum":"まず国内の銀行の経営悪化から金融恐慌が起こった。その後、ニューヨークの株価大暴落から世界恐慌が起こり、その影響が日本にもおよんで昭和恐慌となった。不景気が国内から世界へ、そしてまた日本へと広がった流れである。","tip":"金融恐慌は日本だけの問題、昭和恐慌は世界恐慌の影響で起きた。世界恐慌が間に入ると覚える。","st":["金融恐慌は日本国内の銀行の問題で起きた。その2年後、アメリカから世界恐慌が始まり、不景気は世界中に広がった。","世界恐慌の影響が日本にもおよび、生糸の輸出が減るなどして昭和恐慌が起こり、特に農村が苦しんだ。"]},{"ev":["1929:世界恐慌","1930:昭和恐慌","1931:満州事変","1933:国際連盟"],"k":"l","tk":"e14","ti":"世界恐慌から国際的な孤立へ","sum":"ニューヨークの株価大暴落をきっかけに世界恐慌が起こり、日本でもその影響で昭和恐慌が起こった。行きづまりを満州の支配で打開しようと、関東軍は満州事変を起こした。国際連盟が満州国を認めない勧告を採択すると、日本は国際連盟を脱退し、国際的に孤立した。","tip":"『世界恐慌→昭和恐慌→満州事変→連盟脱退（1933）』。経済の危機が戦争と孤立につながる。","st":["ニューヨークから始まった世界恐慌の影響が日本にもおよび、昭和恐慌が起こって農村などが特に苦しんだ。","昭和恐慌で不況が深刻になる中、関東軍は満州の支配で打開しようとして満州事変を起こした。","満州事変のあとつくられた満州国を国際連盟が認めなかったため、日本は国際連盟を脱退した。"]},{"ev":["1930:昭和恐慌","1931:満州事変","1932:満州国"],"k":"l","tk":"e14","ti":"満州事変と満州国","sum":"1930年の昭和恐慌で不況が深刻になると、満州を支配して行きづまりを打開しようとする考えが軍部の中で強まった。1931年、関東軍は南満州鉄道の線路を爆破して満州事変を起こし、満州の大部分を占領した。翌1932年には清の最後の皇帝溥儀を元首とする満州国を建国させた。","tip":"事変（占領する）→満州国（国をつくらせる）の順。満州国は事変の翌年。","st":null},{"ev":["1931:満州事変","1932:満州国","1933:国際連盟"],"k":"l","tk":"e14","ti":"満州事変と国際連盟脱退","sum":"関東軍は南満州鉄道の線路を爆破して満州事変を起こし、満州の大部分を占領した。翌年、清の最後の皇帝溥儀を元首とする満州国を建国させた。国際連盟はリットン調査団の報告をもとに満州国を認めない勧告を採択し、日本は国際連盟を脱退した。","tip":"『占領（満州事変）→建国（満州国）→脱退（国際連盟）』と1年ずつ。","st":["満州事変で満州の大部分を占領した関東軍は、翌年、溥儀を元首とする満州国を建国させた。","日本がつくらせた満州国を国際連盟が認めず、日本軍の撤兵を求める勧告を採択したため、日本は国際連盟を脱退した。"]},{"ev":["1931:満州事変","1932:五・一五事件","1936:二・二六事件"],"k":"l","tk":"e14","ti":"満州事変と軍部の台頭","sum":"1931年に関東軍が満州事変を起こすと、軍部の力が強まった。1932年には政党政治に不満をもつ海軍の青年将校らが五・一五事件で犬養毅首相を暗殺し、政党内閣の時代が終わった。さらに1936年、陸軍の青年将校らが二・二六事件を起こし、軍部の政治への発言力はいっそう強まった。","tip":"満州事変の翌年が五・一五事件。そこから4年後に二・二六事件と年の間隔もおさえる。","st":null},{"ev":["1931:満州事変","1932:五・一五事件","1936:二・二六事件","1937:日中戦争"],"k":"l","tk":"e14","ti":"軍部の台頭と日中戦争","sum":"1931年に関東軍が満州事変を起こして軍部の力が強まると、1932年に五・一五事件が起こり、政党内閣の時代が終わった。1936年には陸軍の青年将校らによる二・二六事件が起こり、軍部の発言力はさらに強まった。そして翌1937年、盧溝橋事件をきっかけに日中戦争が始まった。","tip":"国外（満州事変）→国内（2つの事件）→再び国外（日中戦争）と、場所の行き来に注意。","st":null},{"ev":["1931:満州事変","1937:日中戦争","1941:太平洋戦争"],"k":"l","tk":"e14","ti":"満州事変から太平洋戦争へ","sum":"1931年、関東軍が満州事変を起こして満州を占領した。中国への軍事行動はさらに広がり、1937年に盧溝橋事件をきっかけに日中戦争が始まった。日中戦争が長引く中、資源を求めて東南アジアへ進出した日本はアメリカなどと対立し、1941年に真珠湾を攻撃して太平洋戦争が始まった。","tip":"満州（1931年）→中国全体（1937年）→アメリカなど（1941年）と戦線が広がる順。","st":null},{"ev":["1933:国際連盟","1940:日独伊三国同盟","1941:太平洋戦争"],"k":"l","tk":"e14","ti":"国際的な孤立から太平洋戦争へ","sum":"満州国を認めない勧告に反発した日本は国際連盟を脱退し、国際的に孤立した。その後、同じように連盟を脱退したドイツ・イタリアと日独伊三国同盟を結んだためアメリカとの対立が深まり、太平洋戦争が始まった。","tip":"孤立（連盟脱退）→仲間づくり（三国同盟）→アメリカと開戦、の順で考える。","st":["国際連盟を脱退して孤立した日本は、やがて同じく連盟を脱退したドイツ・イタリアに接近し、日独伊三国同盟を結んだ。","日独伊三国同盟を結び、さらに南に進出したことでアメリカとの対立が決定的になり、1941年に太平洋戦争が始まった。"]},{"ev":["1937:日中戦争","1938:国家総動員法","1940:大政翼賛会"],"k":"l","tk":"e14","ti":"日中戦争と戦時体制","sum":"1937年に日中戦争が始まり、戦争は長引いた。そこで政府は1938年に国家総動員法を制定し、議会の承認なしに国民や物資を戦争に動員できるようにした。戦時体制が強まる中、1940年にはほとんどの政党が解散して大政翼賛会にまとめられた。","tip":"『戦争→総動員法→大政翼賛会』。総動員法は日中戦争の翌年と覚える。","st":null},{"ev":["1937:日中戦争","1941:太平洋戦争","1945:ポツダム宣言"],"k":"l","tk":"e14","ti":"戦争の拡大と終結","sum":"盧溝橋事件をきっかけに日中戦争が始まり、長期化した。戦争の資源を求めて南へ進出したことでアメリカなどと対立し、太平洋戦争が始まった。戦局が悪化し、原子爆弾の投下などを受けて日本はポツダム宣言を受け入れて降伏した。","tip":"中国との戦争→アメリカなどとの戦争→降伏。戦争の相手が広がってから終わる。","st":["日中戦争が長期化し、資源を求めて東南アジアへ進出したことでアメリカなどと対立し、太平洋戦争に発展した。","太平洋戦争は日本に不利になり、1945年に日本はポツダム宣言を受け入れて降伏し、戦争が終わった。"]},{"ev":["1937:日中戦争","1972:日中共同声明","1978:日中平和友好条約"],"k":"l","tk":"f_asia","ti":"日中関係の回復","sum":"盧溝橋事件をきっかけに日中戦争が始まり、戦争は長く続いた。戦後、日本は長く中華人民共和国と国交がなかったが、1972年に日中共同声明が発表されて国交が正常化した。1978年には日中平和友好条約が結ばれた。","tip":"『戦争（1937）→国交正常化（共同声明1972）→条約（平和友好条約1978）』。声明が先、条約があと。","st":["日中戦争ののち、戦後も中華人民共和国との国交がない状態が続いたが、1972年に日中共同声明で国交が正常化した。","日中共同声明での国交正常化に続いて、1978年に日中平和友好条約が結ばれた。"]},{"ev":["1939:第二次世界大戦","1940:日独伊三国同盟","1941:太平洋戦争"],"k":"l","tk":"e14","ti":"第二次大戦と太平洋戦争","sum":"1939年、ドイツのポーランド侵攻により第二次世界大戦が始まった。ドイツが優勢に戦いを進めるのを見て、日本は1940年に日独伊三国同盟を結んだ。これによりアメリカとの対立が深まり、石油などの輸出を止められた日本は、1941年に真珠湾を攻撃して太平洋戦争を始めた。","tip":"ヨーロッパで大戦→日本がドイツと組む→アメリカと開戦。太平洋戦争は大戦の途中から。","st":null},{"ev":["1945:ポツダム宣言","1946:日本国憲法","1947:教育基本法"],"k":"l","tk":"f_law","ti":"降伏から新しい憲法へ","sum":"1945年、日本はポツダム宣言を受け入れて降伏した。宣言にもとづいて民主化が進められ、1946年に国民主権・基本的人権の尊重・平和主義を原則とする日本国憲法が公布された。1947年には、憲法の精神にもとづいて民主主義の教育の基本を示す教育基本法が制定された。","tip":"降伏（ポツダム宣言）→国の基本（憲法）→教育の基本（教育基本法）の順。","st":null},{"ev":["1945:国際連合","1949:中華人民共和国","1950:朝鮮戦争"],"k":"l","tk":"f_w3","ti":"冷戦の始まりとアジア","sum":"第二次世界大戦後、世界の平和を守るため国際連合が発足したが、アメリカとソ連の対立（冷戦）が深まった。中国では共産党が中華人民共和国を成立させた。朝鮮半島では南北の対立から朝鮮戦争が起こった。","tip":"『国連発足（1945）→中華人民共和国（1949）→朝鮮戦争（1950）』。","st":["国際連合が発足したものの米ソの対立が深まる中、中国では内戦に勝った共産党が中華人民共和国を成立させた。","中華人民共和国の成立で東アジアでも東西対立が強まり、朝鮮半島では北朝鮮が韓国に侵攻して朝鮮戦争が始まった。"]},{"ev":["1945:GHQ","1950:朝鮮戦争","1951:サンフランシスコ平和条約"],"k":"l","tk":"e15","ti":"占領から独立回復へ","sum":"1945年からGHQのもとで日本の占領政策が進められた。1950年に朝鮮戦争が始まると、アメリカは日本を西側の一員として早く独立させようとした。そのため1951年にサンフランシスコ平和条約が結ばれ、日本は翌年独立を回復した。","tip":"占領が始まる→朝鮮戦争で冷戦が激しくなる→講和して独立、の順。","st":["GHQによる占領が続くなか、1950年に朝鮮戦争が始まり、アメリカは日本を西側陣営の一員として重視するようになった。","朝鮮戦争をきっかけにアメリカが講和を急ぎ、1951年に日本はサンフランシスコ平和条約を結んで、翌年に独立を回復した。"]},{"ev":["1945:国際連合","1956:日ソ共同宣言","1992:PKO協力法"],"k":"l","tk":"e16","ti":"日本と国際連合","sum":"1945年に国際連合が発足したが、日本はすぐには加盟できなかった。常任理事国のソ連が反対していたためで、1956年に日ソ共同宣言でソ連との国交を回復すると、同じ年に国連加盟が実現した。1992年にはPKO協力法により、国連の平和維持活動に自衛隊を派遣した。","tip":"国連発足→ソ連との国交回復で加盟→国連の活動に自衛隊が参加、の順。","st":["1945年に国際連合が発足したが、ソ連の反対で日本は加盟できなかった。1956年の日ソ共同宣言で国交を回復し、加盟が実現した。","日ソ共同宣言で国連加盟を果たした日本は、1992年にPKO協力法を成立させ、国連の平和維持活動に参加するようになった。"]},{"ev":["1946:日本国憲法","1951:日米安全保障条約","1960:安保闘争"],"k":"l","tk":"e15","ti":"平和主義と日米安保","sum":"平和主義をかかげる日本国憲法が公布された。冷戦が深まる中、1951年にサンフランシスコ平和条約と同時に日米安全保障条約が結ばれ、独立後もアメリカ軍が日本にとどまることになった。1960年の安保条約の改定に対しては、反対する安保闘争が起こった。","tip":"『憲法（1946）→安保条約（1951）→改定に反対する安保闘争（1960）』。","st":["平和主義をかかげる日本国憲法のもとで占領が続いたが、冷戦が深まると、日本はサンフランシスコ平和条約と同時に日米安全保障条約を結んだ。","日米安全保障条約の改定に対して、戦争に巻きこまれるとして反対する安保闘争が起こった。"]},{"ev":["1949:中華人民共和国","1972:日中共同声明","1978:日中平和友好条約"],"k":"g","tk":"f_asia","ti":"戦後の日本と中国","sum":"1949年、毛沢東を主席とする中華人民共和国が成立した。日本とは長く国交がなかったが、1972年に日中共同声明が発表されて国交が正常化した。さらに1978年には日中平和友好条約が結ばれ、両国の関係が深まった。","tip":"中国の成立→国交正常化（共同声明）→条約で友好を深める、の順。","st":["1949年に中華人民共和国が成立したが、日本とは国交がなかった。1972年の日中共同声明で、ようやく国交が正常化した。","日中共同声明で国交が正常化した6年後、1978年に日中平和友好条約が結ばれ、両国の関係がさらに深まった。"]},{"ev":["1950:朝鮮戦争","1951:サンフランシスコ平和条約","1956:日ソ共同宣言"],"k":"l","tk":"e15","ti":"独立の回復と国際社会への復帰","sum":"朝鮮戦争が起こると、アメリカは日本を西側の一員として早く独立させようとした。1951年、日本はサンフランシスコ平和条約を結び、翌年独立を回復した。条約に調印しなかったソ連とは日ソ共同宣言で国交を回復し、同じ年に国際連合に加盟した。","tip":"『朝鮮戦争→平和条約（独立回復）→日ソ共同宣言（国連加盟）』。","st":null},{"ev":["1950:警察予備隊","1954:自衛隊","1992:PKO協力法"],"k":"g","tk":"e15","ti":"自衛隊の成り立ちと海外派遣","sum":"朝鮮戦争が始まった1950年、GHQの指令で警察予備隊がつくられた。これが保安隊をへて1954年に自衛隊となった。冷戦が終わった後の1992年にはPKO協力法が成立し、自衛隊が国連の平和維持活動でカンボジアに派遣された。","tip":"警察予備隊（名前の始まり）→自衛隊→海外での活動（PKO）、の順。","st":["朝鮮戦争の際につくられた警察予備隊は、保安隊をへて1954年に自衛隊として発足した。","自衛隊は長く国内での任務が中心だったが、1992年のPKO協力法の成立で、国連平和維持活動のためカンボ function confusables(e,exclude){

    const sh=x.tags.filter(t=>e.tags.includes(t)).sort((a,b)=>(THEME_ERA.has(a)?1:0)-(THEME_ERA.has(b)?1:0)); if(sh.length){ sc+=3; why.push(`同じテーマ（${THEMES[sh[0]]}）`); }

    const needIn=neg?3:1, needOut=neg?1:3;

    const ins=shuffle(inside).slice(0,needIn), outs=shuffle(outside).slice(0,needOut);

    return {type:'exam',fmt:'period',
      stem:`年表中のＡの時期に起こったできごととして${neg?'<b class="neg">適切でないもの</b>':'適切なもの'}を、ア〜エから一つ選びなさい。`,
      table:tbl, labels:KANA.slice(0,4), options:opts.map(sent), ans,
      expl:`Ａの時期は${ySpan(a)}の「${esc(a.key)}」から${ySpan(b)}の「${esc(b.key)}」まで。答えは${KANA[ans]}（${ySpan(opts[ans])}${neg?'、Ａの時期ではない':''}）。`,

        tl:Object.assign([{e:a,label:a.key},{e:b,label:b.key},...opts.map((e,i)=>({e,label:KANA[i],hl:i===ans}))].sort((x,y)=>x.e.y-y.e.y),{band:[a.y,b.y]}),
        cards:[evCard(opts[ans],'答えのできごと')]

}
// 5) 同じころの世界
function exWorld(theme){

// 6) できごとの時代
function exEra(theme){
