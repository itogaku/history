<title>歴史ならべ道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{
  --paper:#F2F4F5; --surface:#FFFFFF; --surface2:#E8ECEF; --ink:#18212E; --muted:#5A6878; --line:#D3DAE1;
  --ai:#24476F; --ai-soft:#DCE6F1; --shu:#C04A33; --shu-soft:#F6E1DB;
  --ok:#2E7D4F; --ok-soft:#DDEFE3; --ng:#B3372B; --ng-soft:#F5DEDA;
  --e-kodai:#6E4F93; --e-chusei:#2F7457; --e-kinsei:#A2721C; --e-kindai:#A43F35; --e-gendai:#2A67A3; --e-world:#55606C;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11151B; --surface:#1A2029; --surface2:#232B36; --ink:#E4E9EF; --muted:#9AA7B6; --line:#313B48;
    --ai:#9DBDE3; --ai-soft:#22324A; --shu:#E8836C; --shu-soft:#3A2520;
    --ok:#6FC392; --ok-soft:#1C3326; --ng:#EE8A7E; --ng-soft:#3A2220;
    --e-kodai:#B597DA; --e-chusei:#72C39F; --e-kinsei:#DDB25E; --e-kindai:#E48A7F; --e-gendai:#7FB2E6; --e-world:#A4AFBB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151B; --surface:#1A2029; --surface2:#232B36; --ink:#E4E9EF; --muted:#9AA7B6; --line:#313B48;
  --ai:#9DBDE3; --ai-soft:#22324A; --shu:#E8836C; --shu-soft:#3A2520;
  --ok:#6FC392; --ok-soft:#1C3326; --ng:#EE8A7E; --ng-soft:#3A2220;
  --e-kodai:#B597DA; --e-chusei:#72C39F; --e-kinsei:#DDB25E; --e-kindai:#E48A7F; --e-gendai:#7FB2E6; --e-world:#A4AFBB;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand h1{font-family:var(--mincho);font-weight:900;font-size:30px;line-height:1.1;margin:0;letter-spacing:.04em}
.brand h1 span{color:var(--shu)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.score{display:flex;gap:14px;font-size:13px;color:var(--muted);align-items:baseline}
.score b{font-family:var(--mincho);font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;margin-inline:2px}

.panel{display:flex;flex-direction:column;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.tabs button{background:var(--surface);border:0;border-left:1.5px solid var(--ink);padding:10px 4px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tabs button:first-child{border-left:0}
.tabs button small{font-weight:400;font-size:11px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs button[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lab{font-size:12px;color:var(--muted);letter-spacing:.08em;min-width:4.5em}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{border-color:var(--c,var(--ai));background:color-mix(in srgb,var(--c,var(--ai)) 14%,var(--surface));font-weight:700}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip[aria-pressed="false"] .dot{opacity:.35}

.q{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qno{font-family:var(--mincho);font-weight:900;font-size:20px}
.tag{font-size:12px;padding:2px 10px;border-radius:4px;background:var(--ai-soft);color:var(--ai);font-weight:700}
.prompt{margin:0;font-weight:700}

.slots{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;align-items:center}
.slot{height:52px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mincho);font-weight:900;font-size:24px;background:var(--paper);position:relative}
.slot.filled{border-style:solid;border-color:var(--ai);background:var(--ai-soft);color:var(--ai)}
.slot .ord{position:absolute;top:2px;left:7px;font-family:var(--gothic);font-size:10px;font-weight:400;color:var(--muted)}
.slot.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.slot.ng{border-color:var(--ng);background:var(--ng-soft);color:var(--ng)}
.slots-arrow{display:none}

.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.card{width:100%;text-align:left;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.card:hover:not(:disabled){border-color:var(--ai)}
.card .kana{font-family:var(--mincho);font-weight:900;font-size:22px;text-align:center;border-right:1px solid var(--line);color:var(--ai)}
.card.used{opacity:.4}
.card:disabled{cursor:default}
.card b,.nen b{color:var(--ai)}
.card .meta{grid-column:2;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}

.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:6px;padding:8px 18px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.next{background:var(--shu);border-color:var(--shu);color:#fff}
.btn:disabled{opacity:.35;cursor:default}

.result{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.result.ok{background:var(--ok-soft)}
.result.ng{background:var(--ng-soft)}
.result.neutral{background:var(--surface2)}
.verdict{font-family:var(--mincho);font-weight:900;font-size:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.result.ok .verdict{color:var(--ok)} .result.ng .verdict{color:var(--ng)}
.verdict small{font-family:var(--gothic);font-weight:700;font-size:14px;color:var(--ink)}

.era{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:3px;color:#fff;background:var(--c);line-height:1.7;white-space:nowrap}
:root:not([data-theme="light"]) .era{color:var(--paper)}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .era{color:#fff} }
:root[data-theme="light"] .era{color:#fff}

/* 年表 */
.nenpyo{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.nen{display:grid;grid-template-columns:5.2em 1fr;gap:12px;padding:10px 4px;border-top:1px solid var(--line);align-items:baseline}
.nen:first-child{border-top:0}
.nen .y{font-family:var(--mincho);font-weight:700;font-size:18px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.nen .y small{font-size:11px;margin-left:1px}
.nen .t{display:flex;flex-direction:column;gap:2px}
.nen.target{background:var(--shu-soft);border-radius:4px}
.blank{display:inline-block;min-width:6em;border-bottom:2px solid var(--shu);color:var(--shu);font-weight:700;text-align:center;padding-inline:6px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-weight:700;text-align:left;display:flex;gap:10px;align-items:center}
.choice .k{font-family:var(--mincho);font-weight:900;color:var(--muted)}
.choice:hover:not(:disabled){border-color:var(--ai)}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.choice:disabled{cursor:default}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 200px;min-width:0;font:inherit;font-size:17px;padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}

/* ミニ年表 */
.tl{position:relative;height:84px;margin:4px 8px 0}
.tl .bar{position:absolute;left:0;right:0;top:42px;height:2px;background:var(--ink);opacity:.6}
.tl .pt{position:absolute;top:36px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.tl .pt i{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--ai)}
.tl .pt .lb{position:absolute;white-space:nowrap;font-size:12px;line-height:1.2;text-align:center}
.tl .pt .lb b{font-family:var(--mincho);font-size:15px;color:var(--ai)}
.tl .pt.up .lb{bottom:18px}
.tl .pt.dn .lb{top:18px}
.flow{display:flex;flex-direction:column;gap:0}
.flow-sum{margin:0 0 8px;font-size:14px;line-height:1.7;background:var(--surface);border-radius:6px;padding:8px 12px}
.fs-l,.why-l{display:inline-block;font-size:11px;font-weight:700;color:var(--paper);background:var(--ai);border-radius:3px;padding:0 6px;margin-right:6px;line-height:1.7;vertical-align:1px}
.why-l{background:var(--shu)}
.fl-item{display:grid;grid-template-columns:2em 5.6em 1fr;gap:8px;align-items:baseline;font-size:14px;padding:4px 0}
.fl-item .kana{font-family:var(--mincho);font-weight:900;color:var(--ai)}
.fl-item .y{font-family:var(--mincho);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.fl-step{display:grid;grid-template-columns:2em 1fr;gap:8px;font-size:13px;color:var(--muted);padding:2px 0 4px}
.fl-step .ar{justify-self:center;width:2px;background:var(--line);position:relative;min-height:22px}
.fl-step .ar::after{content:"";position:absolute;bottom:-2px;left:-4px;border:5px solid transparent;border-top-color:var(--line);border-bottom:0}
.fl-step.cause{color:var(--ink)}
.fl-step.cause .ar{background:var(--shu)}
.fl-step.cause .ar::after{border-top-color:var(--shu)}
.cand-open{padding-top:12px}
.cands-wrap{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:1.5px dashed var(--line)}
.cands-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cands-head h3{margin:0;font-family:var(--mincho);font-weight:900;font-size:19px}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.cand{text-align:left;display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.55}
.cand:hover{border-color:var(--ai)}
.cand.on{border-color:var(--ai);background:var(--ai-soft)}
.cand-top{display:flex;gap:6px;align-items:center}
.cand-no{font-family:var(--mincho);font-weight:900;font-size:16px;min-width:1.6em}
.cand-ck{margin-left:auto;font-size:12px;font-weight:700;color:var(--ai);white-space:nowrap}
.cand-items{display:flex;flex-direction:column;gap:2px}
.cand-items b{font-family:var(--mincho);margin-right:6px;color:var(--ai)}
.cand-ans{font-size:11.5px;color:var(--muted)}
.rkb{display:inline-block;font-size:10.5px;font-weight:900;border-radius:3px;padding:0 5px;margin-left:4px;line-height:1.6;border:1px solid currentColor}
.rkb.rkA{color:var(--shu)}.rkb.rkB{color:var(--ai)}.rkb.rkC{color:var(--muted)}
.chip.rk[aria-pressed="true"].rkA{border-color:var(--shu);background:var(--shu-soft)}
.imp{font-size:11px;font-weight:700;border-radius:3px;padding:0 7px;line-height:1.8;border:1px solid currentColor;white-space:nowrap}
.imp.impA{color:var(--shu)}.imp.impB{color:var(--ai)}.imp.impC{color:var(--muted)}
.canon-l{display:inline-block;font-size:11px;font-weight:700;color:var(--shu);border:1px solid var(--shu);border-radius:3px;padding:0 5px;margin-right:6px;line-height:1.6}
.banbtn{display:inline-block;margin-left:8px;font:inherit;font-size:11px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;padding:0 6px;cursor:pointer;vertical-align:1px}
.banbtn:hover{border-color:var(--ng);color:var(--ng)}
.obv{display:inline-block;margin-left:6px;font-size:11px;color:var(--ng)}
.why{display:block;font-size:8.5pt;color:#222;margin-top:1px}
.answer-list{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.answer-list li{display:grid;grid-template-columns:2em 5.6em 1fr;gap:8px;align-items:baseline;font-size:14px}
.answer-list .kana{font-family:var(--mincho);font-weight:900;color:var(--ai)}
.answer-list .y{font-family:var(--mincho);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

/* 記述 */
.kw-list{display:flex;flex-wrap:wrap;gap:6px}
.kw{font-size:13px;border:1.5px solid var(--line);border-radius:4px;padding:1px 10px;background:var(--surface)}
.kw.hit{border-color:var(--ok);color:var(--ok);font-weight:700}
.kw.miss{border-color:var(--ng);color:var(--ng)}
textarea{width:100%;min-height:110px;font:inherit;font-size:16px;line-height:1.8;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);resize:vertical;
  background-image:linear-gradient(transparent calc(1.8em - 1px),var(--line) 1px);background-size:100% 1.8em;background-position:0 10px;background-attachment:local}
.model{border-left:3px solid var(--ai);padding:4px 0 4px 12px}
.model .h{font-size:12px;color:var(--muted);letter-spacing:.08em}
.self{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.self button{width:44px;height:40px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--mincho);font-weight:900;font-size:20px}
.self button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.empty{color:var(--muted);text-align:center;padding:24px}
.foot{font-size:12px;color:var(--muted);text-align:center}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px}
/* 年表一覧 */
.sel,.search{font:inherit;font-size:14px;padding:5px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
.search{flex:1 1 160px;min-width:0}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.list-head h2{font-family:var(--mincho);font-weight:900;font-size:22px;margin:0}
.list-head .cnt{font-size:13px;color:var(--muted)}
.era-h{font-family:var(--mincho);font-weight:900;font-size:17px;margin:14px 0 0;padding:4px 0 4px 10px;border-left:5px solid var(--c);display:flex;gap:10px;align-items:baseline}
.era-h small{font-family:var(--gothic);font-weight:400;font-size:12px;color:var(--muted)}
.nen .ths{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.th{border:1px solid var(--line);background:transparent;border-radius:3px;font-size:11px;padding:0 6px;color:var(--muted);line-height:1.6}
.th:hover,.th[aria-pressed="true"]{border-color:var(--ai);color:var(--ai)}
.nen .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
mark{background:var(--shu-soft);color:inherit;padding:0 1px}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.nen.pick,.nen.es-row{grid-template-columns:5.2em 1fr auto}
.nen.ed-row{grid-template-columns:5.2em 1fr}
.rowbtns{display:flex;flex-direction:column;gap:6px;align-items:center;align-self:center}
.btn.sm{padding:3px 10px;font-size:12px;border-width:1px;white-space:nowrap}
.btn.danger{border-color:var(--ng);color:var(--ng)}
.badge{font-size:11px;font-weight:700;color:var(--shu);border:1px solid var(--shu);border-radius:3px;padding:0 6px;margin-left:6px;line-height:1.6}
.badge.del{color:var(--muted);border-color:var(--muted)}
.nen.gone .t{opacity:.55;text-decoration:line-through;text-decoration-color:var(--muted)}
.lk-list{display:flex;flex-direction:column;border-top:1.5px solid var(--ink)}
.lk-row{padding:10px 4px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.lk-pair{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.lk-ev{display:inline-flex;gap:6px;align-items:baseline}
.lk-ev.gone{opacity:.5;text-decoration:line-through}
.lk-y{font-family:var(--mincho);font-weight:700;font-variant-numeric:tabular-nums}
.lk-ar{color:var(--shu);font-weight:900}
.lk-t{font-size:13px;color:var(--muted);line-height:1.6}
.th.use{border-color:var(--ai);color:var(--ai)}
.alts{font-size:12px;color:var(--muted);margin-left:4px}
.es-a{font-size:13px;color:var(--muted)}
.editor{display:flex;flex-direction:column;gap:6px;min-width:0}
.editor label{font-size:12px;color:var(--muted)}
.editor textarea{min-height:0;background-image:none;font-size:15px;line-height:1.6}
.editor .search{font-size:15px;flex:none;width:100%}
.ed-err{margin:0;font-size:13px;color:var(--ng);min-height:1em}
.hist{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.hist-h{font-size:12px;color:var(--muted);letter-spacing:.06em}
.hv{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px}
.hv-at{display:block;font-size:11px;color:var(--muted)}
.backup{margin-top:18px;border-top:1.5px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.backup summary{cursor:pointer;font-weight:700;font-size:14px}
.backup[open]{gap:8px}
.backup textarea{min-height:0;background-image:none;font-size:12px;font-family:ui-monospace,monospace;margin-top:6px}
.optrows{display:flex;flex-direction:column;gap:10px}
.optrows .sel{flex:1 1 220px;min-width:0}
.note{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.hint-line{margin:0;font-size:12px;color:var(--muted)}
.warn{margin:0;font-size:13px;color:var(--shu)}
.nen.pick{grid-template-columns:5.2em 1fr 40px}
.nen.pick.on{background:var(--ai-soft);border-radius:4px}
.selbtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;align-self:center;color:var(--muted)}
.selbtn[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--paper)}
.selbar{position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.sb-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.sb-in .sb-n{margin-right:auto;font-size:13px}
.sb-in .sb-n b{font-family:var(--mincho);font-size:20px;margin-right:2px}
.sb-in .btn{border-color:var(--paper);background:transparent;color:var(--paper);padding:6px 12px;font-size:13px}
.sb-in .btn.primary{background:var(--paper);color:var(--ink)}
/* プリント設定 */
.pset{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1.5px dashed var(--line)}
.pset-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pset-row>label{font-size:12px;color:var(--muted);min-width:7em;letter-spacing:.05em}
.cust{display:flex;flex-wrap:wrap;gap:6px}
.x{border:0;background:none;color:var(--ng);font-weight:700;padding:0 2px}
/* 用紙（テーマに関係なく白い紙に黒） */
#sheets{display:flex;flex-direction:column;gap:18px;overflow-x:auto}
.sheet{background:#fff;color:#111;border:1px solid #cfd5db;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:12mm 12mm 14mm;width:100%;max-width:210mm;margin:0 auto;font-size:10.5pt;line-height:1.6;font-family:var(--gothic)}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px;flex-wrap:wrap}
.sh-title{font-family:var(--mincho);font-weight:900;font-size:17pt;line-height:1.2}
.sh-sub{font-size:11pt;margin-left:10px;border:1.5px solid #111;padding:0 8px;vertical-align:middle}
.sh-meta{font-size:8.5pt;color:#444;margin-top:2px}
.sh-name{border-collapse:collapse;font-size:8.5pt}
.sh-name td{border:1px solid #111;padding:2px 6px;height:9mm;vertical-align:top;min-width:12mm}
.sh-name td.nm{min-width:42mm}
.sh-name td.pt{vertical-align:bottom;text-align:right;min-width:18mm}
.dai{margin-top:10px;break-inside:auto}
.dai h4{margin:0 0 6px;font-size:10.5pt;display:flex;gap:8px;align-items:baseline}
.dai h4 .dn{background:#111;color:#fff;font-family:var(--mincho);padding:0 7px;flex:none}
.sq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.sq>li{display:grid;grid-template-columns:2.4em 1fr;break-inside:avoid}
.opts{list-style:none;margin:0;padding:0}
.opts li{display:grid;grid-template-columns:1.6em 1fr;font-size:9.5pt;line-height:1.5}
.opts li span{font-family:var(--mincho);font-weight:700}
.ansline{margin-top:3px;font-size:10pt;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.box{display:inline-block;width:9mm;height:7mm;border:1px solid #111;vertical-align:middle}
.snen{width:100%;border-collapse:collapse;font-size:9.5pt}
.snen td{border:1px solid #111;padding:3px 6px;vertical-align:top}
.snen td.y{width:22mm;text-align:right;font-family:var(--mincho);font-weight:700;white-space:nowrap}
.sblank{display:inline-block;min-width:24mm;border-bottom:1px solid #111;text-align:center;font-weight:700}
.bank{margin-top:6px;border:1px solid #111;padding:4px 8px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:9.5pt}
.bank .bl{font-weight:700;border-right:1px solid #111;padding-right:10px}
.agrid{margin-top:6px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #111;border-left:1px solid #111}
.agrid>div{border-right:1px solid #111;border-bottom:1px solid #111;min-height:9mm;padding:2px 6px;font-size:9.5pt}
.agrid>div span{font-weight:700;margin-right:6px}
.agrid.ans>div{min-height:0}
.sess{break-inside:avoid;margin-bottom:6px}
.sess p{margin:0 0 3px}
.skw{display:block;font-size:8.5pt;color:#333}
.lines{height:24mm;border:1px solid #111;background-image:linear-gradient(transparent calc(8mm - 1px),#999 1px);background-size:100% 8mm}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:9.5pt}
.alist .ay{display:block;font-size:8.5pt;color:#444}
.qtools{float:right;display:inline-flex;gap:4px;margin-left:8px}
.tbtn{font:inherit;font-size:11px;border:1px solid #9aa5b1;background:#f3f6f9;color:#24476F;border-radius:4px;padding:1px 8px;cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:#24476F;background:#e3ebf4}
.tbtn.del{color:#B3372B;border-color:#d9a9a3;background:#fbf1ef}
.addrow{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.addrow.top{justify-content:flex-end;margin:0 0 4px}
.snen td.rowtool{width:1%;white-space:nowrap;border:0;padding-left:6px;vertical-align:middle}
.sq>li:hover,.sess:hover{background:#f7f9fb}
.xtbl{overflow-x:auto}
.xnen{border-collapse:collapse;width:100%;font-size:14px}
.xnen td{border:1px solid var(--line);padding:4px 8px;vertical-align:top}
.xnen td.y{width:6.5em;text-align:right;font-family:var(--mincho);font-weight:700;white-space:nowrap}
.xnen tr.gap td{border-top:0;border-bottom:0;padding:1px 8px}
.gapno{display:inline-block;min-width:2em;text-align:center;border:1.5px solid var(--ink);font-weight:700;font-size:12px;line-height:1.5;margin-left:1.5em}
.gapno.wide{min-width:3em}
.xbox .sblank{display:inline-block;min-width:4.5em;border-bottom:1.5px solid currentColor;text-align:center;font-weight:700;margin:0 3px;line-height:1.3}
.xbox{border:1.5px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.tfl{display:grid;grid-template-columns:1.6em 1fr;gap:4px}
.tfl>span:first-child{font-family:var(--mincho);font-weight:900}
.choices.short{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
b.neg{text-decoration:underline;text-underline-offset:3px}
.sheet .xnen{font-size:9.5pt}.sheet .xnen td{border-color:#111;padding:2px 6px}
.sheet .gapno{border-color:#111}
.sheet .xbox{border:1px solid #111;border-radius:0;background:#fff;padding:4px 8px;font-size:9.5pt;margin:3px 0}
.sx{break-inside:avoid;margin-bottom:8px}.sx p{margin:0 0 3px}
.xopts{display:grid;grid-template-columns:1fr 1fr;gap:1px 12px;font-size:9.5pt;margin-top:3px}
.xopts.short{grid-template-columns:repeat(6,auto);justify-content:start}
.xmain{font-weight:700;line-height:1.7}
.xsec{display:flex;flex-direction:column;gap:6px}
.xh{font-size:12px;font-weight:700;color:var(--ai);letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:2px}
.xol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.6}
.xhint{margin:0;font-size:14px;line-height:1.7}
.xcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.xcard{background:var(--surface);border-radius:6px;padding:8px 12px;font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:4px}
.xct{font-size:11px;color:var(--muted);letter-spacing:.06em}
.xcl{display:flex;gap:8px;align-items:baseline}
.xy{font-family:var(--mincho);font-weight:900;font-size:17px}
.xp{font-size:12px;color:var(--muted)}
.xlink{font-size:13px;color:var(--ink);display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:baseline}
.xlink span{font-size:10.5px;font-weight:700;color:var(--paper);border-radius:3px;padding:0 5px;background:var(--ai)}
.xlink.out span{background:var(--shu)}
.xtl{height:92px;margin-top:6px}
.xtl .pt.hl i{border-color:var(--shu);background:var(--shu)}
.xtl .pt.hl .lb b{color:var(--shu)}
.xtl .pt .lb b{font-family:var(--gothic);font-size:11px}
.xband{position:absolute;top:38px;height:10px;background:color-mix(in srgb,var(--shu) 22%,transparent);border-radius:3px}
.xband span{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--shu)}
@page{size:A4 portrait;margin:10mm}
@media print{
  :root{padding:0!important}
  body{background:#fff!important;padding:0!important}
  header,.panel,.foot,.pset,.selbar,.qtools,.addrow,.rowtool,.tbtn{display:none!important}
  .wrap{max-width:none;display:block}
  .q{border:0;padding:0;background:#fff;animation:none}
  #sheets{display:block;overflow:visible}
  .sheet{border:0;box-shadow:none;padding:0;max-width:none;break-after:page}
  .sheet:last-child{break-after:auto}
  .dai h4 .dn,.lines{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:620px){
  .tabs button small{display:none}
  .tabs button{font-size:13px;padding:10px 2px}
  .sheet{padding:16px 14px;font-size:9.5pt}
}
@media (max-width:520px){
  .brand h1{font-size:25px}
  .choices{grid-template-columns:1fr}
  .q{padding:16px 14px 18px}
  .nen{grid-template-columns:4.4em 1fr;gap:8px}
  .nen .y{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){
  .q{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}

function hash(s){let h=5381;for(const c of s)h=((h*33)^c.codePointAt(0))>>>0;return h.toString(36)}
const ORIG_E=E.map(e=>({text:e.text,alts:e.alts.slice()}));
const ORIG_S=ESSAY.map(e=>({q:e.q,a:e.a,kw:e.kw.map(k=>k.slice()),use:(e.use||[]).slice()}));
E.forEach(e=>{e.sid='ev-'+(e.y<0?'m'+(-e.y):e.y)+'-'+hash(e.text)});
ESSAY.forEach(e=>{e.sid='es-'+e.y+'-'+hash(e.q)});
const ITEM={}; E.forEach((e,i)=>ITEM[e.sid]={kind:'ev',i}); ESSAY.forEach((e,i)=>ITEM[e.sid]={kind:'es',i});
let EDITS={};
const clone=o=>JSON.parse(JSON.stringify(o));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function origOf(sid){const t=ITEM[sid];return t.kind==='ev'?ORIG_E[t.i]:ORIG_S[t.i]}
function itemOf(sid){const t=ITEM[sid];return t.kind==='ev'?E[t.i]:ESSAY[t.i]}
function applyEdits(){
  E.forEach((e,i)=>{const o=EDITS[e.sid]; const c=o&&o.cur; const b=c||ORIG_E[i];
    e.text=b.text; e.alts=b.alts.slice(); e.key=e.alts[0]; e.rank=(o&&o.rank)||e.rank0; e.deleted=!!(o&&o.deleted); e.edited=!!c;});
  ESSAY.forEach((e,i)=>{const o=EDITS[e.sid]; const c=o&&o.cur; const b=c||ORIG_S[i];
    e.q=b.q; e.a=b.a; e.kw=b.kw.map(k=>k.slice()); e.use=(b.use||ORIG_S[i].use||[]).slice(); e.deleted=!!(o&&o.deleted); e.edited=!!c;});
}
const Store={mode:'local', db:null, canEdit:true, busy:false,
  loadLocal(){
    try{ const raw=localStorage.getItem('rk-edits'); if(raw){ const m=JSON.parse(raw); for(const k in m) if(ITEM[k]) EDITS[k]=m[k]; } }catch(e){}
    applyEdits();
  },
  async put(sid,body){
    EDITS[sid]=body; applyEdits();
    if(this.mode==='db'){
      try{ await this.db.doc('edits/'+sid).set(body); }
      catch(e){
        if(e&&e.code==='invalid_argument'){ this.canEdit=false; S.flash='このページを編集する権限がありません。'; }
        else if(e&&e.code==='unavailable'){ try{ await new Promise(r=>setTimeout(r,600+Math.random()*600)); await this.db.doc('edits/'+sid).set(body); return true; }catch(e2){ S.flash='保存できませんでした。時間をおいてもう一度試してください。'; } }
        else S.flash='保存できませんでした。時間をおいてもう一度試してください。';
        return false;
      }
    }else{
      try{ localStorage.setItem('rk-edits',JSON.stringify(EDITS)); }catch(e){ S.flash='このブラウザでは保存できませんでした。'; return false; }
    }
    return true;
  }
};
function refreshAfterEdit(){
  if(S.editing) return;
  if(S.mode==='list') renderList();
  else if(S.mode==='print'&&!S.sheet) newQuestion();
}
function baseRec(sid){ return EDITS[sid]?clone(EDITS[sid]):{kind:ITEM[sid].kind,deleted:false,cur:null,history:[]}; }
async function saveVersion(sid,v){
  const o=baseRec(sid);
  if(same(v,origOf(sid))) v=null;
  if(same(v,o.cur)) return true;
  o.history=[{at:Date.now(),v:o.cur},...(o.history||[])].slice(0,15);
  o.cur=v; o.updatedAt=Date.now();
  return Store.put(sid,o);
}
async function setDeleted(sid,flag){ const o=baseRec(sid); o.deleted=flag; o.updatedAt=Date.now(); return Store.put(sid,o); }

function readEditor(sid){
  const kind=ITEM[sid].kind; const err=m=>({err:m});
  if(kind==='ev'){
    const text=$('#edText').value.trim(); const alts=$('#edKey').value.split(/[／\/|｜]/).map(s=>s.trim()).filter(Boolean);
    const n=(text.match(/〔〕/g)||[]).length;
    if(n!==1) return err('文の中に、答えが入る場所を「〔〕」で1か所だけ入れてください。');
    if(!alts.length) return err('答えを入力してください。');
    return {v:{text,alts}};
  }
  const q=$('#edQ').value.trim(), a=$('#edA').value.trim();
  const kw=$('#edKw').value.split(/[、,，]/).map(g=>g.split(/[／\/|｜]/).map(s=>s.trim()).filter(Boolean)).filter(g=>g.length);
  if(!q) return err('問題文を入力してください。'); if(!a) return err('解答例を入力してください。'); if(!kw.length) return err('採点キーワードを1つ以上入力してください。');
  const use=$('#edUse').value.split(/[、,，・]/).map(x=>x.trim()).filter(Boolean);
  return {v:{q,a,kw,use}};
}
const fmtAt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function editorHTML(sid){
  const kind=ITEM[sid].kind, it=itemOf(sid), rec=EDITS[sid], orig=origOf(sid);
  let h=`<div class="editor" data-editor="${sid}">`;
  if(kind==='ev'){
    h+=`<label for="edText">文（答えが入る場所を〔〕で示す）</label><textarea id="edText" rows="3">${esc(it.text)}</textarea>
        <label for="edKey">答え（別の書き方も正解にするときは ／ で区切る）</label><input id="edKey" class="search" value="${esc(it.alts.join('／'))}">
        <label>重要度（A：重要　B：標準　C：発展）</label><div class="row">${['A','B','C'].map(k=>`<button class="chip rk rk${k}" data-edrank="${k}" aria-pressed="${(S.edRank||it.rank)===k}">${k}</button>`).join('')}${it.rank!==it.rank0?`<span class="hint-line">（最初は${it.rank0}）</span>`:''}</div>`;
  }else{
    h+=`<label for="edQ">問題文</label><textarea id="edQ" rows="2">${esc(it.q)}</textarea>
        <label for="edA">解答例</label><textarea id="edA" rows="3">${esc(it.a)}</textarea>
        <label for="edUse">指定語句（問題に表示する。答えそのものにならない語を1〜2個）</label><input id="edUse" class="search" value="${esc((it.use||[]).join('、'))}">
        <label for="edKw">採点キーワード（、で区切る。同じ意味の別の語は ／ でつなぐ）</label><input id="edKw" class="search" value="${esc(it.kw.map(k=>k.join('／')).join('、'))}">`;
  }
  h+=`<p class="ed-err" id="edErr" role="alert"></p>
    <div class="actions"><button class="btn danger" data-act="eddel">この問題を消す</button><button class="btn" data-act="edcancel">閉じる</button><button class="btn primary" data-act="edsave">保存する</button></div>`;
  const hist=(rec&&rec.history)||[];
  if(rec&&rec.cur||hist.length){
    h+=`<div class="hist"><div class="hist-h">以前の文章</div>`;
    if(rec&&rec.cur) h+=`<div class="hv"><span class="hv-t"><span class="hv-at">最初の文章</span>${esc(verText(kind,orig))}</span><button class="btn sm" data-restore="orig">この文章にもどす</button></div>`;
    hist.forEach((x,i)=>{ if(x.v&&!same(x.v,rec.cur)) h+=`<div class="hv"><span class="hv-t"><span class="hv-at">${fmtAt(x.at)}まで</span>${esc(verText(kind,x.v))}</span><button class="btn sm" data-restore="${i}">この文章にもどす</button></div>`; });
    h+=`</div>`;
  }
  return h+`</div>`;
}
function verText(kind,v){ return kind==='ev'?v.text.replace('〔〕','〔'+v.alts[0]+'〕'):v.q+' → '+v.a; }
function editStats(){ let ed=0,del=0; for(const k in EDITS){ if(EDITS[k].deleted) del++; else if(EDITS[k].cur) ed++; } return {ed,del}; }
function backupHTML(){
  const st=editStats();
  return `<details class="backup"><summary>編集データの保存先・バックアップ</summary>
    <p class="hint-line">保存先：${Store.mode==='db'?'このサイト（このページを開けるほかの人にも反映されます）':'このブラウザ（ほかの端末やブラウザには反映されません）'}。変更 ${st.ed}件・削除 ${st.del}件。</p>

  </details>`;
}

  for(let i=0;i<s.length-1;i++){ const a=s[i], b=s[i+1]; const c=canonPair(a,b), l=LINKMAP[a.sid+'>'+b.sid]; if(c) canon++; if(c||l) rel++; }

function pickChain(list,n,avoid){
  const ids=new Set(list.map(e=>e.sid)); const next={};
  for(const k in LINKMAP){ const [a,b]=k.split('>'); if(ids.has(a)&&ids.has(b)) (next[a]=next[a]||[]).push(b); }
  const starts=shuffle(Object.keys(next)); if(!starts.length) return null;
  const bySid=Object.fromEntries(list.map(e=>[e.sid,e]));
  let best=null;
  for(const st of starts.slice(0,12)){
    const chain=[bySid[st]];
    while(chain.length<n){
      const c=(next[chain[chain.length-1].sid]||[]).map(x=>bySid[x]).filter(e=>chain.every(o=>o.y!==e.y));
      if(!c.length) break; chain.push(rand(c));
    }
    if(!best||chain.length>best.length) best=chain;
    if(best.length>=n) break;
  }
  if(!best||best.length<2) return null;
  const rest=shuffle(list.filter(e=>!best.includes(e)&&best.every(o=>Math.abs(o.y-e.y)>=1)&&!(avoid&&avoid.has(e.id))));
  const out=best.slice();
  for(const e of rest){ if(out.length>=n) break; if(out.every(o=>o.y!==e.y)) out.push(e); }
  return out.length>=n?out:null;
}

function pickSpread(list,n,avoid){
  if(S.omode==='prefer'&&Math.random()<0.7){ const c=pickChain(list,n,avoid); if(c) return c; }
  const fresh=avoid?list.filter(e=>!avoid.has(e.id)):list;

}

function strictChains(list,n){
  const ids=new Set(list.map(e=>e.sid)); const bySid=Object.fromEntries(list.map(e=>[e.sid,e])); const next={};
  for(const k in LINKMAP){ const [a,b]=k.split('>'); if(ids.has(a)&&ids.has(b)&&bySid[a].y<bySid[b].y) (next[a]=next[a]||[]).push(b); }

// まぎらわしい語句（誤りの選択肢）を、ランダムではなく「似ている度合い」で選ぶ
const perK=e=>({'戦国':'室町','昭和前':'昭和'}[e.per]||e.per);
function confusables(e,exclude){
  const ex=new Set([...(exclude||[]),...e.alts]);

  const seen=new Set(); const out=[];
  for(const x of E){

    const k2=x.key.replace(/[（）()「」]/g,''); const d=Math.abs(x.y-e.y);
    let sc=0; const why=[];

    else if(k2.slice(-1)===t1){ sc+=4; why.push(`同じ「${t1}」`); }
    const sh=x.tags.filter(t=>e.tags.includes(t)).sort((a,b)=>(['bunka','rel'].includes(a)?1:0)-(['bunka','rel'].includes(b)?1:0)); if(sh.length){ sc+=3; why.push(`同じテーマ（${THEMES[sh[0]]}）`); }
    if(perK(x)===perK(e)){ sc+=2; why.push(`同じ${perK(e)}時代`); }
    sc+= d<=30?3:d<=100?2:d<=300?1:-3;

    if(x.world===e.world) sc+=1;

}

  const target=rand(tc);

  const neg=Math.random()<0.5;
  for(let t=0;t<40;t++){
    const two=pickSpread(t<25&&T.length>=4?T:P,2); if(!two) return null; two.sort((a,b)=>a.y-b.y);
    const [a,b]=two; if(b.y-a.y<15||b.y-a.y>250) continue;
    const inside=P.filter(e=>e.y>a.y&&e.y<b.y&&e!==a&&e!==b&&!e.lab);
    const span=b.y-a.y;
    const outside=P.filter(e=>(e.y<a.y-2||e.y>b.y+2)&&Math.abs((e.y<a.y?a.y:b.y)-e.y)<=Math.max(150,span)&&!e.lab);
    const needIn=neg?3:1, needOut=neg?1:3;
    if(inside.length<needIn||outside.length<needOut) continue;
    const ins=shuffle(inside).slice(0,needIn), outs=shuffle(outside).slice(0,needOut);
    const opts=shuffle([...ins,...outs]);
    const ans=opts.findIndex(e=>neg?outs.includes(e):ins.includes(e));
    const tbl=`<table class="xnen"><tbody><tr><td class="y">${ySpan(a)}</td><td>${sent(a)}</td></tr><tr class="gap"><td></td><td><span class="gapno wide">Ａ</span></td></tr><tr><td class="y">${ySpan(b)}</td><td>${sent(b)}</td></tr></tbody></table>`;
    return {type:'exam',fmt:'period',
      stem:`年表中のＡの時期に起こったできごととして${neg?'<b class="neg">適切でないもの</b>':'適切なもの'}を、ア〜エから一つ選びなさい。`,
      table:tbl, labels:KANA.slice(0,4), options:opts.map(sent), ans,
      expl:`Ａの時期は${ySpan(a)}の「${esc(a.key)}」から${ySpan(b)}の「${esc(b.key)}」まで。答えは${KANA[ans]}（${ySpan(opts[ans])}${neg?'、Ａの時期ではない':''}）。`,
      det:{
        opts:opts.map((e,i)=>{ const inA=e.y>a.y&&e.y<b.y; return `${KANA[i]}：${ySpan(e)}（${perName(e)}）…${inA?'Ａの時期にあたる':e.y<a.y?`Ａより前（${esc(a.key)}より${a.y-e.y}年前）`:`Ａよりあと（${esc(b.key)}より${e.y-b.y}年あと）`}。${sentB(e)}`; }),
        tl:Object.assign([{e:a,label:a.key},{e:b,label:b.key},...opts.map((e,i)=>({e,label:KANA[i],hl:i===ans}))].sort((x,y)=>x.e.y-y.e.y),{band:[a.y,b.y]}),
        cards:[evCard(opts[ans],'答えのできごと')]
      }};
  }
  return null;
}
// 5) 同じころの世界
function exWorld(theme){
  const W=E.filter(e=>e.world&&!e.deleted&&!e.lab);
  let J=examPool(theme).filter(e=>!e.world); if(!J.length) J=pool().filter(e=>!e.world);
  for(const j of shuffle(J).slice(0,30)){
    const near=W.filter(w=>Math.abs(w.y-j.y)<=30);
    const far=W.filter(w=>Math.abs(w.y-j.y)>=120);
    if(!near.length||far.length<3) continue;
    const c=rand(near); const ds=[]; for(const w of shuffle(far)){ if(ds.every(d=>Math.abs(d.y-w.y)>=40)) ds.push(w); if(ds.length===3) break; }
    if(ds.length<3) continue;
    const opts=shuffle([c,...ds]);
    return {type:'exam',fmt:'world',
      stem:'次の日本のできごとと同じころ、世界で起こったできごととして適切なものを、ア〜エから一つ選びなさい。',
      box:sent(j), labels:KANA.slice(0,4), options:opts.map(sent), ans:opts.indexOf(c),
      expl:`日本のできごとは${ySpan(j)}（${perName(j)}）。同じころの世界のできごとは${KANA[opts.indexOf(c)]}（${ySpan(c)}）。`,
      det:{
        opts:opts.map((e,i)=>{ const d=e.y-j.y; return `${KANA[i]}：${ySpan(e)}…日本のできごとの${d===0?'同じ年':Math.abs(d)+'年'+(d<0?'前':'あと')}。${sentB(e)}`; }),
        tl:[{e:j,label:'日本',hl:true},...opts.map((e,i)=>({e,label:KANA[i]}))].sort((x,y)=>x.e.y-y.e.y),
        cards:[evCard(j,'日本のできごと'),evCard(c,'同じころの世界')]
      }};
  }
  return null;
}
// 6) できごとの時代
function exEra(theme){
  let J=examPool(theme).filter(e=>!e.world); if(!J.length) J=pool().filter(e=>!e.world);
  const e=rand(J); const p=perOf(e); const i=PERIOD_ORDER.indexOf(p); if(i<0) return null;
  const near=PERIOD_ORDER.filter((x,k)=>x!==p&&Math.abs(k-i)<=3);
  const opts=[p,...shuffle(near).slice(0,3)].sort((a,b)=>PERIOD_ORDER.indexOf(a)-PERIOD_ORDER.indexOf(b));
  return {type:'exam',fmt:'era',
    stem:'次のできごとが起こった時代として適切なものを、ア〜エから一つ選びなさい。',
    box:sent(e), labels:KANA.slice(0,4), options:opts.map(x=>x+'時代'), ans:opts.indexOf(p),
    expl:`${ySpan(e)}、${p}時代のできごと。`,
    det:{
      opts:opts.map((x,k)=>`${KANA[k]}：${x}時代（${PERIOD_RANGE[x]||''}）${x===p?'　← この時代':''}`),
      cards:[evCard(e,'問われたできごと')],
      hint:(()=>{ const same=shuffle(pool().filter(o=>o!==e&&!o.world&&perOf(o)===p)).slice(0,3).sort((a,b)=>a.y-b.y); return same.length?`同じ${p}時代のできごと：`+same.map(o=>`${ySpan(o)} ${esc(o.key)}`).join('／'):''; })()
    }};
}
const EXAM_GEN={interval:exInterval,tf:exTF,combo:exCombo,period:exPeriod,world:exWorld,era:exEra};
function makeExam(fmt,theme){
  if(!Object.keys(LINK_IN).length&&!Object.keys(LINK_OUT).length) buildLinkIndex();
  const fmts=fmt==='rand'?shuffle(Object.keys(EXAM_GEN).filter(f=>f!=='world'||S.world)):[fmt];
  for(const f of fmts){ for(let t=0;t<3;t++){ const q=EXAM_GEN[f](theme); if(q){ q.theme=EXAM_FMTS[f]; return q; } } }

}

function renderExam(c){

function essayPool(theme){
  let P=ESSAY.filter(e=>!e.deleted&&S.eras.has(e.era));

function genEssay(){

const correctOrder=items=>items.map((e,i)=>i).sort((a,b)=>items[a].y-items[b].y||a-b);
// 同じ年のできごとは、どちらが先でも正解

function flowHTML(evs,labels,tk){
  const steps=flowSteps(evs);
  let h='<div class="flow">';
  if(tk&&FLOW[tk]) h+=`<p class="flow-sum"><span class="fs-l">流れ</span>${esc(FLOW[tk])}</p>`;
  evs.forEach((e,k)=>{
    h+=`<div class="fl-item"><span class="kana">${labels[k]}</span><span class="y">${yv(e)}${yu(e)}</span><span>${eraTag(e)}${rankTag(e)} ${filled(e)}</span></div>`;
    if(k<steps.length){ const s=steps[k]; const nx=evs[k+1]; const bk=pairKey(e,nx); const ob=obviousPair(e,nx);
      h+=`<div class="fl-step ${s.kind}"><span class="ar" aria-hidden="true"></span><span>${s.kind==='cause'?'<span class="why-l">つながり</span>':''}${canonPair(e,nx)?`<span class="canon-l">定番：${esc(canonPair(e,nx))}</span>`:''}${esc(s.t)}${ob&&!BAN.has(bk)?`<span class="obv">あからさま：${esc(ob)}</span>`:''}<button class="banbtn" data-ban="${e.sid}~${nx.sid}">${BAN.has(bk)?'一緒に出さない（登録ずみ・取り消す）':'この2つを一緒に出さない'}</button></span></div>`; }
  });
  return h+'</div>';
}
function timeline(sorted){
  const ys=sorted.map(s=>s.e.y); const lo=Math.min(...ys), hi=Math.max(...ys); const span=Math.max(hi-lo,1);
  return `<div class="tl" aria-hidden="true"><div class="bar"></div>`+sorted.map(({e,i},k)=>{
    const x=6+88*(e.y-lo)/span;
    return `<div class="pt ${k%2?'dn':'up'}" style="left:${x}%"><i></i><span class="lb"><b>${KANA[i]}</b><br>${yv(e)}</span></div>`;
  }).join('')+`</div>`;
}

function renderEssay(c){

  let h=`<p class="prompt">${esc(q.q)}</p>`;

  h+=`<textarea id="essayIn" aria-label="解答欄" placeholder="ここに答えを書く" ${S.answered?'readonly':''}>${esc(c.text||'')}</textarea>`;
  if(!S.answered){
    h+=`<div class="actions"><button class="btn primary" data-act="judge">答え合わせ</button></div>`;
  }else{
    const t=norm(c.text||'');
    const res=q.kw.map(k=>({w:k[0],hit:k.some(a=>t.includes(norm(a)))}));
    const hits=res.filter(r=>r.hit).length;
    const useRes=S.hint?(q.use||[]).map(w=>({w,hit:t.includes(norm(w))})):[];
    h+=`<div class="result neutral">
      <div class="verdict" style="font-size:18px">キーワード ${hits} / ${res.length}</div>
      <div class="kw-list"><span style="font-size:12px;color:var(--muted)">採点キーワード</span>${res.map(r=>`<span class="kw ${r.hit?'hit':'miss'}">${r.hit?'○':'×'} ${esc(r.w)}</span>`).join('')}</div>
      ${useRes.length?`<div class="kw-list"><span style="font-size:12px;color:var(--muted)">指定語句を使ったか</span>${useRes.map(r=>`<span class="kw ${r.hit?'hit':'miss'}">${r.hit?'○':'×'} ${esc(r.w)}</span>`).join('')}</div>`:''}

  }

function buildSheet(){
  const pr=S.pr; const used=new Set(); const sheet={orders:[],fill:null,essays:[],note:[]};
  for(const ids of S.custom){ const items=shuffle(ids.map(byId).filter(e=>!e.deleted)); sheet.orders.push({theme:'えらんだできごと',custom:ids,items}); items.forEach(e=>used.add(e.id)); }
  const keepLast=S.lastTheme; S.lastTheme=null;
  for(let i=0;i<pr.order;i++){
    S.avoidThemes=sheet.orders.map(o=>o.tk).filter(Boolean);
    let q=makeOrder(S.theme,pr.orderN,used); if(!q){ S.avoidThemes=[]; q=makeOrder(S.theme,pr.orderN,used); }
    if(!q) {sheet.note.push('並び替え問題を指定の数だけ作れませんでした。');break;}
    q.items.forEach(e=>used.add(e.id)); sheet.orders.push({theme:q.theme,tk:q.tk,items:q.items});
  }
  S.lastTheme=keepLast; S.avoidThemes=[];
  if(pr.fill>0){ sheet.fill=makeFill(pr.fill); if(!sheet.fill) sheet.note.push('年表の穴埋めを作れるだけのできごとがありません。'); }
  sheet.exams=[]; for(let i=0;i<pr.exam;i++){ const q=makeExam('rand',S.theme); if(q) sheet.exams.push(q); }
  const EP=shuffle(essayPool(S.theme)); sheet.essays=EP.slice(0,pr.essay);
  if(pr.essay>EP.length) sheet.note.push(`記述問題は${EP.length}問だけ入れました（この条件の問題が${EP.length}問しかありません）。`);
  S.sheet=sheet;
}

function makeFill(n,tkFixed){
  const P=pool(); let t=tkFixed||S.theme;
  if(t==='auto'){ const c=Object.keys(THEMES).filter(k=>P.filter(e=>e.tags.includes(k)).length>=Math.min(n,6)); t=c.length?rand(c):'mix'; }
  const L = t==='mix'?P:P.filter(e=>e.tags.includes(t));
  const keys=new Set(); const rows=[];
  for(const e of shuffle(L)){ if(!keys.has(e.key)){keys.add(e.key);rows.push(e);} if(rows.length===n)break; }
  if(rows.length<2) return null;
  const f={theme:t==='mix'?'時代をまたいで':THEMES[t],tk:t,rows};
  sortFill(f); return f;
}
function sortFill(f){
  f.rows.sort((a,b)=>a.y-b.y||a.id-b.id);
  const keys=new Set(f.rows.map(r=>r.key));
  // 各行について一番まぎらわしい語句を求め、点数の高いものから語群に加える
  const cands=[]; f.rows.forEach(r=>{ const c=confusables(r,keys)[0]; if(c) cands.push({...c,forKey:r.key}); });
  cands.sort((a,b)=>b.sc-a.sc||a.d-b.d);
  const n=Math.min(4,Math.max(2,Math.ceil(f.rows.length/3))); const used=new Set(); f.extra=[];
  for(const c of cands){ if(used.has(c.key)) continue; used.add(c.key); f.extra.push(c); if(f.extra.length>=n) break; }
  f.bank=[...keys,...f.extra.map(c=>c.key)].sort((a,b)=>a.localeCompare(b,'ja'));
}
function sheetUsed(except){ const u=new Set(); S.sheet.orders.forEach(o=>{ if(o!==except) o.items.forEach(e=>u.add(e.id)); }); return u; }
// 個別の問題の差し替え・削除
function reOrder(i){
  const o=S.sheet.orders[i];
  if(o.custom){ let it; do{ it=shuffle(o.items); }while(o.items.length>2&&it.every((e,k)=>e===o.items[k])); o.items=it; return true; }
  const keep=S.lastTheme; S.lastTheme=o.tk||null;
  const allUsed=new Set(); S.sheet.orders.forEach(x=>x.items.forEach(e=>allUsed.add(e.id)));
  const others=S.sheet.orders.filter(x=>x!==o).map(x=>x.tk).filter(Boolean);
  const nn=S.pr.orderN==='r'?'r':o.items.length;
  let q=null;
  // 1) 今の問題とほかの問題のできごとをすべて除き、まだ使っていないテーマから
  S.exclude=allUsed; S.avoidThemes=[o.tk,...others].filter(Boolean);
  for(let t=0;t<6&&!q;t++) q=makeOrder(S.theme,nn,allUsed);
  // 2) テーマの制限をゆるめる（できごとの重なりは許さない）
  if(!q){ S.avoidThemes=[o.tk].filter(Boolean); for(let t=0;t<6&&!q;t++) q=makeOrder(S.theme,nn,allUsed); }
  // 3) 今の問題のできごとだけは必ず除く
  if(!q){ S.exclude=new Set(o.items.map(e=>e.id)); S.avoidThemes=[]; for(let t=0;t<6&&!q;t++) q=makeOrder(S.theme,nn,allUsed); }
  S.exclude=null; S.avoidThemes=[]; S.lastTheme=keep;
  if(!q){ S.sheet.note=['この問題と入れ替えられる別の組み合わせが見つかりませんでした。']; return false; }
  S.sheet.orders[i]={theme:q.theme,tk:q.tk,items:q.items}; return true;
}
function addOrder(){
  const q=makeOrder(S.theme,S.pr.orderN,sheetUsed());
  if(!q){ S.sheet.note=['追加できる並び替え問題が見つかりませんでした。']; return; }
  S.sheet.orders.push({theme:q.theme,tk:q.tk,items:q.items});
}
function reFillRow(r){
  const f=S.sheet.fill; const cur=f.rows[r]; const keys=new Set(f.rows.map(x=>x.key));
  const P=pool(); const L=(f.tk==='mix'?P:P.filter(e=>e.tags.includes(f.tk))).filter(e=>!keys.has(e.key));
  let c=L; if(!c.length){ c=P.filter(e=>!keys.has(e.key)&&Math.abs(e.y-cur.y)<=150); }
  if(!c.length){ S.sheet.note=['入れ替えられるできごとが見つかりませんでした。']; return; }
  f.rows[r]=rand(c); sortFill(f);
}
function addFillRow(){
  const f=S.sheet.fill; if(f.rows.length>=MARU.length) return;
  const keys=new Set(f.rows.map(x=>x.key)); const P=pool();
  const c=(f.tk==='mix'?P:P.filter(e=>e.tags.includes(f.tk))).filter(e=>!keys.has(e.key));
  if(!c.length){ S.sheet.note=['このテーマで追加できるできごとがもうありません。']; return; }

}

// 並び替えの候補をたくさん出して、プリントに入れるものを選ぶ
function genCands(k,append){
  if(!append) S.cands=[];
  const seen=new Set(S.cands.map(c=>c.items.map(e=>e.id).sort().join(',')));
  const used=new Set(); S.cands.forEach(c=>c.items.forEach(e=>used.add(e.id)));
  const keep=S.lastTheme; let fails=0;
  while(S.cands.length<(append?S.cands.length+0:0)+k&&fails<k*4){
    S.avoidThemes=S.cands.slice(-3).map(c=>c.tk).filter(Boolean);
    const q=makeOrder(S.theme,S.pr.orderN,used);
    S.avoidThemes=[];
    if(!q){ fails++; continue; }
    const key=q.items.map(e=>e.id).sort().join(',');
    if(seen.has(key)){ fails++; continue; }
    seen.add(key); q.items.forEach(e=>used.add(e.id));
    S.cands.push({theme:q.theme,tk:q.tk,items:q.items,sel:false});
    if(append&&S.cands.length>=S.candTarget) break;
  }
  S.lastTheme=keep;
}

function renderPrint(){
  const pr=S.pr, sh=S.sheet;
  const opt=(id,vals,cur,unit)=>`<select class="sel" id="${id}">${vals.map(v=>`<option value="${v}" ${v===cur?'selected':''}>${v}${unit}</option>`).join('')}</select>`;
  let h=`<div class="pset">
    <div class="pset-row"><label for="prTitle">タイトル</label><input class="search" id="prTitle" value="${esc(pr.title)}"></div>
    <div class="pset-row"><label>並び替えの出し方</label>${omodeChips()}</div>
    <div class="pset-row"><label>並び替えの時代</label>${spanChips()}</div>
    <div class="pset-row"><label>易しすぎる問題</label>${obvChips()}</div>
    <div class="pset-row"><label>順番の重要度</label>${impChips()}</div>
    <div class="pset-row"><label>並び替え</label>${opt('prOrder',[0,1,2,3,4,5,6,8,10],pr.order,'問')}<select class="sel" id="prOrderN">${[['r','選択肢3つか4つ（混ぜる）'],[3,'選択肢3つずつ'],[4,'選択肢4つずつ'],[5,'選択肢5つずつ']].map(([v,l])=>`<option value="${v}" ${v===pr.orderN?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="pset-row"><label>年表の穴埋め</label>${opt('prFill',[0,4,6,8,10,12,15],pr.fill,'か所')}
      <button class="chip" data-prbank aria-pressed="${pr.bank}">語群をつける</button></div>
    <div class="pset-row"><label>入試形式</label>${opt('prExam',[0,1,2,3,4,5,6,8],pr.exam,'問')}<span class="hint-line">年表の時期・正誤・語句の組み合わせ・時期のできごと・同じころの世界・時代</span></div>
    <div class="pset-row"><label>記述</label>${opt('prEssay',[0,1,2,3,4],pr.essay,'問')}<span class="hint-line">指定語句：</span><button class="chip" data-prhint="1" aria-pressed="${S.hint}">つける</button><button class="chip" data-prhint="0" aria-pressed="${!S.hint}">つけない</button></div>
    <div class="pset-row"><label>解答</label><button class="chip" data-prans aria-pressed="${pr.answers}">解答ページをつける</button></div>
    ${S.custom.length?`<div class="pset-row"><label>選んだ問題</label><span class="cust">${S.custom.map((ids,i)=>`<span class="kw">${ids.length}件の並び替え <button class="x" data-rmcustom="${i}" aria-label="削除">×</button></span>`).join('')}</span></div>`:''}
    <div class="actions"><button class="btn" data-act="tolist2">一覧から問題を選ぶ</button><button class="btn" data-act="rebuild">問題を作り直す</button><button class="btn primary" data-act="print">印刷する</button></div>
    <p class="hint-line">印刷はA4たて向き。このプレビュー画面では印刷ボタンがはたらかないことがあります。そのときはダウンロード版のHTMLファイルをブラウザで開いて印刷してください。</p>
    ${sh.note.length?`<p class="warn">${sh.note.map(esc).join('<br>')}</p>`:''}
  </div>${candsHTML()}<div id="sheets">${sheetHTML(sh)}</div>`;
  $('#q').innerHTML=h;
}

function sheetHTML(sh){
  const pr=S.pr; let dai=0; let q='', a='';
  const themeNames=[...new Set([...sh.orders.map(o=>o.theme),sh.fill&&sh.fill.theme].filter(Boolean))];
  const eras=ERAS.map(e=>e[0]).filter(e=>S.eras.has(e)).join('・');
  const head=(sub)=>`<div class="sh-head"><div><div class="sh-title">${esc(pr.title)}${sub?`<span class="sh-sub">${sub}</span>`:''}</div>
    <div class="sh-meta">範囲：${esc(eras)}${S.theme!=='auto'&&S.theme!=='mix'?`／テーマ：${esc(THEMES[S.theme])}`:''}</div></div>
    ${sub?'':`<table class="sh-name"><tr><td>組</td><td>番</td><td class="nm">名前</td><td class="pt">／100</td></tr></table>`}</div>`;
  if(sh.orders.length){
    dai++;
    q+=`<section class="dai"><h4><span class="dn">${dai}</span>次のそれぞれのできごとを、年代の古い順に並べかえ、記号で答えなさい。</h4><ol class="sq">`+
      sh.orders.map((o,i)=>`<li><div class="sq-no">(${i+1})</div><div class="sq-body">${tools('order',i,o.custom?'並べ順を変える':'この問題を変える')}<ul class="opts">${o.items.map((e,j)=>`<li><span>${KANA[j]}</span>${plain(e)}</li>`).join('')}</ul>
      <div class="ansline">（ ${o.items.map(()=>'<span class="box"></span>').join(' → ')} ）</div></div></li>`).join('')+`</ol><div class="addrow"><button class="tbtn" data-q="add-order">＋ 並び替えを1問追加</button></div></section>`;
    a+=`<section class="dai"><h4><span class="dn">${dai}</span>並び替え</h4><ol class="alist">`+sh.orders.map((o,i)=>{
      const c=correctOrder(o.items);
      const st=flowSteps(c.map(k=>o.items[k]));
      const why=st.map((x,k)=>x.kind==='cause'?`<span class="why">${KANA[c[k]]}→${KANA[c[k+1]]}：${esc(x.t)}</span>`:'').join('');
      return `<li>(${i+1}) <b>${c.map(k=>KANA[k]).join(' → ')}</b><span class="ay">${c.map(k=>`${KANA[k]} ${yv(o.items[k])}${yu(o.items[k])}`).join('／')}</span>${why}</li>`;}).join('')+`</ol></section>`;
  }
  if(sh.fill){
    dai++; const f=sh.fill;
    q+=`<section class="dai"><h4><span class="dn">${dai}</span>次の年表の ${MARU[0]}〜${MARU[f.rows.length-1]} にあてはまる語句を${pr.bank?'、下の語群から選んで':''}答えなさい。</h4>
      <div class="addrow top"><span class="qtools"><button class="tbtn" data-q="re-fill" data-qi="0">年表ごと作り直す</button><button class="tbtn del" data-q="rm-fill" data-qi="0">消す</button></span></div>
      <table class="snen"><tbody>${f.rows.map((r,i)=>`<tr><td class="y">${yv(r)}${yu(r)}</td><td>${esc(r.text).replace('〔〕',`<span class="sblank">${MARU[i]}</span>`)}</td><td class="rowtool"><button class="tbtn" data-q="re-frow" data-qi="${i}" title="この行を変える">変える</button>${f.rows.length>2?`<button class="tbtn del" data-q="rm-frow" data-qi="${i}">消す</button>`:''}</td></tr>`).join('')}</tbody></table>
      <div class="addrow"><button class="tbtn" data-q="add-frow">＋ 年表に1行追加</button></div>
      ${pr.bank?`<div class="bank"><span class="bl">語群</span>${f.bank.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
      <div class="agrid">${f.rows.map((r,i)=>`<div><span>${MARU[i]}</span></div>`).join('')}</div></section>`;
    a+=`<section class="dai"><h4><span class="dn">${dai}</span>年表の穴埋め</h4><div class="agrid ans">${f.rows.map((r,i)=>`<div><span>${MARU[i]}</span>${esc(r.alts.join('／'))}</div>`).join('')}</div>${pr.bank&&f.extra&&f.extra.length?`<ol class="alist" style="margin-top:4px">${f.extra.map(c=>`<li><span class="why">語群の「${esc(c.key)}」は${ySpan(c.x)}の語句（「${esc(c.forKey)}」とまぎらわしい：${esc(c.why.slice(0,2).join('・'))}）。</span></li>`).join('')}</ol>`:''}</section>`;
  }
  if(sh.exams&&sh.exams.length){
    dai++;
    q+=`<section class="dai"><h4><span class="dn">${dai}</span>次の問いに答えなさい。</h4>`+sh.exams.map((x,i)=>`<div class="sx">${tools('exam',i)}<p>(${i+1}) ${x.stem}</p>${x.table?`<div class="xtbl">${x.table}</div>`:''}${x.box?`<div class="xbox">${x.box}</div>`:''}<div class="xopts${x.short?' short':''}">${x.options.map((o,k)=>`<span><b>${x.labels[k]}</b> ${o}</span>`).join('')}</div></div>`).join('')+
      `<div class="addrow"><button class="tbtn" data-q="add-exam">＋ 入試形式を1問追加</button></div></section>`;
    a+=`<section class="dai"><h4><span class="dn">${dai}</span>入試形式</h4><ol class="alist">${sh.exams.map((x,i)=>`<li>(${i+1}) <b>${x.labels[x.ans]}</b><span class="ay">${x.expl}</span>${x.det&&x.det.opts&&x.fmt!=='interval'?`<span class="why">${x.det.opts.map(o=>o.replace(/<[^>]+>/g,'')).join('<br>')}</span>`:''}${x.det&&x.det.hint?`<span class="why">${x.det.hint}</span>`:''}</li>`).join('')}</ol></section>`;
  }
  if(sh.essays.length){
    dai++;
    q+=`<section class="dai"><h4><span class="dn">${dai}</span>次の問いに答えなさい。</h4>`+sh.essays.map((e,i)=>`<div class="sess">${tools('essay',i)}${e.use&&e.use.length?`<span class="qtools"><button class="tbtn" data-q="tg-use" data-qi="${i}">${useOn(sh,i)?'語句を消す':'語句をつける'}</button></span>`:''}<p>(${i+1}) ${esc(e.q)}${useOn(sh,i)&&e.use&&e.use.length?`<span class="skw">${e.use.map(k=>'「'+esc(k)+'」').join('')}という語句を使うこと。</span>`:''}</p><div class="lines"></div></div>`).join('')+`<div class="addrow"><button class="tbtn" data-q="add-essay">＋ 記述を1問追加</button></div></section>`;
    a+=`<section class="dai"><h4><span class="dn">${dai}</span>記述（解答例）</h4><ol class="alist">${sh.essays.map((e,i)=>`<li>(${i+1}) ${esc(e.a)}<span class="ay">採点のポイント：${e.kw.map(k=>esc(k[0])).join('・')}</span></li>`).join('')}</ol></section>`;
  }
  if(!dai) return '<div class="empty">問題がありません。<div class="addrow"><button class="tbtn" data-q="add-order">＋ 並び替えを追加</button><button class="tbtn" data-q="add-fill">＋ 年表の穴埋めを追加</button><button class="tbtn" data-q="add-essay">＋ 記述を追加</button></div></div>';
  const missing=[!sh.orders.length&&'<button class="tbtn" data-q="add-order">＋ 並び替えを追加</button>',!sh.fill&&'<button class="tbtn" data-q="add-fill">＋ 年表の穴埋めを追加</button>',!(sh.exams&&sh.exams.length)&&'<button class="tbtn" data-q="add-exam">＋ 入試形式を追加</button>',!sh.essays.length&&'<button class="tbtn" data-q="add-essay">＋ 記述を追加</button>'].filter(Boolean).join('');
  if(missing) q+=`<div class="addrow">${missing}</div>`;
  let out=`<article class="sheet">${head('')}${q}</article>`;
  if(pr.answers) out+=`<article class="sheet ans-sheet">${head('解答')}${a}</article>`;
  return out;
}

/* ---------- 操作 ---------- */
function setMode(m){S.mode=m;try{localStorage.setItem('rk-mode',m)}catch(e){} S.lastTheme=null;renderControls();newQuestion();window.scrollTo({top:0});}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  const c=S.cur;
  if(b.dataset.mode){S.editing=null;setMode(b.dataset.mode);return;}
  if(b.dataset.edrank){ S.edRank=b.dataset.edrank; document.querySelectorAll('[data-edrank]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.edrank===S.edRank)); return; }
  if(b.dataset.edit){S.edRank=null;S.editing=b.dataset.edit;S.editFocus=true;renderList();return;}
  if(b.dataset.revive){b.disabled=true;setDeleted(b.dataset.revive,false).then(()=>{S.flash='復活しました。';renderList();});return;}
  if(b.dataset.restore!==undefined){const sid=S.editing; const rec=EDITS[sid]; const v=b.dataset.restore==='orig'?origOf(sid):rec.history[+b.dataset.restore].v; b.disabled=true;
    saveVersion(sid,clone(v)).then(ok=>{ if(ok){S.flash='文章をもどしました。';} renderList(); }); return;}
  if(b.dataset.lk){S.listKind=b.dataset.lk;S.editing=null;renderControls();renderList();return;}
  if(b.dataset.lf){S.listFilter=b.dataset.lf;S.editing=null;renderControls();renderList();return;}
  if(b.dataset.era){ if(S.eras.has(b.dataset.era)){ if(S.eras.size>1) S.eras.delete(b.dataset.era);} else S.eras.add(b.dataset.era); renderControls(); newQuestion(); return;}
  if(b.dataset.themePick){S.listTheme=S.listTheme===b.dataset.themePick?'all':b.dataset.themePick;renderControls();renderList();$('.list-head').scrollIntoView({block:'start',behavior:'smooth'});return;}
  if(b.dataset.sel!==undefined){const id=+b.dataset.sel; S.sel.has(id)?S.sel.delete(id):S.sel.add(id);
    const row=b.closest('.nen'); const on=S.sel.has(id); row.classList.toggle('on',on); b.setAttribute('aria-pressed',on); b.textContent=on?'✓':'＋'; renderSelBar(); return;}
  if(b.dataset.rank){ const k=b.dataset.rank; if(S.ranks.includes(k)){ if(S.ranks.length>1) S.ranks=S.ranks.filter(x=>x!==k); } else S.ranks=[...S.ranks,k].sort(); renderControls(); newQuestion(); return; }
  if(b.hasAttribute('data-rw')){ S.rankWeight=!S.rankWeight; renderControls(); newQuestion(); return; }
  if(b.hasAttribute('data-world')){S.world=!S.world;renderControls();newQuestion();return;}
  if(b.dataset.cand!==undefined){ const x=S.cands[+b.dataset.cand]; x.sel=!x.sel; const y=window.scrollY; renderPrint(); window.scrollTo({top:y}); return; }
  if(b.dataset.q&&S.sheet){
    const i=+(b.dataset.qi||0), sh=S.sheet; sh.note=[];
    switch(b.dataset.q){
      case 're-order': reOrder(i); break;
      case 'rm-order': { const o=sh.orders[i]; if(o.custom) S.custom=S.custom.filter(ids=>ids!==o.custom); sh.orders.splice(i,1); break; }
      case 'add-order': addOrder(); break;
      case 're-fill': sh.fill=makeFill(sh.fill.rows.length,sh.fill.tk==='mix'?'mix':(S.theme==='auto'?'auto':sh.fill.tk)); break;
      case 'rm-fill': sh.fill=null; break;
      case 'add-fill': sh.fill=makeFill(S.pr.fill||8); if(!sh.fill) sh.note=['年表の穴埋めを作れるだけのできごとがありません。']; break;
      case 're-frow': reFillRow(i); break;
      case 'rm-frow': sh.fill.rows.splice(i,1); sortFill(sh.fill); break;
      case 'add-frow': addFillRow(); break;
      case 're-essay': reEssay(i); break;
      case 'rm-essay': sh.essays.splice(i,1); break;
      case 'add-essay': addEssay(); break;
      case 'tg-use': { sh.noUse=sh.noUse||{}; const k=sh.essays[i].id; sh.noUse[k]=!useOn(sh,i); break; }
      case 're-exam': { const q=makeExam('rand',S.theme); if(q) sh.exams[i]=q; break; }
      case 'rm-exam': sh.exams.splice(i,1); break;
      case 'add-exam': { const q=makeExam('rand',S.theme); if(q){ sh.exams=sh.exams||[]; sh.exams.push(q);} else sh.note=['この条件では入試形式の問題を作れませんでした。']; break; }
    }
    const y=window.scrollY; renderPrint(); window.scrollTo({top:y}); return;
  }
  if(b.dataset.imp){S.ordImp=b.dataset.imp;renderControls();if(S.mode==='print'){buildSheet();renderPrint();}else newQuestion();return;}
  if(b.dataset.obv){S.noObvious=b.dataset.obv==='1';renderControls();if(S.mode==='print'){buildSheet();renderPrint();}else newQuestion();return;}
  if(b.dataset.ban){ const [x,y]=b.dataset.ban.split('~'); const k=[x,y].sort().join('~'); if(BAN.has(k)) BAN.delete(k); else BAN.add(k); saveBan(); render(); return; }
  if(b.dataset.span){S.span=b.dataset.span;renderControls();if(S.mode==='print'){buildSheet();renderPrint();}else newQuestion();return;}
  if(b.dataset.omode){S.omode=b.dataset.omode;renderControls();if(S.mode==='print'){buildSheet();renderPrint();}else newQuestion();return;}
  if(b.dataset.n){S.n=b.dataset.n==='r'?'r':+b.dataset.n;renderControls();newQuestion();return;}
  if(b.dataset.choice){S.choice=b.dataset.choice==='1';renderControls();if(S.answered)newQuestion();else render();return;}
  if(b.dataset.hintset){S.hint=b.dataset.hintset==='1';renderControls();if(c) c.text=($('#essayIn')||{}).value??c.text;render();return;}
  if(b.dataset.prhint){S.hint=b.dataset.prhint==='1'; if(S.sheet) S.sheet.noUse={}; renderPrint();return;}
  if(b.hasAttribute('data-prbank')){S.pr.bank=!S.pr.bank;renderPrint();return;}
  if(b.hasAttribute('data-prans')){S.pr.answers=!S.pr.answers;renderPrint();return;}
  if(b.dataset.rmcustom!==undefined){S.custom.splice(+b.dataset.rmcustom,1);buildSheet();renderPrint();return;}
  if(b.dataset.xf){S.examFmt=b.dataset.xf;renderControls();newQuestion();return;}
  if(b.dataset.xo!==undefined&&c&&!S.answered){c.given=+b.dataset.xo;S.answered=true;score(c.given===c.ans);render();return;}
  if(b.dataset.opt!==undefined&&c){judgeFill(c.options[+b.dataset.opt]);return;}
  if(b.dataset.pick!==undefined&&c){c.picked.push(+b.dataset.pick);render();return;}
  if(b.dataset.slot!==undefined&&c){c.picked.splice(+b.dataset.slot,1);render();return;}
  if(b.dataset.self&&c){const first=!c.self;c.self=b.dataset.self;if(first)score(c.self==='○');else{ const prevOk=c.prevSelf==='○',nowOk=c.self==='○'; if(prevOk!==nowOk){S.ok+=nowOk?1:-1;$('#sOk').textContent=S.ok;} }
    c.prevSelf=c.self;render();return;}
  switch(b.dataset.act){
    case 'reset': c.picked=[];render();break;
    case 'judge':
      if(c.type==='order'){S.answered=true;score(orderOk(c));render();}
      if(c.type==='essay'){c.text=$('#essayIn').value;S.answered=true;render();}
      break;
    case 'giveup': judgeFill('');break;
    case 'override': if(!c.ok){c.ok=true;S.ok++;S.streak++;$('#sOk').textContent=S.ok;$('#sStreak').textContent=S.streak;render();}break;
    case 'next': newQuestion();break;
    case 'selclear': S.sel.clear(); if(S.mode==='list') renderList(); renderSelBar(); break;
    case 'selplay': {
      const ids=[...S.sel]; S.mode='order'; renderControls(); S.answered=false; S.cur=customQuestion(ids); S.qno++; render(); window.scrollTo({top:0}); break; }
    case 'selprint': {
      S.custom.push([...S.sel]); S.sel.clear(); S.mode='print'; try{localStorage.setItem('rk-mode','print')}catch(e){} renderControls(); newQuestion(); window.scrollTo({top:0}); break; }
    case 'retry': S.answered=false; S.cur=customQuestion(c.custom); S.qno++; render(); break;
    case 'tolist': case 'tolist2': setMode('list'); break;
    case 'rebuild': buildSheet(); renderPrint(); break;
    case 'copen': S.candOpen=true; if(!S.cands||!S.cands.length) genCands(20); renderPrint(); break;
    case 'cclose': S.candOpen=false; renderPrint(); break;
    case 'cgen': genCands(20); renderPrint(); break;
    case 'cmore': S.candTarget=(S.cands||[]).length+20; genCands(20,true); renderPrint(); break;
    case 'cclear': S.cands.forEach(x=>x.sel=false); renderPrint(); break;
    case 'cadd': case 'creplace': {
      const picked=S.cands.filter(x=>x.sel).map(x=>({theme:x.theme,tk:x.tk,items:x.items.slice()}));
      if(b.dataset.act==='creplace'){ S.sheet.orders=picked; S.custom=[]; } else S.sheet.orders.push(...picked);
      S.cands.forEach(x=>x.sel=false); S.sheet.note=[`並び替えを${picked.length}問${b.dataset.act==='creplace'?'に置きかえました':'追加しました'}。`];
      renderPrint(); document.getElementById('sheets').scrollIntoView({behavior:'smooth'}); break; }
    case 'edcancel': S.editing=null; renderList(); break;
    case 'edsave': { const sid=S.editing; const r=readEditor(sid); if(r.err){$('#edErr').textContent=r.err;break;} b.disabled=true;
      saveVersion(sid,r.v).then(async ok=>{
        if(ok&&ITEM[sid].kind==='ev'&&S.edRank&&S.edRank!==itemOf(sid).rank){ const o=baseRec(sid); o.rank=S.edRank===itemOf(sid).rank0?null:S.edRank; o.updatedAt=Date.now(); ok=await Store.put(sid,o); }
        if(ok){S.editing=null;S.edRank=null;S.flash='保存しました。';} renderList(); }); break; }
    case 'eddel': { const sid=S.editing; S.editing=null; if(ITEM[sid].kind==='ev') S.sel.delete(itemOf(sid).id); b.disabled=true;
      setDeleted(sid,true).then(()=>{ S.flash='消しました。「消したもの」からいつでも復活できます。'; renderList(); renderSelBar(); }); break; }
    case 'bkcopy': { const t=$('#bkOut'); const done=()=>{b.textContent='コピーしました';}; try{ navigator.clipboard.writeText(t.value).then(done,()=>{t.select();}); }catch(e){ t.select(); } break; }
    case 'bkimport': { let m; try{ m=JSON.parse($('#bkIn').value); }catch(e){ S.flash='貼り付けた文字を読み取れませんでした。コピーした内容をそのまま貼り付けてください。'; renderList(); break; }
      b.disabled=true; if(Array.isArray(m.__ban)){ m.__ban.forEach(x=>BAN.add(x)); saveBan(); } (async()=>{ let n=0; for(const k in m){ if(ITEM[k]&&m[k]&&typeof m[k]==='object'){ await Store.put(k,m[k]); n++; } } S.flash=`${n}件の編集データを取り込みました。`; renderList(); })(); break; }
    case 'print': try{ window.print(); }catch(e){} break;
  }
});
document.addEventListener('change',ev=>{
  const id=ev.target.id, v=ev.target.value;
  if(id==='themeSel'){S.listTheme=v;renderList();}
  if(id==='genTheme'){S.theme=v;S.lastTheme=null;newQuestion();}
  if(id==='prOrder'){S.pr.order=+v;buildSheet();renderPrint();}
  if(id==='prOrderN'){S.pr.orderN=v==='r'?'r':+v;buildSheet();renderPrint();}
  if(id==='prFill'){S.pr.fill=+v;buildSheet();renderPrint();}
  if(id==='prExam'){S.pr.exam=+v;buildSheet();renderPrint();}
  if(id==='prEssay'){S.pr.essay=+v;buildSheet();renderPrint();}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='listQ'){S.q=ev.target.value;renderList();}
  if(ev.target.id==='prTitle'){S.pr.title=ev.target.value; document.querySelectorAll('.sh-title').forEach(t=>{const sub=t.querySelector('.sh-sub'); t.textContent=S.pr.title; if(sub) t.appendChild(sub);});}
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='fillForm'){ev.preventDefault();const v=$('#fillIn').value.trim(); if(v) judgeFill(v);}
});
function judgeFill(v){
  const c=S.cur; if(S.answered) return;
  c.given=v; c.ok=!!v&&c.target.alts.some(a=>norm(a)===norm(v));
  S.answered=true; score(c.ok); render();
}
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter'||ev.isComposing) return;
  if(!['order','fill','essay','exam'].includes(S.mode)) return;
  const tag=(ev.target.tagName||'').toLowerCase();
  if(['textarea','button','input','select'].includes(tag)) return;
  if(S.answered){ const n=$('[data-act="next"]'); if(n&&!n.disabled){ev.preventDefault();newQuestion();} }
  else { const j=$('[data-act="judge"]'); if(j&&!j.disabled){ev.preventDefault();j.click();} }
});

Store.loadLocal();
renderControls();
newQuestion();
})();
</script>
