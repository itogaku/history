<title>歴史ならべ道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{
  --paper:#F2F4F5; --surface:#FFFFFF; --surface2:#E8ECEF; --ink:#18212E; --muted:#5A6878; --line:#D3DAE1;
  --ai:#24476F; --ai-soft:#DCE6F1; --shu:#C04A33; --shu-soft:#F6E1DB;
  --ok:#2E7D4F; --ok-soft:#DDEFE3; --ng:#B3372B; --ng-soft:#F5DEDA;
  --e-kodai:#6E4F93; --e-chusei:#2F7457; --e-kinsei:#A2721C; --e-kindai:#A43F35; --e-gendai:#2A67A3; --e-world:#55606C;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11151B; --surface:#1A2029; --surface2:#232B36; --ink:#E4E9EF; --muted:#9AA7B6; --line:#313B48;
    --ai:#9DBDE3; --ai-soft:#22324A; --shu:#E8836C; --shu-soft:#3A2520;
    --ok:#6FC392; --ok-soft:#1C3326; --ng:#EE8A7E; --ng-soft:#3A2220;
    --e-kodai:#B597DA; --e-chusei:#72C39F; --e-kinsei:#DDB25E; --e-kindai:#E48A7F; --e-gendai:#7FB2E6; --e-world:#A4AFBB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151B; --surface:#1A2029; --surface2:#232B36; --ink:#E4E9EF; --muted:#9AA7B6; --line:#313B48;
  --ai:#9DBDE3; --ai-soft:#22324A; --shu:#E8836C; --shu-soft:#3A2520;
  --ok:#6FC392; --ok-soft:#1C3326; --ng:#EE8A7E; --ng-soft:#3A2220;
  --e-kodai:#B597DA; --e-chusei:#72C39F; --e-kinsei:#DDB25E; --e-kindai:#E48A7F; --e-gendai:#7FB2E6; --e-world:#A4AFBB;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand h1{font-family:var(--mincho);font-weight:900;font-size:30px;line-height:1.1;margin:0;letter-spacing:.04em}
.brand h1 span{color:var(--shu)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.score{display:flex;gap:14px;font-size:13px;color:var(--muted);align-items:baseline}
.score b{font-family:var(--mincho);font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;margin-inline:2px}

.panel{display:flex;flex-direction:column;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.tabs button{background:var(--surface);border:0;border-left:1.5px solid var(--ink);padding:10px 4px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tabs button:first-child{border-left:0}
.tabs button small{font-weight:400;font-size:11px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs button[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lab{font-size:12px;color:var(--muted);letter-spacing:.08em;min-width:4.5em}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{border-color:var(--c,var(--ai));background:color-mix(in srgb,var(--c,var(--ai)) 14%,var(--surface));font-weight:700}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip[aria-pressed="false"] .dot{opacity:.35}

.q{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qno{font-family:var(--mincho);font-weight:900;font-size:20px}
.tag{font-size:12px;padding:2px 10px;border-radius:4px;background:var(--ai-soft);color:var(--ai);font-weight:700}
.prompt{margin:0;font-weight:700}

.slots{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;align-items:center}
.slot{height:52px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mincho);font-weight:900;font-size:24px;background:var(--paper);position:relative}
.slot.filled{border-style:solid;border-color:var(--ai);background:var(--ai-soft);color:var(--ai)}
.slot .ord{position:absolute;top:2px;left:7px;font-family:var(--gothic);font-size:10px;font-weight:400;color:var(--muted)}
.slot.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.slot.ng{border-color:var(--ng);background:var(--ng-soft);color:var(--ng)}
.slots-arrow{display:none}

.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.card{width:100%;text-align:left;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.card:hover:not(:disabled){border-color:var(--ai)}
.card .kana{font-family:var(--mincho);font-weight:900;font-size:22px;text-align:center;border-right:1px solid var(--line);color:var(--ai)}
.card.used{opacity:.4}
.card:disabled{cursor:default}
.card b,.nen b{color:var(--ai)}
.card .meta{grid-column:2;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}

.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:6px;padding:8px 18px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.next{background:var(--shu);border-color:var(--shu);color:#fff}
.btn:disabled{opacity:.35;cursor:default}

.result{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.result.ok{background:var(--ok-soft)}
.result.ng{background:var(--ng-soft)}
.result.neutral{background:var(--surface2)}
.verdict{font-family:var(--mincho);font-weight:900;font-size:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.result.ok .verdict{color:var(--ok)} .result.ng .verdict{color:var(--ng)}
.verdict small{font-family:var(--gothic);font-weight:700;font-size:14px;color:var(--ink)}

.era{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:3px;color:#fff;background:var(--c);line-height:1.7;white-space:nowrap}
:root:not([data-theme="light"]) .era{color:var(--paper)}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .era{color:#fff} }
:root[data-theme="light"] .era{color:#fff}

/* 年表 */
.nenpyo{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.nen{display:grid;grid-template-columns:5.2em 1fr;gap:12px;padding:10px 4px;border-top:1px solid var(--line);align-items:baseline}
.nen:first-child{border-top:0}
.nen .y{font-family:var(--mincho);font-weight:700;font-size:18px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.nen .y small{font-size:11px;margin-left:1px}
.nen .t{display:flex;flex-direction:column;gap:2px}
.nen.target{background:var(--shu-soft);border-radius:4px}
.blank{display:inline-block;min-width:6em;border-bottom:2px solid var(--shu);color:var(--shu);font-weight:700;text-align:center;padding-inline:6px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-weight:700;text-align:left;display:flex;gap:10px;align-items:center}
.choice .k{font-family:var(--mincho);font-weight:900;color:var(--muted)}
.choice:hover:not(:disabled){border-color:var(--ai)}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.choice:disabled{cursor:default}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 200px;min-width:0;font:inherit;font-size:17px;padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}

/* ミニ年表 */
.tl{position:relative;height:84px;margin:4px 8px 0}
.tl .bar{position:absolute;left:0;right:0;top:42px;height:2px;background:var(--ink);opacity:.6}
.tl .pt{position:absolute;top:36px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.tl .pt i{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--ai)}
.tl .pt .lb{position:absolute;white-space:nowrap;font-size:12px;line-height:1.2;text-align:center}
.tl .pt .lb b{font-family:var(--mincho);font-size:15px;color:var(--ai)}
.tl .pt.up .lb{bottom:18px}
.tl .pt.dn .lb{top:18px}
.flow{display:flex;flex-direction:column;gap:0}
.flow-sum{margin:0 0 8px;font-size:14px;line-height:1.7;background:var(--surface);border-radius:6px;padding:8px 12px}
.fs-l,.why-l{display:inline-block;font-size:11px;font-weight:700;color:var(--paper);background:var(--ai);border-radius:3px;padding:0 6px;margin-right:6px;line-height:1.7;vertical-align:1px}
.why-l{background:var(--shu)}
.fl-item{display:grid;grid-template-columns:2em 5.6em 1fr;gap:8px;align-items:baseline;font-size:14px;padding:4px 0}
.fl-item .kana{font-family:var(--mincho);font-weight:900;color:var(--ai)}
.fl-item .y{font-family:var(--mincho);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.fl-step{display:grid;grid-template-columns:2em 1fr;gap:8px;font-size:13px;color:var(--muted);padding:2px 0 4px}
.fl-step .ar{justify-self:center;width:2px;background:var(--line);position:relative;min-height:22px}
.fl-step .ar::after{content:"";position:absolute;bottom:-2px;left:-4px;border:5px solid transparent;border-top-color:var(--line);border-bottom:0}
.fl-step.cause,.fl-step.genre{color:var(--ink)}
.why-l.gen{background:var(--ai)}
.bti{display:block;margin-bottom:2px}
.fs-l.tipl{background:var(--shu)}
.bexp .btip{margin-top:6px}
.cfl-sum{font-size:12.5px;line-height:1.7;padding:4px 0 8px;border-bottom:1px dashed var(--line);margin-bottom:6px}
.cfl-tip{color:var(--shu)}
.why.bsum{margin-bottom:2px}
.bankn{font-size:12px;color:var(--muted);align-self:center;margin-left:4px}
.fl-step.genre .ar{background:var(--ai)}
.fl-step.genre .ar::after{border-top-color:var(--ai)}
.fl-step.cause .ar{background:var(--shu)}
.fl-step.cause .ar::after{border-top-color:var(--shu)}
.cand-open{padding-top:12px}
.cands-wrap{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:1.5px dashed var(--line)}
.cands-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cands-head h3{margin:0;font-family:var(--mincho);font-weight:900;font-size:19px}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.cand{display:flex;flex-direction:column;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;font-size:13px;line-height:1.55}
.cand-sel{text-align:left;display:flex;flex-direction:column;gap:6px;border:0;background:transparent;padding:10px 12px;font:inherit;color:inherit;cursor:pointer;border-radius:8px}
.cand-exp{border-top:1px dashed var(--line);padding:6px 12px 10px}
.cand-exp summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--ai)}
.cfl{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.cfl-ev{font-size:13px;display:flex;gap:6px;align-items:baseline}
.cfl-ev b{font-family:var(--mincho);color:var(--ai)}
.cfl-y{font-family:var(--mincho);font-weight:700;font-variant-numeric:tabular-nums;min-width:4.5em}
.cfl-st{font-size:12px;color:var(--muted);border-left:2px solid var(--line);margin-left:6px;padding:1px 0 3px 10px;line-height:1.6}
.cfl-st.cause{color:var(--ink);border-left-color:var(--shu)}
.cfl-st.genre{color:var(--ink);border-left-color:var(--ai)}
.nolink{display:inline-block;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-right:6px;line-height:1.6}
.cand:hover{border-color:var(--ai)}
.cand.on{border-color:var(--ai);background:var(--ai-soft)}
.cand-top{display:flex;gap:6px;align-items:center}
.cand-no{font-family:var(--mincho);font-weight:900;font-size:16px;min-width:1.6em}
.cand-ck{margin-left:auto;font-size:12px;font-weight:700;color:var(--ai);white-space:nowrap}
.cand-items{display:flex;flex-direction:column;gap:2px}
.cand-items b{font-family:var(--mincho);margin-right:6px;color:var(--ai)}
.cand-ans{font-size:11.5px;color:var(--muted)}
.rkb{display:inline-block;font-size:10.5px;font-weight:900;border-radius:3px;padding:0 5px;margin-left:4px;line-height:1.6;border:1px solid currentColor}
.rkb.rkA{color:var(--shu)}.rkb.rkB{color:var(--ai)}.rkb.rkC{color:var(--muted)}
.chip.rk[aria-pressed="true"].rkcA{border-color:var(--shu);background:var(--shu-soft)}
.imp{font-size:11px;font-weight:700;border-radius:3px;padding:0 7px;line-height:1.8;border:1px solid currentColor;white-space:nowrap}
.imp.impA{color:var(--shu)}.imp.impB{color:var(--ai)}.imp.impC{color:var(--muted)}
.canon-l{display:inline-block;font-size:11px;font-weight:700;color:var(--shu);border:1px solid var(--shu);border-radius:3px;padding:0 5px;margin-right:6px;line-height:1.6}
.rkctl{display:inline-flex;align-items:center;gap:1px;margin-left:4px}
.rkctl .rkb{margin-left:0}
.rkbtn{font:inherit;font-size:9px;line-height:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:3px;padding:2px 3px;cursor:pointer}
.rkbtn:hover:not(:disabled){border-color:var(--ai);color:var(--ai)}
.rkbtn:disabled{opacity:.3;cursor:default}
.cand-del{font-size:11px;color:var(--ng);border:1px solid var(--ng);border-radius:3px;padding:0 5px;line-height:1.6;cursor:pointer;order:9;margin-left:6px}
.cand-del:hover{background:var(--ng-soft)}
.banbtn{display:inline-block;margin-left:8px;font:inherit;font-size:11px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;padding:0 6px;cursor:pointer;vertical-align:1px}
.banbtn:hover{border-color:var(--ng);color:var(--ng)}
.obv{display:inline-block;margin-left:6px;font-size:11px;color:var(--ng)}
.why{display:block;font-size:8.5pt;color:#222;margin-top:1px}
.answer-list{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.answer-list li{display:grid;grid-template-columns:2em 5.6em 1fr;gap:8px;align-items:baseline;font-size:14px}
.answer-list .kana{font-family:var(--mincho);font-weight:900;color:var(--ai)}
.answer-list .y{font-family:var(--mincho);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

/* 記述 */
.kw-list{display:flex;flex-wrap:wrap;gap:6px}
.kw{font-size:13px;border:1.5px solid var(--line);border-radius:4px;padding:1px 10px;background:var(--surface)}
.kw.hit{border-color:var(--ok);color:var(--ok);font-weight:700}
.kw.miss{border-color:var(--ng);color:var(--ng)}
textarea{width:100%;min-height:110px;font:inherit;font-size:16px;line-height:1.8;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);resize:vertical;
  background-image:linear-gradient(transparent calc(1.8em - 1px),var(--line) 1px);background-size:100% 1.8em;background-position:0 10px;background-attachment:local}
.model{border-left:3px solid var(--ai);padding:4px 0 4px 12px}
.model .h{font-size:12px;color:var(--muted);letter-spacing:.08em}
.self{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.self button{width:44px;height:40px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--mincho);font-weight:900;font-size:20px}
.self button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.empty{color:var(--muted);text-align:center;padding:24px}
.foot{font-size:12px;color:var(--muted);text-align:center}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px}
/* 年表一覧 */
.sel,.search{font:inherit;font-size:14px;padding:5px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
.search{flex:1 1 160px;min-width:0}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.list-head h2{font-family:var(--mincho);font-weight:900;font-size:22px;margin:0}
.list-head .cnt{font-size:13px;color:var(--muted)}
.era-h{font-family:var(--mincho);font-weight:900;font-size:17px;margin:14px 0 0;padding:4px 0 4px 10px;border-left:5px solid var(--c);display:flex;gap:10px;align-items:baseline}
.era-h small{font-family:var(--gothic);font-weight:400;font-size:12px;color:var(--muted)}
.nen .ths{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.th{border:1px solid var(--line);background:transparent;border-radius:3px;font-size:11px;padding:0 6px;color:var(--muted);line-height:1.6}
.th:hover,.th[aria-pressed="true"]{border-color:var(--ai);color:var(--ai)}
.nen .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
mark{background:var(--shu-soft);color:inherit;padding:0 1px}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.nen.pick,.nen.es-row{grid-template-columns:5.2em 1fr auto}
.nen.ed-row{grid-template-columns:5.2em 1fr}
.rowbtns{display:flex;flex-direction:column;gap:6px;align-items:center;align-self:center}
.btn.sm{padding:3px 10px;font-size:12px;border-width:1px;white-space:nowrap}
.btn.danger{border-color:var(--ng);color:var(--ng)}
.badge{font-size:11px;font-weight:700;color:var(--shu);border:1px solid var(--shu);border-radius:3px;padding:0 6px;margin-left:6px;line-height:1.6}
.badge.del{color:var(--muted);border-color:var(--muted)}
.nen.gone .t{opacity:.55;text-decoration:line-through;text-decoration-color:var(--muted)}
.lk-list{display:flex;flex-direction:column;border-top:1.5px solid var(--ink)}
.lk-row{padding:10px 4px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.lk-pair{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.lk-ev{display:inline-flex;gap:6px;align-items:baseline}
.lk-ev.gone{opacity:.5;text-decoration:line-through}
.lk-y{font-family:var(--mincho);font-weight:700;font-variant-numeric:tabular-nums}
.lk-ar{color:var(--shu);font-weight:900}
.lk-t{font-size:13px;color:var(--muted);line-height:1.6}
.th.use{border-color:var(--ai);color:var(--ai)}
.alts{font-size:12px;color:var(--muted);margin-left:4px}
.es-a{font-size:13px;color:var(--muted)}
.editor{display:flex;flex-direction:column;gap:6px;min-width:0}
.editor label{font-size:12px;color:var(--muted)}
.editor textarea{min-height:0;background-image:none;font-size:15px;line-height:1.6}
.editor .search{font-size:15px;flex:none;width:100%}
.ed-err{margin:0;font-size:13px;color:var(--ng);min-height:1em}
.hist{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.hist-h{font-size:12px;color:var(--muted);letter-spacing:.06em}
.hv{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px}

function hash(s){let h=5381;for(const c of s)h=((h*33)^c.codePointAt(0))>>>0;return h.toString(36)}
const ORIG_E=E.map(e=>({text:e.text,alts:e.alts.slice()}));
const ORIG_S=ESSAY.map(e=>({q:e.q,a:e.a,kw:e.kw.map(k=>k.slice()),use:(e.use||[]).slice()}));
E.forEach(e=>{e.sid='ev-'+(e.y<0?'m'+(-e.y):e.y)+'-'+hash(e.text)});
ESSAY.forEach(e=>{e.sid='es-'+e.y+'-'+hash(e.q)});
const ITEM={}; E.forEach((e,i)=>ITEM[e.sid]={kind:'ev',i}); ESSAY.forEach((e,i)=>ITEM[e.sid]={kind:'es',i});
let EDITS={};
const clone=o=>JSON.parse(JSON.stringify(o));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function origOf(sid){const t=ITEM[sid];return t.kind==='ev'?ORIG_E[t.i]:ORIG_S[t.i]}
function itemOf(sid){const t=ITEM[sid];return t.kind==='ev'?E[t.i]:ESSAY[t.i]}
function applyEdits(){
  E.forEach((e,i)=>{const o=EDITS[e.sid]; const c=o&&o.cur; const b=c||ORIG_E[i];
    e.text=b.text; e.alts=b.alts.slice(); e.key=e.alts[0]; e.rank=(o&&o.rank)||e.rank0; e.deleted=!!(o&&o.deleted); e.edited=!!c;});
  ESSAY.forEach((e,i)=>{const o=EDITS[e.sid]; const c=o&&o.cur; const b=c||ORIG_S[i];
    e.q=b.q; e.a=b.a; e.kw=b.kw.map(k=>k.slice()); e.use=(b.use||ORIG_S[i].use||[]).slice(); e.deleted=!!(o&&o.deleted); e.edited=!!c;});
}
const Store={mode:'local', db:null, canEdit:true, busy:false,
  loadLocal(){
    try{ const raw=localStorage.getItem('rk-edits'); if(raw){ const m=JSON.parse(raw); for(const k in m) if(ITEM[k]) EDITS[k]=m[k]; } }catch(e){}
    applyEdits();
  },
  async put(sid,body){
    EDITS[sid]=body; applyEdits();
    if(this.mode==='db'){
      try{ await this.db.doc('edits/'+sid).set(body); }
      catch(e){
        if(e&&e.code==='invalid_argument'){ this.canEdit=false; S.flash='このページを編集する権限がありません。'; }
        else if(e&&e.code==='unavailable'){ try{ await new Promise(r=>setTimeout(r,600+Math.random()*600)); await this.db.doc('edits/'+sid).set(body); return true; }catch(e2){ S.flash='保存できませんでした。時間をおいてもう一度試してください。'; } }
        else S.flash='保存できませんでした。時間をおいてもう一度試してください。';
        return false;
      }
    }else{
      try{ localStorage.setItem('rk-edits',JSON.stringify(EDITS)); }catch(e){ S.flash='このブラウザでは保存できませんでした。'; return false; }
    }
    return true;
  }
};
function refreshAfterEdit(){
  if(S.editing) return;
  if(S.mode==='list') renderList();
  else if(S.mode==='print'&&!S.sheet) newQuestion();
}
function baseRec(sid){ return EDITS[sid]?clone(EDITS[sid]):{kind:ITEM[sid].kind,deleted:false,cur:null,history:[]}; }
async function saveVersion(sid,v){
  const o=baseRec(sid);
  if(same(v,origOf(sid))) v=null;
  if(same(v,o.cur)) return true;
  o.history=[{at:Date.now(),v:o.cur},...(o.history||[])].slice(0,15);
  o.cur=v; o.updatedAt=Date.now();
  return Store.put(sid,o);
}
async function setDeleted(sid,flag){ const o=baseRec(sid); o.deleted=flag; o.updatedAt=Date.now(); return Store.put(sid,o); }

function readEditor(sid){
  const kind=ITEM[sid].kind; const err=m=>({err:m});
  if(kind==='ev'){
    const text=$('#edText').value.trim(); const alts=$('#edKey').value.split(/[／\/|｜]/).map(s=>s.trim()).filter(Boolean);
    const n=(text.match(/〔〕/g)||[]).length;
    if(n!==1) return err('文の中に、答えが入る場所を「〔〕」で1か所だけ入れてください。');
    if(!alts.length) return err('答えを入力してください。');
    return {v:{text,alts}};
  }
  const q=$('#edQ').value.trim(), a=$('#edA').value.trim();
  const kw=$('#edKw').value.split(/[、,，]/).map(g=>g.split(/[／\/|｜]/).map(s=>s.trim()).filter(Boolean)).filter(g=>g.length);
  if(!q) return err('問題文を入力してください。'); if(!a) return err('解答例を入力してください。'); if(!kw.length) return err('採点キーワードを1つ以上入力してください。');
  const use=$('#edUse').value.split(/[、,，・]/).map(x=>x.trim()).filter(Boolean);
  return {v:{q,a,kw,use}};
}
const fmtAt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function editorHTML(sid){
  const kind=ITEM[sid].kind, it=itemOf(sid), rec=EDITS[sid], orig=origOf(sid);
  let h=`<div class="editor" data-editor="${sid}">`;
  if(kind==='ev'){
    h+=`<label for="edText">文（答えが入る場所を〔〕で示す）</label><textarea id="edText" rows="3">${esc(it.text)}</textarea>
        <label for="edKey">答え（別の書き方も正解にするときは ／ で区切る）</label><input id="edKey" class="search" value="${esc(it.alts.join('／'))}">
        <label>重要度（A：重要　B：標準　C：発展）</label><div class="row">${['A','B','C'].map(k=>`<button class="chip rk rkc${k}" data-edrank="${k}" aria-pressed="${(S.edRank||it.rank)===k}">${k}</button>`).join('')}${it.rank!==it.rank0?`<span class="hint-line">（最初は${it.rank0}）</span>`:''}</div>`;
  }else{
    h+=`<label for="edQ">問題文</label><textarea id="edQ" rows="2">${esc(it.q)}</textarea>
        <label for="edA">解答例</label><textarea id="edA" rows="3">${esc(it.a)}</textarea>
        <label for="edUse">指定語句（問題に表示する。答えそのものにならない語を1〜2個）</label><input id="edUse" class="search" value="${esc((it.use||[]).join('、'))}">
        <label for="edKw">採点キーワード（、で区切る。同じ意味の別の語は ／ でつなぐ）</label><input id="edKw" class="search" value="${esc(it.kw.map(k=>k.join('／')).join('、'))}">`;
  }
  h+=`<p class="ed-err" id="edErr" role="alert"></p>
    <div class="actions"><button class="btn danger" data-act="eddel">この問題を消す</button><button class="btn" data-act="edcancel">閉じる</button><button class="btn primary" data-act="edsave">保存する</button></div>`;
  const hist=(rec&&rec.history)||[];
  if(rec&&rec.cur||hist.length){
    h+=`<div class="hist"><div class="hist-h">以前の文章</div>`;
    if(rec&&rec.cur) h+=`<div class="hv"><span class="hv-t"><span class="hv-at">最初の文章</span>${esc(verText(kind,orig))}</span><button class="btn sm" data-restore="orig">この文章にもどす</button></div>`;
    hist.forEach((x,i)=>{ if(x.v&&!same(x.v,rec.cur)) h+=`<div class="hv"><span class="hv-t"><span class="hv-at">${fmtAt(x.at)}まで</span>${esc(verText(kind,x.v))}</span><button class="btn sm" data-restore="${i}">この文章にもどす</button></div>`; });
    h+=`</div>`;
  }
  return h+`</div>`;
}
function verText(kind,v){ return kind==='ev'?v.text.replace('〔〕','〔'+v.alts[0]+'〕'):v.q+' → '+v.a; }
function editStats(){ let ed=0,del=0; for(const k in EDITS){ if(EDITS[k].deleted) del++; else if(EDITS[k].cur) ed++; } return {ed,del}; }

  const st=editStats();

function flowSteps(sorted,tk,gx,bi){
  const out=[]; const bst=bi!=null&&BANK[bi]&&BANK[bi].st&&BANK[bi].st.length===sorted.length-1?BANK[bi].st:null;
  for(let k=0;k<sorted.length-1;k++){
    const a=sorted[k], b=sorted[k+1];
    if(bst){ out.push({kind:BANK[bi].k==='l'?'cause':'genre',t:bst[k],g:tk}); continue; }
    // 同じ分野の問題は、すべて分野の流れで説明する（つながりと混ぜない）
    if(gx&&tk&&a.tags.includes(tk)&&b.tags.includes(tk)){ out.push({kind:'genre',t:genreText(tk,a,b),g:tk}); continue; }
    let t=linkBetween(a,b), kind='cause';
    if(!t){
      const g=sharedGenre(a,b,tk);
      if(g){ kind='genre'; t=genreText(g,a,b); out.push({kind,t,g}); continue; }
      kind='era';
      const pa=a.world?null:perLabel(a.per), pb=b.world?null:perLabel(b.per);
      if(pa&&pb&&pa!==pb) t=`${pa}時代のできごとから、${pb}時代のできごとへ。`;
      else if(a.y===b.y) t='同じ年のできごと。どちらが先でも正解。';
      else if(a.lab||b.lab) t='年代の古い順に。';
      else t=`${b.y-a.y}年あとのできごと。`;
    }
    out.push({kind,t});
  }
  return out;
}

function pickChain(list,n,avoid){
  const ids=new Set(list.map(e=>e.sid)); const next={};
  for(const k in LINKMAP){ const [a,b]=k.split('>'); if(ids.has(a)&&ids.has(b)) (next[a]=next[a]||[]).push(b); }
  const starts=shuffle(Object.keys(next)); if(!starts.length) return null;
  const bySid=Object.fromEntries(list.map(e=>[e.sid,e]));
  let best=null;
  for(const st of starts.slice(0,12)){
    const chain=[bySid[st]];
    while(chain.length<n){
      const c=(next[chain[chain.length-1].sid]||[]).map(x=>bySid[x]).filter(e=>chain.every(o=>o.y!==e.y));
      if(!c.length) break; chain.push(rand(c));
    }
    if(!best||chain.length>best.length) best=chain;
    if(best.length>=n) break;
  }
  if(!best||best.length<2) return null;
  const rest=shuffle(list.filter(e=>!best.includes(e)&&best.every(o=>Math.abs(o.y-e.y)>=1)&&!(avoid&&avoid.has(e.id))));
  const out=best.slice();
  for(const e of rest){ if(out.length>=n) break; if(out.every(o=>o.y!==e.y)) out.push(e); }
  return out.length>=n?out:null;
}
